  T({ id: 'h7-eur', u: 'H7', t: 'European traders: Portuguese, Dutch, English, French, Danes; Carnatic wars', h: 2.5,
    p: [
      '**Portuguese**: **Vasco da Gama** reached **Calicut (1498)**, Zamorin; **Cabral (1500)**; **Almeida** (1st viceroy, **Blue Water policy**; Battle of **Diu 1509**); **Albuquerque** took **Goa (1510)** from Bijapur, Malacca (1511), Hormuz (1515); **Nino da Cunha** made Goa capital (1530), got **Bassein (1534)** & **Diu (1535)**; **cartaz** passes; Goa Inquisition (1560); Hugli taken by Shah Jahan (1632); Bassein lost to Marathas (1739); Goa freed **1961**.',
      '**Dutch** (VOC, **1602**): Masulipatnam (1605), **Pulicat** (1610, HQ), Surat, Chinsura, Cochin (1663); lost **Colachel (1741)** to **Marthanda Varma** of Travancore and **Bedara (1759)** to the English.',
      '**English EIC**: charter **31 Dec 1600** (Elizabeth I); **Hawkins** at Jahangir’s court (1609); **Swally (1612)** win over Portuguese → **Surat factory (1613)**; **Thomas Roe (1615)**; **Fort St George, Madras (1639)** (Francis Day); **Bombay** (dowry of **Catherine of Braganza** 1661, leased to EIC 1668); **Job Charnock** at Sutanuti (1690) → **Calcutta** (Sutanuti, Kalikata, Govindpur, 1698); **Farrukhsiyar’s farman (1717)** — duty-free trade in Bengal for Rs 3000 a year.',
      '**French** (Colbert, **1664**): Surat (1668, **François Caron**), **Pondicherry (1674, François Martin)**, Chandernagore, Mahe, Karaikal, Yanam; **Dupleix** (governor 1742–54).',
      '**Danes**: **Tranquebar (1620)**, **Serampore** (missionaries); sold to British 1845.',
      '**1st Carnatic War (1746–48)**: Austrian Succession; **Battle of St Thome/Adyar (1746)** — small French force beat the Nawab; Treaty of **Aix-la-Chapelle** — Madras returned.',
      '**2nd (1749–54)**: succession fights in Hyderabad & Carnatic (**Chanda Sahib** vs **Muhammad Ali**); **Clive’s seizure of Arcot (1751)**; Dupleix recalled; Treaty of Pondicherry.',
      '**3rd (1756–63)**: Seven Years’ War; **Wandiwash (1760)** — **Eyre Coote** beat **Lally**; **Treaty of Paris (1763)**.',
      'Why English won: private joint-stock company vs French state company, **naval power**, Bengal’s wealth after Plassey, Industrial Revolution, disciplined army, stable government, credit/debt markets.'
    ],
    m: [['Order of first factories “Please Don’t Eat Dal Fry”', 'Portuguese (1498) → Dutch (Masulipatnam 1605) → English (Surat 1613) → Danes (Tranquebar 1620) → French (Surat 1668).'],
      ['Carnatic wars “A-A-W”', 'Adyar (1st), Arcot (2nd), Wandiwash (3rd).']],
    f: ['Bombay was given to Charles II as part of Catherine of Braganza’s dowry and leased to the Company for just £10 a year.', 'At Adyar (1746) about 230 French troops beat a Nawab army of about 10,000 — showing the power of disciplined infantry.'],
    d: 'European companies\n Portuguese — Goa — Albuquerque\n Dutch (VOC 1602) — Pulicat\n English (EIC 1600) — Surat → Madras → Bombay → Calcutta\n Danes — Tranquebar, Serampore\n French (1664) — Pondicherry — Dupleix',
    k: ['Give 5 reasons why the English beat the French, using one word each.'],
    r: ['Spectrum ch. 3 (Advent of the Europeans)'],
    q: [
      Q.mcq('Who captured Goa in 1510?', ['Almeida', 'Albuquerque', 'Nino da Cunha', 'Vasco da Gama'], 1, ''),
      Q.mcq('The Battle of Wandiwash was fought between:', ['English and Dutch', 'English and French', 'French and Marathas', 'English and Mysore'], 1, ''),
      Q.mt('Match the European power with its main settlement:', ['Portuguese', 'Dutch', 'French', 'Danes'], ['Goa', 'Pulicat', 'Pondicherry', 'Tranquebar'], '', ['Power', 'Settlement']),
      Q.mcq('Who defeated the Dutch at Colachel in 1741?', ['Hyder Ali', 'Marthanda Varma', 'Zamorin of Calicut', 'Robert Clive'], 1, ''),
      Q.ch('Arrange chronologically:', ['Vasco da Gama reaches Calicut', 'Formation of the Dutch VOC', 'Foundation of Fort St George', 'Foundation of the French Company'], '1498 → 1602 → 1639 → 1664.'),
      Q.ar('The Blue Water policy was adopted by Francisco de Almeida.', 'He believed Portuguese power should rest on control of the sea rather than land.', 0, '')
    ] });

  T({ id: 'h7-bri', u: 'H7', t: 'British expansion: Bengal, Mysore, Hyderabad, Awadh, Carnatic, Punjab; subsidiary alliance & lapse', h: 3.5,
    p: [
      '**Bengal Nawabs**: **Murshid Quli Khan** (1717; Murshidabad; revenue farming) → Shujauddin → Sarfaraz → **Alivardi Khan** (Maratha *bargi* raids) → **Siraj-ud-Daula** (Black Hole story, 1756).',
      '**Plassey (23 June 1757)** — **Clive** vs Siraj; traitors **Mir Jafar, Rai Durlabh, Jagat Seth, Omichand**. Mir Jafar → **Mir Qasim** (capital **Monghyr**; abolished internal duties for all) → **Buxar (22 Oct 1764)** — **Hector Munro** vs Mir Qasim + **Shuja-ud-Daula** + **Shah Alam II**.',
      '**Treaty of Allahabad (1765)**: **Diwani** of Bengal, Bihar, Orissa to EIC; **dual government (1765–72)** with naib diwans **Muhammad Reza Khan** & **Shitab Rai**; **Bengal famine 1770**; ended by **Warren Hastings (1772)**.',
      '**Mysore**: **Hyder Ali** → **Tipu Sultan**. Anglo-Mysore wars: **I (1767–69, Treaty of Madras)** · **II (1780–84, Treaty of Mangalore)** · **III (1790–92, Cornwallis, Treaty of Seringapatam** — half territory lost) · **IV (1799, Wellesley; Tipu killed)**. Tipu: Jacobin club, “tree of liberty”, embassies to France & Turkey, rockets, new calendar/coins.',
      '**Hyderabad**: Nizam-ul-Mulk Asaf Jah (1724); **first to accept subsidiary alliance (1798)**; Berar taken 1853.',
      '**Awadh**: Saadat Khan (1722), Safdar Jang, Shuja-ud-Daula (Buxar), **Asaf-ud-Daula** (Lucknow capital 1775; Bara Imambara); **1801 treaty** – half territory ceded; **Wajid Ali Shah** deposed & Awadh **annexed 1856** for “misgovernment”.',
      '**Carnatic** annexed **1801** (Wellesley). **Punjab**: **Ranjit Singh** (Lahore 1799; **Treaty of Amritsar 1809**, Sutlej boundary); **Anglo-Sikh wars I (1845–46: Mudki, Ferozeshah, Sobraon; Treaty of Lahore)** & **II (1848–49: Chillianwala, Gujrat)** → annexed **1849** (Dalhousie). Kashmir sold to **Gulab Singh (1846)**.',
      '**Ring-fence** policy (Warren Hastings) → **Subsidiary Alliance (Wellesley, 1798)**: British troops in the state paid by the ruler, a British **Resident**, no other Europeans, no alliances without consent. Order: **Hyderabad (1798) → Mysore (1799) → Tanjore (1799) → Awadh (1801) → Peshwa (1802) → Bhonsle & Sindhia (1803)**.',
      '**Doctrine of Lapse (Dalhousie)**: **Satara (1848)**, Jaitpur & Sambalpur (1849), Baghat, Udaipur, **Jhansi (1853)**, **Nagpur (1854)**.'
    ],
    m: [['“SJ-BJ-UN” for Lapse', 'Satara, Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur — “Sab Jagah Sambal-Bhai, Udaipur-Jhansi-Nagpur”.'],

  T({ id: 'h7-1857', u: 'H7', t: 'Revolt of 1857: causes, nature, impact', h: 2.5,
    p: [
      'Causes — **political**: Doctrine of Lapse, **annexation of Awadh**, Nana Saheb’s pension stopped, Mughal title to end. **Economic**: high revenue, ruin of artisans, Awadh **taluqdars** dispossessed (summary settlement 1856). **Socio-religious**: missionaries, reforms (sati ban 1829, **Widow Remarriage Act 1856**, **Religious Disabilities Act 1850**). **Military**: **General Service Enlistment Act 1856**, low pay, no promotion, loss of **bhatta**, **Enfield rifle greased cartridges**.',
      '**Mangal Pandey** (34th NI, **Barrackpore, 29 March 1857**). Outbreak at **Meerut, 10 May 1857** → Delhi seized 11 May → **Bahadur Shah II** proclaimed emperor (**General Bakht Khan** commander); Delhi retaken **Sept 1857** (Nicholson; Hodson killed the princes).',
      'Leaders: **Kanpur – Nana Saheb, Tantia Tope, Azimullah** · **Lucknow – Begum Hazrat Mahal** (son Birjis Qadir) · **Jhansi – Rani Lakshmibai** (died fighting near Gwalior, June 1858) · **Bareilly – Khan Bahadur Khan** · **Jagdishpur (Bihar) – Kunwar Singh** · **Faizabad – Maulvi Ahmadullah** · **Allahabad – Liyaqat Ali** · Assam – Maniram Dewan · Haryana – Rao Tula Ram · Odisha – Surendra Sai.',
      'British commanders: **Colin Campbell** (Kanpur, Lucknow), **Havelock & Outram** (Lucknow), **Hugh Rose** (Jhansi), **Henry Lawrence** (killed at Lucknow Residency). **Tantia Tope** executed April 1859.',
      'Nature: “**sepoy mutiny**” (Seeley, Lawrence) · “**First War of Independence**” (**V.D. Savarkar**, 1909) · “neither first, nor national, nor war of independence” (**R.C. Majumdar**) · “conspiracy” (Outram, Taylor) · “civilisation vs barbarism” (T.R. Holmes) · national revolt (**Disraeli**, Marx) · **peasant/popular revolt** (**Eric Stokes**, *The Peasant Armed*; **Rudrangshu Mukherjee**, *Awadh in Revolt*) · S.N. Sen, *Eighteen Fifty-Seven* (1957).',
      'Why it failed: limited area (south, Punjab, Bengal largely calm), many rulers helped the British (Sindhia, Holkar, Nizam, Sikh chiefs = “breakwaters”, Canning), no unified plan or leadership, poorer weapons, telegraph & railways for British, educated middle class aloof.',
      'Impact: **Government of India Act 1858** — Crown rule; **Secretary of State** + Council of India (15); Governor-General = **Viceroy** (Canning); **Queen’s Proclamation (1 Nov 1858, Allahabad)** — no more annexations, respect princes, religious non-interference; **Peel Commission (1859)** army reorganisation (more Europeans, “martial races”, divide & counterpoise); Mughal and Peshwa titles ended.'
    ],
    m: [['Centres & leaders: “Delhi-Bahadur, Kanpur-Nana, Lucknow-Hazrat, Jhansi-Lakshmi, Bihar-Kunwar”', 'Five core pairs — learn them like a cricket team list.'],
      ['Nature debate “S-S-M-S”', 'Sepoy mutiny (Seeley) vs Savarkar (war of independence) vs Majumdar (neither) vs Stokes (peasant armed).']],
    f: ['Kunwar Singh was about 80 years old when he led the revolt in Bihar.', 'Canning called the loyal princes “breakwaters to the storm”.'],
    d: '1857 timeline\n 29 Mar — Mangal Pandey, Barrackpore\n 10 May — Meerut outbreak\n 11 May — Delhi seized\n Sept — Delhi recaptured\n Jun 1858 — Rani Lakshmibai dies\n 1 Nov 1858 — Queen’s Proclamation\n Apr 1859 — Tantia Tope executed',
    k: ['Argue in one minute: was 1857 a “national” revolt?'],
    r: ['Spectrum ch. 7 (Revolt of 1857)'],
    q: [
      Q.mt('Match the centre with the leader:', ['Lucknow', 'Kanpur', 'Bareilly', 'Jagdishpur'], ['Begum Hazrat Mahal', 'Nana Saheb', 'Khan Bahadur Khan', 'Kunwar Singh'], '', ['Centre', 'Leader']),
      Q.mt('Match the author with the view of 1857:', ['V.D. Savarkar', 'R.C. Majumdar', 'Eric Stokes', 'T.R. Holmes'], ['First War of Independence', 'Neither first, nor national, nor a war of independence', 'The Peasant Armed', 'Conflict of civilisation and barbarism'], '', ['Author', 'View']),
      Q.mcq('The revolt of 1857 began at Meerut on:', ['29 March 1857', '10 May 1857', '11 May 1857', '4 June 1857'], 1, ''),
      Q.mcq('Who suppressed the revolt at Jhansi?', ['Colin Campbell', 'Hugh Rose', 'Henry Havelock', 'James Outram'], 1, ''),
      Q.ar('The Government of India Act 1858 ended the rule of the East India Company.', 'The revolt of 1857 exposed the weaknesses of Company administration.', 0, ''),
      Q.st('Which of the following were consequences of the revolt of 1857?', ['Office of Secretary of State for India created', 'Doctrine of Lapse abandoned', 'Ratio of European troops increased', 'Permanent Settlement introduced'], [true, true, true, false], 'Permanent Settlement was 1793.')
    ] });

  T({ id: 'h7-adm', u: 'H7', t: 'Company & Crown administration: Acts, civil service, judiciary, police, army, paramountcy, local self-government', h: 3.5,
    p: [
      '**Regulating Act 1773**: Governor-General of Bengal (**Warren Hastings**) + council of 4; **Supreme Court, Calcutta (1774)** — **Elijah Impey**; Bombay & Madras subordinated.',
      '**Pitt’s India Act 1784**: **Board of Control** (Crown) + Court of Directors = “**dual control**”. **Act of 1786**: Cornwallis could overrule his council.',
      '**Charter Act 1813**: ended Company’s trade monopoly (except **tea & China**); **Rs 1 lakh for education**; missionaries allowed. **Charter Act 1833**: **Governor-General of India** (**Bentinck**); ended all trade; **Law Commission (Macaulay)**; Indians not to be barred from office. **Charter Act 1853**: separate legislative council; **open competition for civil service**.',
      'Civil service: **Cornwallis** = “father of civil services”; **Fort William College (1800, Wellesley)**; **Haileybury (1806)**; competition from **1853**; **Satyendranath Tagore** first Indian ICS (1863–64); age cut to 19 (1876) → protests; **Statutory Civil Service (Lytton, 1878–79)**; **Aitchison Commission (1886)**; **Islington (1912)**; **Lee Commission (1923–24)** → **Public Service Commission (1926)**.',
      'Judiciary: **Warren Hastings (1772)** — district **Diwani & Faujdari Adalats**, Sadar Diwani & Sadar Nizamat Adalats; **Cornwallis Code (1793)** — separated revenue from justice; **IPC (1860)**, **High Courts Act (1861)**; **Ilbert Bill (1883, Ripon)**; **Federal Court (1937)**.',
      'Police: **Cornwallis** — thanas under **darogas**; **Police Commission 1860** → **Police Act 1861**; **Fraser Commission (Curzon, 1902–03)** — CID.',
      'Army: presidency armies; **Peel Commission (1859)**; **Eden Commission (1879)**; armies merged **1895**; Kitchener reforms; **Skeen Committee (1925)**; **IMA Dehradun (1932)**.',
      'Paramountcy: **Lord Hastings** (1813–23); after 1858 “**subordinate union**”; **Royal Titles Act 1876** (Kaisar-i-Hind; **Delhi Durbar 1877**); **Chamber of Princes (1921)**; **Butler Committee (1927)** — “paramountcy must remain paramount”.',
      'Local self-government: **Madras Corporation (1688)**; **Mayo’s resolution (1870)** — financial decentralisation; **Ripon’s resolution (1882)** = “**Magna Carta of local self-government**”; **Royal Commission on Decentralisation (1907–09)**; local self-government a **transferred subject** under the 1919 Act.'
    ],
    m: [['Acts “73-84-13-33-53-58”', 'Regulating → Pitt → Charter 1813 → Charter 1833 → Charter 1853 → GoI 1858: “Rabbit Plays Cricket, Catches Catches Gloriously”.'],
      ['Civil service commissions “A-I-L” = Aitchison 1886, Islington 1912, Lee 1923', 'Then PSC 1926.']],
    f: ['Lord Ripon is called the “father of local self-government in India”.', 'The Ilbert Bill row (Indians judging Europeans) led Europeans to form the “white mutiny” — and taught Indians the power of organised agitation.'],
    d: 'Evolution of central structure\n 1773 Governor-General of Bengal\n 1784 Board of Control (dual control)\n 1833 Governor-General of India\n 1853 separate legislative council\n 1858 Viceroy + Secretary of State\n 1861 portfolio system, legislative council',
    k: ['Narrate the evolution of the Governor-General’s title from 1773 to 1858.'],
    r: ['Spectrum: Constitutional, Administrative and Judicial Developments'],
    q: [
      Q.mt('Match the Act with its provision:', ['Regulating Act 1773', 'Pitt’s India Act 1784', 'Charter Act 1813', 'Charter Act 1833'], ['Supreme Court at Calcutta', 'Board of Control', 'Rs 1 lakh for education', 'Governor-General of India'], '', ['Act', 'Provision']),
      Q.mcq('Who is called the “father of local self-government” in India?', ['Lord Mayo', 'Lord Ripon', 'Lord Curzon', 'Lord Lytton'], 1, ''),
      Q.mcq('The Cornwallis Code was introduced in:', ['1786', '1790', '1793', '1805'], 2, ''),
      Q.ch('Arrange the civil service commissions chronologically:', ['Aitchison Commission', 'Islington Commission', 'Lee Commission', 'Federal Public Service Commission under 1935 Act'], ''),
      Q.mcq('The Butler Committee (1927) dealt with:', ['Civil services', 'Relations between the princely states and the paramount power', 'Indianisation of the army', 'Police reforms'], 1, ''),

  T({ id: 'h7-const', u: 'H7', t: 'Constitutional changes 1861–1935 (focus 1909–1935)', h: 3,
    p: [
      '**Indian Councils Act 1861** (Canning): **portfolio system**; nominated Indians in legislative council; ordinances. **Indian Councils Act 1892**: indirect “recommendation” for members; discuss budget; ask questions.',
      '**Morley–Minto Reforms (1909)**: **separate electorates for Muslims**; Imperial Legislative Council enlarged (to 60); non-official majority in provinces; supplementary questions; **S.P. Sinha** — first Indian in Viceroy’s Executive Council.',
      '**Montagu Declaration (20 Aug 1917)**: goal of **responsible government**.',
      '**GoI Act 1919 (Montagu–Chelmsford)**: **dyarchy in provinces** — **transferred** subjects (education, health, local govt, agriculture) under ministers vs **reserved** (finance, law & order, land revenue) under governor; **bicameral central legislature** (Council of State + Legislative Assembly); separate electorates extended (Sikhs, Indian Christians, Anglo-Indians, Europeans); High Commissioner in London; statutory review after 10 years.',
      '**Simon Commission** (1927; no Indian member) — “Simon Go Back”; **Lala Lajpat Rai** died after lathi-charge (Lahore, 1928). **Nehru Report (1928)**: dominion status, joint electorates; **Jinnah’s 14 Points (1929)**.',
      '**Round Table Conferences**: I (1930–31; Congress absent) · II (1931; **Gandhi** attended after **Gandhi–Irwin Pact**) · III (1932; Congress absent). **Communal Award (Aug 1932)** → **Poona Pact (Sept 1932)** — reserved seats for depressed classes within joint electorate.',
      '**GoI Act 1935**: proposed **All-India Federation** (never formed); **provincial autonomy** (dyarchy ended in provinces); **dyarchy at the centre** (not implemented); **3 lists** (Federal, Provincial, Concurrent; residuary with Governor-General); bicameral legislatures in 6 provinces; **Federal Court (1937)**; **RBI**; Burma separated; **Sindh & Orissa** new provinces (1936); ~10% franchise.',
      '1937 elections: Congress ministries in most provinces; resigned in **1939** over war. Nehru on 1935 Act: “**a machine with strong brakes but no engine**”.'
    ],
    m: [['“M-M-S-R-C-P-35”', 'Morley-Minto 1909 → Montford 1919 → Simon 1927 → RTCs 1930–32 → Communal Award → Poona Pact → GoI Act 1935.'],
      ['Dyarchy moves: 1919 provinces → 1935 centre', 'Dyarchy shifted from provinces (1919) to centre (1935 – never implemented).']],
    f: ['Lord Minto is called the “father of communal electorates”.', 'The 1935 Act was the longest Act passed by the British Parliament until then.'],
    d: 'Constitutional ladder\n 1861 Councils Act — portfolio system\n 1892 Councils Act — indirect election\n 1909 Morley–Minto — separate electorates\n 1919 Montford — provincial dyarchy\n 1935 GoI Act — provincial autonomy + federation plan',
    k: ['Explain dyarchy using the words “transferred” and “reserved”.'],
    r: ['Spectrum: Constitutional developments; Simon Commission; RTCs'],
    q: [
      Q.mcq('Separate electorates for Muslims were introduced by the:', ['Indian Councils Act 1892', 'Indian Councils Act 1909', 'GoI Act 1919', 'GoI Act 1935'], 1, ''),
      Q.mcq('Dyarchy at the centre was provided by the:', ['GoI Act 1919', 'GoI Act 1935', 'Indian Councils Act 1909', 'Cripps proposals'], 1, ''),
      Q.ch('Arrange chronologically:', ['Montagu Declaration', 'Simon Commission appointed', 'Nehru Report', 'Poona Pact'], '1917 → 1927 → 1928 → 1932.'),
      Q.mt('Match the event with the year:', ['Gandhi–Irwin Pact', 'Communal Award', 'Poona Pact', 'GoI Act'], ['March 1931', 'August 1932', 'September 1932', '1935'], '', ['Event', 'Year']),
      Q.ar('Under the GoI Act 1919, education was a transferred subject.', 'Transferred subjects were administered by ministers responsible to the legislature.', 0, ''),
      Q.st('Which of the following were features of the GoI Act 1935?', ['Provincial autonomy', 'All-India Federation', 'Federal Court', 'Dyarchy in provinces'], [true, true, true, false], 'Dyarchy in provinces was 1919; 1935 removed it.')
    ] });

(function (J) {

  T({ id: 'h8-econ', u: 'H8', t: 'Colonial economy: trade, drain, de-industrialisation, world wars', h: 3,
    p: [
      'Three stages (R.P. Dutt / Bipan Chandra): **mercantilist** (1757–1813: plunder + monopoly trade) → **industrial capital/free trade** (1813–1858: India as market & raw-material supplier) → **finance capital** (post-1860: railways, investment, banks).',
      'Trade composition flipped: from exporter of **cotton textiles** to exporter of **raw cotton, jute, indigo, opium, tea, wheat** and importer of **Lancashire cloth** & machinery. Opium to China in a **triangular trade**.',
      '**Drain theory**: **Dadabhai Naoroji** — *Poverty and Un-British Rule in India* (1901; earlier “Poverty of India” papers); **R.C. Dutt** — *Economic History of India* (1901–03); **M.G. Ranade, G.V. Joshi, Gokhale**.',
      'Drain components: **Home Charges** (salaries & pensions, India Office, interest on public debt, army costs), **guaranteed interest on railways**, profits & remittances of foreign capital. Recent: **Utsa Patnaik** (2018) estimated an enormous cumulative drain.',
      '**De-industrialisation**: loss of court patronage, machine-made imports, **one-way free trade** (high British duties on Indian cloth, low Indian tariffs), railways opened the interior, coercion of weavers. Bentinck: “the bones of the cotton-weavers are bleaching the plains of India.”',
      'Debate: **Morris D. Morris** doubted de-industrialisation vs **Bipan Chandra, Amiya Bagchi** (Gangetic Bihar: industrial workforce fell from ~18.6% in 1809–13 to ~8.5% in 1901).',
      '**De-urbanisation** of old centres (Dhaka, Murshidabad, Surat, Masulipatnam) vs growth of port cities.',
      '**WWI**: war gift & loans, inflation, Indian industry gains (Tata Steel); **Industrial Commission (1916)**; **discriminating protection (1923)**. **Great Depression (1929–33)**: price crash, gold outflow. **WWII**: inflation, **Bengal famine 1943**, **sterling balances** (India became a creditor), **Bombay Plan (1944)**.'
    ],
    m: [['Drain parts “H-G-P” = Home charges, Guaranteed interest, Profits', '“Hum Garib Paise bhejte the” — we poor sent money.'],
      ['Stages “M-I-F”', 'Mercantile → Industrial → Finance capital: “Money In Flight”.']],
    f: ['Naoroji was the first Indian elected to the British House of Commons (1892, Finsbury Central).'],
    d: 'Economic drain\n Home Charges\n  Salaries & pensions\n  India Office costs\n  Interest on debt\n Guaranteed railway interest\n Profits of foreign capital\n → Export surplus without return',
    k: ['Explain the drain theory to someone who thinks “colonies made money for everyone”.'],
    r: ['Spectrum: Economic Impact of British Rule', 'IGNOU MHI-107'],
    q: [
      Q.mcq('“Poverty and Un-British Rule in India” was written by:', ['R.C. Dutt', 'Dadabhai Naoroji', 'M.G. Ranade', 'G.K. Gokhale'], 1, ''),
      Q.mt('Match the economist with the work/idea:', ['Dadabhai Naoroji', 'R.C. Dutt', 'Morris D. Morris', 'Amiya Bagchi'], ['Drain theory', 'Economic History of India', 'Questioned de-industrialisation', 'Data on de-industrialisation in Gangetic Bihar'], '', ['Scholar', 'Work/Idea']),
      Q.st('Which of the following were parts of the “Home Charges”?', ['Pensions of British officials', 'Interest on public debt', 'India Office expenses', 'Land revenue paid by peasants'], [true, true, true, false], ''),
      Q.ar('India’s export surplus did not benefit its own economy in the colonial period.', 'It was used to pay Home Charges and other remittances to Britain.', 0, '')
    ] });

  T({ id: 'h8-land', u: 'H8', t: 'Land settlements, commercialisation, indebtedness, irrigation', h: 3,
    p: [
      '**Permanent Settlement (1793, Cornwallis)**: Bengal, Bihar, Orissa (+ Banaras, N. Madras); **zamindars = owners**; revenue fixed forever (~10/11 to state); **Sunset Law**; led to **patni** sub-infeudation; ~19% of British India.',
      '**Ryotwari**: **Alexander Read & Thomas Munro** (Baramahal 1792; Madras **1820**), Bombay (**Elphinstone**, Wingate & Goldsmid); revenue directly from **ryot**, revised every 20–30 years; ~51% of area; high rates.',
      '**Mahalwari**: **Holt Mackenzie (1822)**, **R.M. Bird & James Thomason (1833)** in North-Western Provinces, Punjab, Central India; **village/mahal** jointly responsible; **lambardar**; ~30% of area.',
      'Commercialisation: **indigo** (Bengal), **cotton** (Deccan — American Civil War boom then crash → **Deccan riots 1875**), **jute**, **tea** (Assam; indentured labour), coffee, opium, wheat (Punjab canal colonies). Often “**forced commercialisation**”.',
      'Rural indebtedness & land alienation → **Deccan Agriculturists’ Relief Act (1879)**, **Punjab Land Alienation Act (1900)**. Growth of **landless labour**.',
      'Irrigation: Western Yamuna canal restored; **Ganga Canal (1854, Proby Cautley)**; **Upper Bari Doab** (1859); **Godavari anicut (Arthur Cotton, 1852)**; Punjab **canal colonies**; **Irrigation Commission (1901–03)**.'
    ],
    m: [['“P-R-M = 19-51-30”', 'Permanent ~19%, Ryotwari ~51%, Mahalwari ~30% of British Indian area.'],
      ['Ryotwari = “Read & Munro”, Mahalwari = “Mackenzie”', 'R for Ryotwari & Read; M for Mahalwari & Mackenzie.']],
    f: ['Under the Sunset Law, many old zamindari families of Bengal lost their estates within a few decades.'],
    d: 'British land settlements\n Permanent (1793)\n  Zamindar = owner, fixed revenue\n  Bengal, Bihar, Orissa\n Ryotwari (1820)\n  Ryot pays directly, periodic revision\n  Madras, Bombay\n Mahalwari (1822/1833)\n  Village jointly pays\n  NWP, Punjab',
    k: ['Make a 3-column table from memory: settlement, region, who pays.'],
    r: ['Spectrum: Land revenue policy', 'IGNOU MHI-107'],
    q: [

      Q.mcq('The Deccan riots of 1875 were directed mainly against:', ['European planters', 'Moneylenders', 'Zamindars', 'Missionaries'], 1, ''),
      Q.mcq('The Ganga Canal (1854) is associated with:', ['Arthur Cotton', 'Proby Cautley', 'Colin Scott-Moncrieff', 'James Thomason'], 1, ''),

    ] });

  T({ id: 'h8-ind', u: 'H8', t: 'Industry, factory laws, labour; money, banking, railways, post & telegraph', h: 2.5,
    p: [
      'Industries: **cotton mills** (first in Bombay — **C.N. Davar, 1854**), **jute** (Rishra 1855; British-owned, Bengal), **coal** (Raniganj), **iron & steel** (Barakar 1875; **TISCO 1907**), tea, sugar, cement, paper. **Managing agency** system (Andrew Yule, Bird & Co.).',
      'Factory Acts: **1881** (Ripon; children 7–12 limited to 9 hrs) · **1891** (women 11 hrs, weekly holiday) · **1911** (men 12 hrs in textiles) · **1922** · **1934**. **N.M. Lokhande** — Bombay Mill Hands’ Association (1890).',
      'Labour: **Madras Labour Union (1918, B.P. Wadia)** · **Ahmedabad strike (1918, Gandhi)** → **Majoor Mahajan (1920, Anasuya Sarabhai)** · **AITUC (31 Oct 1920; Lala Lajpat Rai president, N.M. Joshi)** · **Trade Union Act 1926** · **Trade Disputes Act 1929** · **Meerut Conspiracy Case (1929)** · **Royal Commission on Labour (Whitley)** · Girni Kamgar Union (1928).',
      'Money: uniform silver **rupee (1835)**; **Paper Currency Act 1861**; fall of silver → **Herschell Committee (1893)** closed mints; **Fowler Committee (1898)** — gold exchange standard (Re = 1s 4d); **Chamberlain Commission (1913–14, Keynes)**; **Hilton Young (1926)** → **RBI (1 April 1935)**.',

  T({ id: 'h8-move', u: 'H8', t: 'Tribal & peasant movements', h: 3,

  T({ id: 'h8-soc', u: 'H8', t: 'Missionaries, new education, science; Indian Renaissance & reform; middle class; caste mobility', h: 4,
    p: [
      'Missions: **Serampore trio** — **William Carey, Marshman, Ward** (1800; Bible translations, press, Serampore College 1818); **Alexander Duff** (1830); Charter Act **1813** let missionaries in; **Lex Loci / Religious Disabilities Act 1850**.',
      'Education: **Calcutta Madrasa (1781, Warren Hastings)**, **Benares Sanskrit College (1791, Jonathan Duncan)**; Orientalist–Anglicist debate → **Macaulay’s Minute (2 Feb 1835)** & **English Education Act (1835, Bentinck)**; **downward filtration theory**.',
      '**Wood’s Despatch (1854)** — “Magna Carta of English education”: universities at **Calcutta, Bombay, Madras (1857)**, grants-in-aid, vernacular primary, teacher training, women’s education. Then **Hunter Commission (1882)**, **Indian Universities Act (1904, Curzon)**, **Sadler Commission (1917–19)**, **Hartog Committee (1929)**, **Wardha/Basic Education (1937)**, **Sargent Plan (1944)**.',
      'Science: **IACS (1876, Mahendralal Sircar)**, **J.C. Bose**, **P.C. Ray** (Bengal Chemicals), **C.V. Raman** (Raman effect 1928, Nobel 1930), **IISc (1909)**; Great Trigonometrical Survey (1802); Geological Survey (1851).',
      '**Raja Ram Mohan Roy**: *Tuhfat-ul-Muwahhidin*, **Atmiya Sabha (1815)**, **Brahmo Sabha (1828)**; campaign → **sati abolished 1829**; papers *Sambad Kaumudi*, *Mirat-ul-Akhbar*. **Debendranath Tagore** (Tattvabodhini Sabha 1839). **Keshab Chandra Sen** (split 1866; **Native Marriage Act 1872**) → **Sadharan Brahmo Samaj (1878)**. **Derozio** & **Young Bengal**.',
      '**Vidyasagar**: **Hindu Widows’ Remarriage Act 1856**, girls’ schools, *Barnaparichay*. **Prarthana Samaj (1867)** — Atmaram Pandurang, **Ranade, R.G. Bhandarkar**. Paramahansa Mandali (1849).',
      '**Arya Samaj (1875, Dayananda)** — *Satyarth Prakash*, “back to the Vedas”, **shuddhi**; **DAV** (Hansraj, Lajpat Rai) vs **Gurukul** (Shraddhanand). **Ramakrishna Mission (1897, Vivekananda)**; **Theosophical Society** (1875; Adyar; **Annie Besant**).',
      'Muslim: **Aligarh** (Sayyid Ahmad Khan; **MAO College 1875**), **Deoband (1866–67)**, **Ahmadiyya (1889)**, **Nadwatul Ulama (1894)**, **Faraizi** (Haji Shariatullah), **Wahabi** (Sayyid Ahmad of Rae Bareli). Sikh: **Singh Sabha (1873)**, **Akali movement** (Gurdwara Act 1925). Parsi: **Rahnumai Mazdayasnan Sabha (1851)**.',
      'Anti-caste: **Jyotiba Phule** — **Satyashodhak Samaj (1873)**, *Gulamgiri*; **Sree Narayana Guru** — SNDP (1903), Aravippuram (1888); **Ayyankali**; **Periyar** — Self-Respect (1925); **Justice Party (1916)**; **Vaikom (1924–25)** & **Guruvayur (1931–32)** satyagrahas; **Travancore Temple Entry Proclamation (1936)**; **Ambedkar** — **Mahad satyagraha (1927)**.',
      'New **middle class** (bhadralok: lawyers, teachers, journalists, clerks). **Caste associations** & claims to higher status after the **1901 census** (Risley); **Sanskritisation** (M.N. Srinivas).'
    ],
    m: [['Brahmo chain “R-D-K-S”', 'Ram Mohan (1828) → Debendranath → Keshab (1866 split) → Sadharan (1878).'],
      ['Education ladder “M-W-H-U-S-H-W-S”', 'Macaulay 1835 → Wood 1854 → Hunter 1882 → Universities Act 1904 → Sadler 1917 → Hartog 1929 → Wardha 1937 → Sargent 1944.']],
    f: ['Ram Mohan Roy died in Bristol, England (1833), where his tomb still stands.', 'Vidyasagar arranged the first legal widow remarriage in Calcutta in December 1856.'],
    d: 'Reform movements map\n Bengal — Brahmo Samaj, Young Bengal, Vidyasagar\n Maharashtra — Prarthana Samaj, Satyashodhak\n Punjab/North — Arya Samaj, Singh Sabha\n South — SNDP, Self-Respect, Justice Party\n Muslim — Aligarh, Deoband, Ahmadiyya\n Pan-India — Ramakrishna Mission, Theosophy',
    k: ['Compare reformist (Brahmo, Aligarh) and revivalist (Arya, Deoband) movements in 3 points.'],
    r: ['Spectrum: Socio-religious reform movements; Development of education'],
    q: [
      Q.mt('Match the organisation with the founder:', ['Satyashodhak Samaj', 'Prarthana Samaj', 'Arya Samaj', 'Self-Respect Movement'], ['Jyotiba Phule', 'Atmaram Pandurang', 'Dayananda Saraswati', 'E.V. Ramasamy (Periyar)'], '', ['Organisation', 'Founder']),
      Q.mcq('Which document is called the “Magna Carta of English education in India”?', ['Macaulay’s Minute', 'Wood’s Despatch', 'Hunter Commission report', 'Sadler Commission report'], 1, ''),
      Q.ch('Arrange in chronological order:', ['Brahmo Sabha', 'Prarthana Samaj', 'Arya Samaj', 'Ramakrishna Mission'], '1828 → 1867 → 1875 → 1897.'),
      Q.mcq('The Native Marriage Act of 1872 was the result of efforts of:', ['Ram Mohan Roy', 'Keshab Chandra Sen', 'Vidyasagar', 'Debendranath Tagore'], 1, ''),
      Q.ar('Macaulay supported English as the medium of higher education.', 'He believed in the downward filtration of Western knowledge.', 0, ''),
      Q.mt('Match the satyagraha with the year:', ['Vaikom', 'Mahad', 'Guruvayur', 'Temple Entry Proclamation (Travancore)'], ['1924–25', '1927', '1931–32', '1936'], '', ['Event', 'Year'])
    ] });

  T({ id: 'h8-wom', u: 'H8', t: 'Women’s question; press & public opinion; languages, literature & arts', h: 3,
    p: [
      'Laws: **sati abolition (1829)**, **Widow Remarriage (1856)**, **Native Marriage Act (1872)**, **Age of Consent Act (1891; Malabari, Rukhmabai & Phulmoni cases)**, **Sarda Act / Child Marriage Restraint (1929)**, **Hindu Women’s Right to Property (1937)**, **Hindu Code Bills** (passed 1955–56).',
      'Women pioneers: **Savitribai Phule** (girls’ school, Pune 1848), **Pandita Ramabai** (Arya Mahila Samaj 1882, Sharada Sadan), **Tarabai Shinde** (*Stri Purush Tulana*), **Rassundari Devi** (*Amar Jiban*), **Rokeya Sakhawat Hossain** (*Sultana’s Dream*), **Anandibai Joshi** (first Indian woman doctor), **Kadambini Ganguly** (graduate 1883, spoke at INC 1890).',
      'Organisations: **Bharat Stree Mahamandal (1910, Sarla Devi Chaudhurani)**, **Women’s Indian Association (1917; Besant, Margaret Cousins)**, **National Council of Women in India (1925)**, **All India Women’s Conference (1927)**. **Muthulakshmi Reddy** first woman legislator (1927).',
      'Press: **Samachar Darpan (1818)**, **Sambad Kaumudi (1821)**, **Bombay Samachar (1822)**, **Udant Martand (1826, first Hindi)**, **Hindoo Patriot (1853)**, **Amrita Bazar Patrika (1868)** (switched to English overnight in 1878), **The Hindu (1878)**, **Kesari & Mahratta (1881, Tilak)**, **Tribune (1881)**, **Al-Hilal (1912, Azad)**, **Young India & Navajivan (Gandhi)**, **Harijan (1933)**, **Mooknayak (1920, Ambedkar)**.',
      'Press laws: **Licensing Regulations (1823)** → **Metcalfe Act (1835)** (“liberator of the press”) → **Vernacular Press Act (1878, Lytton)**, repealed by **Ripon (1882)** → Newspapers Act 1908 → **Indian Press Act 1910**.',
      'Literature: **Bankim** (*Anandamath* 1882 – “Vande Mataram”), **Michael Madhusudan Dutt** (blank verse), **Tagore** (*Gitanjali*, Nobel 1913), **Bharatendu Harishchandra** (modern Hindi), **Premchand** (*Godan*), **Iqbal**, **Hali**, **Subramania Bharati**, **Veeresalingam** (Telugu), **Chandu Menon** (*Indulekha*), **Fakir Mohan Senapati** (Odia).',
      'Arts: **Company paintings**, **Kalighat pat**, **Raja Ravi Varma** (oleographs), **Bengal School** (**Abanindranath** — *Bharat Mata*; **E.B. Havell**; **Nandalal Bose** — Haripura posters), **Amrita Sher-Gil**, **Jamini Roy**.',
      'Music & performance: **V.D. Paluskar** (Gandharva Mahavidyalaya 1901), **V.N. Bhatkhande** (thaat system), Parsi theatre, **IPTA (1943)**, **Rukmini Devi Arundale** (Kalakshetra 1936), **Vallathol** (Kerala Kalamandalam 1930), Uday Shankar.'

    m: [['Women laws “29-56-72-91-29-37”', 'Sati 1829, Widow remarriage 1856, Native Marriage 1872, Age of Consent 1891, Sarda 1929, Property 1937.'],
      ['Press laws “L-M-V-R”', 'Licensing 1823 → Metcalfe 1835 → Vernacular 1878 → Ripon repeal 1882.']],
    f: ['Amrita Bazar Patrika turned from Bengali to English overnight to escape the Vernacular Press Act, which targeted only Indian-language papers.', 'Savitribai Phule was pelted with mud on her way to school, so she carried an extra sari to change into.'],
    d: 'Women’s organisations\n 1910 Bharat Stree Mahamandal\n 1917 Women’s Indian Association\n 1925 National Council of Women in India\n 1927 All India Women’s Conference',

    q: [
      Q.mcq('The Vernacular Press Act was passed by:', ['Lord Lytton', 'Lord Ripon', 'Lord Curzon', 'Lord Dufferin'], 0, ''),
      Q.mt('Match the newspaper with its founder:', ['Kesari', 'Al-Hilal', 'Mooknayak', 'Sambad Kaumudi'], ['B.G. Tilak', 'Abul Kalam Azad', 'B.R. Ambedkar', 'Ram Mohan Roy'], '', ['Paper', 'Founder']),
      Q.mcq('The Sarda Act (1929) concerned:', ['Widow remarriage', 'Child marriage', 'Sati', 'Female infanticide'], 1, ''),

/* src/data/h9.js */
/* UNIT IX — National movement & India after 1947 */
(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'h9-inc', u: 'H9', t: 'Rise of nationalism; INC 1885–1905; Moderates & Assertive nationalists', h: 3,
    p: [
      'Roots: administrative unification, **English education**, press, rediscovery of the past (Orientalists), **economic critique**, racial arrogance (**Ilbert Bill 1883**), **Lytton’s policies** (Vernacular Press Act, **Arms Act 1878**, Delhi Durbar during famine, ICS age cut), railways, middle class.',
      'Pre-Congress bodies: **Landholders’ Society (1838)** · British Indian Association (1851) · **East India Association (1866, London, Naoroji)** · **Poona Sarvajanik Sabha (1870, Ranade)** · **Indian Association (1876, Surendranath Banerjea & Ananda Mohan Bose)** — Indian National Conference (1883) · **Madras Mahajan Sabha (1884)** · **Bombay Presidency Association (1885)**.',
      '**INC: 28 Dec 1885, Gokuldas Tejpal Sanskrit College, Bombay**; 72 delegates; **A.O. Hume**; president **W.C. Bonnerjee**. “**Safety-valve**” theory (Lajpat Rai, Wedderburn’s account) vs “**lightning conductor**” (Gokhale; Bipan Chandra).',
      'Early presidents: **1886 Naoroji** · **1887 Badruddin Tyabji** (first Muslim) · **1888 George Yule** (first Englishman) · 1890 Pherozeshah Mehta · 1895 Surendranath Banerjea · **1905 Gokhale (Benares)** · **1906 Naoroji (Calcutta — “Swaraj”)** · **1907 Surat split (Rash Behari Ghosh)**.',
      '**Moderates** (Naoroji, Mehta, Gokhale, Banerjea, Wacha, Ranade): “**prayer, petition, protest**”; demands — expanded councils, simultaneous ICS exams, cut military expenses, separate judiciary & executive; gave the **economic critique** (drain). **Aurobindo’s “New Lamps for Old” (1893–94)** called it “political mendicancy”.',
      '**Assertive/Extremist** (**Lal–Bal–Pal** + Aurobindo): causes — Moderates’ failure, **Curzon’s policies** (Calcutta Corporation Act 1899, Official Secrets Act 1904, Universities Act 1904, **Partition 1905**), **Japan’s victory over Russia (1905)**, Ethiopia’s win over Italy (1896); methods — **swadeshi, boycott, national education, passive resistance**.',
      '**Tilak**: *Kesari*/*Mahratta*, **Ganapati (1893)** & **Shivaji (1895–96)** festivals, “**Swaraj is my birthright**”.'
    ],
    m: [['INC firsts “B-N-T-Y”', 'Bonnerjee 1885 (first), Naoroji 1886, Tyabji 1887 (first Muslim), Yule 1888 (first Englishman) — “Big New Tea Yard”.'],
      ['Moderates’ 3 Ps', 'Prayer, Petition, Protest.']],
    f: ['Dadabhai Naoroji was INC president three times (1886, 1893, 1906).', 'The 1885 session was shifted from Poona to Bombay because of cholera in Poona.'],
    d: 'Phases of the national movement\n 1885–1905 Moderates\n 1905–1918 Assertive nationalists & revolutionaries\n 1919–1947 Gandhian mass movements\n Parallel: revolutionaries, Left, communal politics',
    k: ['Debate: Was INC a “safety valve”? Give the theory and the counter-argument.'],
    r: ['Spectrum: Indian National Movement 1858–1905; Moderates & Extremists', 'Bipan Chandra et al., India’s Struggle for Independence'],
    q: [
      Q.mcq('The first session of the INC was presided over by:', ['Dadabhai Naoroji', 'W.C. Bonnerjee', 'A.O. Hume', 'Surendranath Banerjea'], 1, ''),
      Q.mcq('The first Muslim president of the INC was:', ['Rahimtulla Sayani', 'Badruddin Tyabji', 'Nawab Syed Muhammad', 'M.A. Ansari'], 1, ''),
      Q.mt('Match the organisation with the founder:', ['East India Association', 'Poona Sarvajanik Sabha', 'Indian Association', 'Landholders’ Society'], ['Dadabhai Naoroji', 'M.G. Ranade (and others)', 'Surendranath Banerjea', 'Dwarkanath Tagore (and others)'], '', ['Body', 'Founder']),
      Q.mcq('“New Lamps for Old” criticising the Moderates was written by:', ['B.G. Tilak', 'Aurobindo Ghosh', 'Lala Lajpat Rai', 'B.C. Pal'], 1, ''),
      Q.ch('Arrange chronologically:', ['Indian Association', 'Indian National Conference', 'Indian National Congress', 'Surat split'], '1876 → 1883 → 1885 → 1907.'),
      Q.ar('The “safety valve” theory says the INC was founded to let off Indian discontent harmlessly.', 'A.O. Hume, a retired British official, took the initiative to found the INC.', 1, 'Both true, but Hume’s role alone does not prove the theory.')
    ] });

  T({ id: 'h9-swad', u: 'H9', t: 'Swadeshi & Swaraj (1905–1918); early revolutionaries; Home Rule', h: 3,
    p: [
      '**Partition of Bengal**: announced July 1905, effective **16 Oct 1905** (Curzon) — observed as day of mourning, **raksha bandhan** (Tagore); **Swadeshi movement** began **7 Aug 1905** (Calcutta Town Hall boycott resolution).',
      'Swadeshi: boycott of foreign goods, **national education** (**Bengal National College 1906**, Aurobindo principal; National Council of Education), swadeshi enterprises (**Bengal Chemicals**, Banga Lakshmi Cotton Mills), samitis (**Swadesh Bandhab Samiti – Ashwini Kumar Dutt**), songs (“Amar Sonar Bangla”). **V.O. Chidambaram Pillai** — Swadeshi Steam Navigation Co. (Tuticorin).',

/* src/data/h10.js */
/* UNIT X — Historical method, research methodology & historiography */
(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'h10-meth', u: 'H10', t: 'Nature of history: scope, objectivity & bias, science or art, causation, auxiliary sciences, regional history', h: 2.5,
    p: [
      '“History” from Greek **historia** = inquiry. **Herodotus** first used it for a work of history. Scope: political → social, economic, cultural, environmental, gender, global.',
      '**Objectivity & bias**: **Ranke** — “*wie es eigentlich gewesen*” (as it actually was). **E.H. Carr** — facts are like fish on a slab; the historian chooses; history = “an **unending dialogue between the present and the past**”. **Croce** — “**all history is contemporary history**”. Bias types: personal, national, racial/religious, ideological, and of sources.',
      '**Science?** Positivists (Comte, **Buckle**, **J.B. Bury** — “history is a science, no less and no more”) vs **art** (G.M. Trevelyan — literary narrative) vs **social science** (uses concepts of sociology, economics). Carr: history is a science in a broad sense.',
      '**Causation**: multiple causes; immediate vs underlying; Carr ranks causes; “**Cleopatra’s nose**” (accident/chance) debate. **Imagination**: **Collingwood** — historical imagination & **re-enactment** of past thought.',
      '**Auxiliary sciences**: archaeology, **epigraphy**, **palaeography**, **numismatics**, **diplomatics** (study of documents — **Mabillon**, *De re diplomatica*, 1681), **sigillography** (seals), **chronology**, **genealogy**, philology, geography, statistics.',
      '**Regional history**: corrects nation-centred narratives, uses local sources (bakhars, buranjis, temple records), explains regional identity & state formation (e.g., Burton Stein, Hermann Kulke, Muzaffar Alam).',
      'Recent trends in Indian history: history from below, gender, Dalit, environmental, oral, cultural, digital & public history.'
    ],
    m: [['Big quotes “R-C-C-C”', 'Ranke (as it actually was) · Carr (unending dialogue) · Croce (contemporary history) · Collingwood (history of thought).'],
      ['Auxiliary “E-P-N-D-S”', 'Epigraphy, Palaeography, Numismatics, Diplomatics, Sigillography.']],
    f: ['Pascal’s quip — “if Cleopatra’s nose had been shorter, the whole face of the world would have changed” — is used to discuss chance in history.'],
    d: 'Is history a science?\n Yes — Comte, Buckle, Bury (laws, method)\n No — art — Trevelyan (narrative)\n Middle — Carr (science in a special sense)\n Idealists — Collingwood, Croce (thought, present)',
    k: ['Defend “history is a science” and then attack it — 30 seconds each.'],
    r: ['E. Sreedharan ch. 1', 'E.H. Carr, What is History? (Drive)'],
    q: [
      Q.mt('Match the thinker with the statement:', ['Leopold von Ranke', 'E.H. Carr', 'Benedetto Croce', 'R.G. Collingwood'], ['History as it actually happened', 'Unending dialogue between present and past', 'All history is contemporary history', 'All history is the history of thought'], '', ['Thinker', 'Statement']),
      Q.mcq('“History is a science, no less and no more” was said by:', ['G.M. Trevelyan', 'J.B. Bury', 'E.H. Carr', 'Lord Acton'], 1, ''),
      Q.mcq('Diplomatics as an auxiliary science deals with:', ['Seals', 'Documents and charters', 'Coins', 'Inscriptions on stone'], 1, 'Mabillon founded it.'),
      Q.ar('Complete objectivity in history is difficult to achieve.', 'The historian selects and interprets facts from his or her own standpoint.', 0, '')
    ] });

  T({ id: 'h10-res', u: 'H10', t: 'Research methodology: heuristics, criticism, hypothesis, sources, notes, footnotes, bibliography, thesis, plagiarism', h: 3,
    p: [
      'Steps: **selection of topic** → review of literature → **hypothesis** → **heuristics** (search & collection of sources) → **criticism** → **synthesis** → **presentation/exposition**.',
      '**Hypothesis** = tentative explanation to be tested; guides data collection; can be rejected or modified.',
      '**Primary sources** (contemporary, first-hand: documents, inscriptions, diaries, interviews) vs **secondary** (later works based on primary). “Original” vs “transit” sources: originals are the first records; transit (derived) ones reach us through copies or retellings.',
      '**External criticism** (lower criticism) = **authenticity**: date, author, place, forgery, provenance. Example: **Lorenzo Valla (1440)** proved the **Donation of Constantine** a forgery by its language.',
      '**Internal criticism** (higher criticism) = **credibility**: meaning, author’s competence, honesty, bias. **Positive** (understanding what the author meant) & **negative** (testing whether to believe it) criticism.',
      'Note-taking: card/slip system, one idea per card, full reference. **Footnotes** abbreviations: **ibid.** (same as just cited), **op. cit.** (work already cited), **loc. cit.** (same place), **cf.** (compare), **et al.**, **passim** (here and there), **sic** (thus, error in original), **viz.** (namely).',
      '**Bibliography**: primary sources first, then secondary; alphabetical by surname. Styles: **Chicago** (notes-bibliography, popular in history), **MLA**, **APA**.',
      'Thesis structure: title, abstract, introduction (problem, hypothesis, literature review, methodology), chapters, conclusion, appendices, bibliography.',
      '**Plagiarism**: presenting others’ work as one’s own. **UGC Regulations 2018**: up to **10%** similarity — no penalty; **10–40%** Level 1; **40–60%** Level 2; **above 60%** Level 3. Tools/repositories: **Shodhganga** (theses), **Shodhgangotri** (synopses), Turnitin/Ouriginal. Also fabrication, falsification, ghost-writing = intellectual dishonesty.',
      'Trends in research: **microhistory** (Carlo Ginzburg — *The Cheese and the Worms*; Natalie Zemon Davis — *The Return of Martin Guerre*), **cliometrics** (Fogel & Engerman), oral history, digital history.'
    ],
    m: [['Research steps “T-H-H-C-S-P”', 'Topic, Hypothesis, Heuristics, Criticism, Synthesis, Presentation — “Take Home Hot Chai, Sip Patiently”.'],
      ['External = Exists? Internal = Is it true?', 'External criticism checks authenticity; internal checks credibility.']],
    f: ['Lorenzo Valla showed the Donation of Constantine used Latin words that did not exist in Constantine’s time — early philology as detective work.'],
    d: 'Source criticism\n External (authenticity)\n  Who wrote it? When? Where?\n  Forgery? Copy? Provenance\n Internal (credibility)\n  What does it mean? (positive)\n  Should we believe it? (negative)\n  Author’s bias, competence',
    k: ['You find an “Akbar firman” in a family box. List 4 checks of external and 4 of internal criticism.'],
    r: ['E. Sreedharan (method chapters)', 'IGNOU MHI-103'],
    q: [
      Q.mcq('External criticism of a source is concerned with:', ['Credibility of the statements', 'Authenticity of the document', 'Meaning of the text', 'Bias of the author'], 1, ''),
      Q.mt('Match the abbreviation with its meaning:', ['Ibid.', 'Op. cit.', 'Passim', 'Sic'], ['In the same place (just cited)', 'In the work cited', 'Here and there', 'Thus (error in original)'], '', ['Abbreviation', 'Meaning']),
      Q.mcq('Under UGC Regulations 2018, similarity up to what level attracts no penalty?', ['5%', '10%', '20%', '40%'], 1, ''),
      Q.mcq('Shodhganga is a repository of:', ['Research journals', 'Indian PhD theses', 'Archival records', 'Plagiarism tools only'], 1, ''),
      Q.ch('Arrange the steps of historical research in order:', ['Selection of topic', 'Formulation of hypothesis', 'Collection of data (heuristics)', 'Synthesis and presentation'], ''),
      Q.ar('A hypothesis is essential in historical research.', 'It gives direction to the collection and interpretation of data.', 0, '')
    ] });

  T({ id: 'h10-anc', u: 'H10', t: 'Greek, Roman, Chinese, Church & Islamic historiography', h: 2.5,
    p: [
      '**Herodotus** (c. 484–425 BCE): *Histories* (Greco-Persian wars) — “**father of history**” (Cicero); also called “father of lies”. **Thucydides**: *History of the Peloponnesian War* — critical, eyewitness, human causation — “**father of scientific/critical history**”. **Xenophon**: *Anabasis, Hellenica*.',
      'Greek views: history as **cyclical**, teaches lessons; weak on chronology & sources.',
      '**Polybius** (Hellenistic): *Histories* — rise of Rome; **pragmatic** & universal history; **anacyclosis** (cycle of constitutions).',
      'Roman: **Cato the Elder** (*Origines*, first Latin history) · **Julius Caesar** (*Commentaries*) · **Sallust** · **Livy** (*Ab Urbe Condita*) · **Tacitus** (*Annals, Histories, Germania*; “*sine ira et studio*”) · **Suetonius** (*Twelve Caesars*) · **Plutarch** (*Parallel Lives*) · Ammianus Marcellinus.',
      'Chinese: **Confucius** (*Spring and Autumn Annals*) · **Sima Qian** — *Shiji* (Records of the Grand Historian) — “father of Chinese historiography” · **Ban Gu** (*Han Shu*) · **Sima Guang** (*Zizhi Tongjian*). Official dynastic histories by state bureaus.',
      'Church/Christian: **Eusebius** — *Ecclesiastical History* (“father of church history”) · **St Augustine** — ***City of God*** (providential, linear time) · **Orosius** · **Gregory of Tours** (*History of the Franks*) · **Venerable Bede** (*Ecclesiastical History of the English People*; popularised **AD dating**) · **Einhard** (*Life of Charlemagne*). Features: **universal, providential, apocalyptic, periodised, linear**; annals & chronicles.',
      'Islamic: **Al-Tabari** (*History of Prophets and Kings*), **Al-Masudi** (“Herodotus of the Arabs”), **isnad** criticism (chain of transmitters), **Rashid al-Din** (*Jami al-Tawarikh*), **Ibn Khaldun** — ***Muqaddimah* (1377)**: **asabiyyah** (group solidarity), cyclical rise & fall of dynasties, social & economic causation — pioneer of sociology & scientific history.'
    ],
    m: [['“Herodotus Tells, Thucydides Tests”', 'Herodotus = storyteller father of history; Thucydides = critical, scientific.'],
      ['Church 4 = “E-A-G-B”', 'Eusebius, Augustine, Gregory, Bede — “Every Angel Gives Blessings”.']],
    f: ['Bede’s use of “Anno Domini” in his history made AD dating popular across Europe.', 'Ibn Khaldun wrote the Muqaddimah as just the “introduction” to his world history!'],
    d: 'Early historiography\n Greek — Herodotus, Thucydides (cyclical)\n Hellenistic — Polybius (pragmatic)\n Roman — Livy, Tacitus (moral)\n Chinese — Sima Qian (official)\n Christian — Eusebius, Augustine (providential, linear)\n Islamic — Tabari, Ibn Khaldun (isnad, asabiyyah)',
    k: ['Contrast Greek cyclical time with Christian linear time in 4 sentences.'],
    r: ['E. Sreedharan ch. 2–3'],
    q: [

      Q.mcq('The concept of asabiyyah is associated with:', ['Al-Tabari', 'Ibn Khaldun', 'Al-Masudi', 'Rashid al-Din'], 1, ''),
      Q.mcq('Who is known as the “father of church history”?', ['Augustine', 'Eusebius', 'Bede', 'Orosius'], 1, ''),
      Q.mcq('“Sine ira et studio” (without anger or partiality) is the motto of:', ['Livy', 'Tacitus', 'Polybius', 'Sallust'], 1, ''),
      Q.ch('Arrange the historians chronologically:', ['Herodotus', 'Polybius', 'Tacitus', 'Eusebius'], ''),
      Q.ar('Christian historiography introduced a linear concept of time.', 'It saw history as moving from Creation to the Last Judgement according to God’s plan.', 0, '')

  T({ id: 'h10-ren', u: 'H10', t: 'Renaissance to 19th century: humanism, Vico, Enlightenment, Romanticism, Hegel, Positivism, Ranke', h: 3,
    p: [
      'Renaissance humanism: **Petrarch** (idea of the “Dark Ages”), **Leonardo Bruni** (*History of the Florentine People*; ancient–medieval–modern periodisation), **Flavio Biondo**, **Lorenzo Valla** (philology; Donation of Constantine), **Machiavelli** (*The Prince*, *Florentine Histories*; secular political causation), **Guicciardini** (*History of Italy*), **Jean Bodin** (*Method for the Easy Comprehension of History*, 1566).',
      'Impact of the Renaissance: secularisation, critical use of sources, classical models, vernacular & printing, human causation.',
      'Scientific Revolution: **Francis Bacon** (induction); **Descartes** — doubt about historical knowledge (Cartesian scepticism) → reaction by **Vico**.',
      '**Giambattista Vico** — ***New Science* (1725)**: **verum ipsum factum** (we can know what we make — so history is knowable), three ages (**gods, heroes, men**), **corsi e ricorsi** (cycles).',
      'Enlightenment: **Voltaire** (coined “**philosophy of history**”; *Age of Louis XIV*; *Essay on Manners*), **Montesquieu** (*Spirit of the Laws*), **Hume** (*History of England*), **Gibbon** (***Decline and Fall of the Roman Empire***, 1776–88), Robertson, **Condorcet** (progress).',
      'Romanticism: **Herder** (*Volksgeist*, each nation’s spirit), Burke, Michelet (*History of France*), Carlyle (great men).',
      '**Hegel** — *Philosophy of History*: **dialectic** (thesis–antithesis–synthesis), **World Spirit (Geist)**; history = progress of the consciousness of **freedom**.',
      '**Positive school** = **positivism** — **Auguste Comte** (law of **three stages**: theological, metaphysical, positive), **H.T. Buckle** (*History of Civilization in England*), Taine: history should find general laws like natural science. The “negative” side: sceptical/critical tradition and later anti-positivist idealists (Dilthey, Croce, Collingwood).',
      '**Berlin revolution — Leopold von Ranke** (1795–1886, University of Berlin): **archival primary sources**, **seminar method**, source criticism (after **Niebuhr**), objectivity — “*wie es eigentlich gewesen*”; political–diplomatic focus. Followers: **Lord Acton** (Cambridge Modern History), Mommsen.'
    ],
    m: [['Vico’s ages “G-H-M” = Gods, Heroes, Men', '“Good Heroes Matter”.'],
      ['Comte’s stages “T-M-P”', 'Theological → Metaphysical → Positive: “Tea, Milk, Pani”.']],
    f: ['Gibbon got the idea for Decline and Fall while sitting amid the ruins of the Capitol in Rome (1764).'],
    d: 'Modern Western historiography\n Renaissance — Bruni, Valla, Machiavelli\n Vico — New Science (1725)\n Enlightenment — Voltaire, Gibbon\n Romanticism — Herder\n Hegel — dialectic\n Positivism — Comte, Buckle\n Ranke — scientific, archival (Berlin)',
    k: ['Why is Ranke’s seminar called a “Berlin revolution” in history writing?'],
    r: ['E. Sreedharan ch. 4–6'],
    q: [
      Q.mt('Match the thinker with the idea/work:', ['Vico', 'Voltaire', 'Herder', 'Comte'], ['Verum ipsum factum', 'Philosophy of history (term)', 'Volksgeist', 'Law of three stages'], '', ['Thinker', 'Idea']),
      Q.mcq('“Wie es eigentlich gewesen” is associated with:', ['Hegel', 'Ranke', 'Niebuhr', 'Mommsen'], 1, ''),
      Q.mcq('The Donation of Constantine was proved a forgery by:', ['Petrarch', 'Lorenzo Valla', 'Machiavelli', 'Bodin'], 1, ''),
      Q.mcq('“The Decline and Fall of the Roman Empire” was written by:', ['David Hume', 'Edward Gibbon', 'William Robertson', 'Thomas Carlyle'], 1, ''),
      Q.ch('Arrange chronologically:', ['Bodin’s Methodus', 'Vico’s New Science', 'Gibbon’s Decline and Fall (first volume)', 'Comte’s Course of Positive Philosophy'], '1566 → 1725 → 1776 → 1830s.'),
      Q.ar('Positivists wanted history to discover general laws.', 'They modelled history on the natural sciences.', 0, '')
    ] });

  T({ id: 'h10-phil', u: 'H10', t: 'Marxism, Spengler, Toynbee, Collingwood, Annales & Post-modernism', h: 3,
    p: [
      '**Marx & Engels** — **historical materialism** (“scientific materialism”): **base** (forces + relations of production) determines **superstructure** (law, politics, ideas); **class struggle** drives history (*Communist Manifesto*, 1848); modes of production: primitive communism → slavery → feudalism → capitalism → socialism/communism; *Preface to A Contribution to the Critique of Political Economy* (1859); *Das Kapital* (1867); **Asiatic mode of production**.',
      'Later Marxists: **Gramsci** (hegemony), **E.P. Thompson** (*Making of the English Working Class*, history from below), **Hobsbawm**, Christopher Hill; India — Kosambi, R.S. Sharma, Irfan Habib.',
      '**Oswald Spengler** — ***The Decline of the West*** (1918–22): cultures as **organisms** with life-cycles (spring–summer–autumn–winter); **cyclical** & pessimistic; Western “**Faustian**” culture in decline (civilisation = final stage).',
      '**Arnold J. Toynbee** — ***A Study of History*** (12 vols, 1934–61): civilisations (21+) arise by **challenge and response**; **creative minority**, **withdrawal and return**, **mimesis**; decline when the creative minority becomes a **dominant minority**; **internal & external proletariat**; universal state & universal church.',
      '**R.G. Collingwood** — *The Idea of History* (1946): “all history is the **history of thought**”; **re-enactment**; question-and-answer method. **Croce**: all history is contemporary history.',
      '**Annales school** (journal 1929): **Marc Bloch** (*Feudal Society*, *The Historian’s Craft*, *The Royal Touch*) & **Lucien Febvre** → **Fernand Braudel** (*The Mediterranean*, 1949; **longue durée**, conjoncture, événement) → Le Roy Ladurie (*Montaillou*); total history, mentalities.',
      '**Post-modernism**: **Lyotard** — “incredulity toward **metanarratives**” (1979); **Foucault** — power/knowledge, discourse, archaeology & genealogy; **Derrida** — deconstruction; **Hayden White** — ***Metahistory*** (1973): history as narrative, **emplotment** (romance, tragedy, comedy, satire); **Keith Jenkins**; **Edward Said** — *Orientalism* (1978). Critique: **Richard Evans**, *In Defence of History*.'
    ],
    m: [['Toynbee “C-R-C-M”', 'Challenge → Response → Creative minority → (decline) dominant Minority.'],
      ['Braudel’s 3 times “L-C-E”', 'Longue durée (geography), Conjoncture (economic cycles), Événement (events): “Long, Cyclic, Event”.']],
    f: ['Spengler published The Decline of the West just as World War I ended — perfect timing for a pessimistic theory.', 'Marc Bloch was executed by the Gestapo in 1944 while working with the French Resistance.'],
    d: 'Philosophies of history\n Linear-progressive — Hegel, Marx\n Cyclical — Vico, Spengler, (Toynbee)\n Idealist — Croce, Collingwood\n Structural — Annales (Braudel)\n Post-modern — Foucault, White, Lyotard',
    k: ['Explain challenge-and-response with an Indian example (e.g., the Indus or the Ganga valley).'],
    r: ['E. Sreedharan ch. 7–10'],
    q: [
      Q.mt('Match the thinker with the work:', ['Oswald Spengler', 'Arnold Toynbee', 'R.G. Collingwood', 'Hayden White'], ['The Decline of the West', 'A Study of History', 'The Idea of History', 'Metahistory'], '', ['Thinker', 'Work']),
      Q.mcq('“Longue durée” is a concept of:', ['Marc Bloch', 'Fernand Braudel', 'Lucien Febvre', 'Le Roy Ladurie'], 1, ''),
      Q.mcq('“Incredulity toward metanarratives” defines post-modernism according to:', ['Foucault', 'Derrida', 'Lyotard', 'Hayden White'], 2, ''),
      Q.mcq('The “challenge and response” theory was given by:', ['Spengler', 'Toynbee', 'Vico', 'Hegel'], 1, ''),
      Q.ar('According to Marx, the economic base shapes the superstructure.', 'Marx saw class struggle as the motor of history.', 1, 'Both true; the second statement is a related but separate claim.'),
      Q.ch('Arrange the works chronologically:', ['Communist Manifesto', 'The Decline of the West', 'The Idea of History', 'Metahistory'], '1848 → 1918 → 1946 → 1973.')
    ] });

  T({ id: 'h10-ind', u: 'H10', t: 'Indian historiography: traditional, colonial, nationalist, Marxist, subaltern, regional; recent trends', h: 2.5,

/* src/data/p1.js */
/* PAPER 1 — General Paper on Teaching & Research Aptitude */
(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'p1-teach', u: 'P1', t: 'Teaching aptitude: levels, learner, methods, support systems, evaluation', h: 3,
    p: [
      'Teaching = a planned process to bring desirable change in the learner (knowledge, skills, attitudes). Teaching ↔ learning: teaching is the **independent variable**, learning the **dependent variable**.',
      '**Levels of teaching**: **Memory** (Herbart; rote; teacher-centred) → **Understanding** (Morrison; insight, generalisation) → **Reflective** (Hunt; problem-centred, learner-centred, highest).',
      'Maxims: known → unknown, simple → complex, concrete → abstract, particular → general, whole → part, empirical → rational, analysis → synthesis, psychological → logical.',
      'Learner characteristics: adolescents & adults (**andragogy** — Malcolm Knowles: self-directed, experience-based, problem-centred, internally motivated), individual differences, learning styles (visual, auditory, kinaesthetic).',
      'Factors: teacher (competence, personality), learner (readiness, motivation), support material, institutional facilities, learning environment.',
      '**Bloom’s taxonomy** (1956; revised by Anderson & Krathwohl 2001): **Remember → Understand → Apply → Analyse → Evaluate → Create**. Domains: cognitive, affective (Krathwohl), psychomotor (Simpson/Harrow/Dave).',
      'Methods: **teacher-centred** (lecture, demonstration) vs **learner-centred** (discussion, project — Kilpatrick, problem-solving, case study, role-play, brainstorming, **flipped classroom**, cooperative learning). **Online**: **SWAYAM** (MOOCs; launched 2017), **SWAYAM PRABHA** (DTH educational channels), NPTEL, e-PG Pathshala, **MOOCs** (4 quadrants: e-tutorial, e-content, discussion forum, self-assessment).',
      'Teaching support systems: traditional (blackboard), modern (OHP, projector), ICT-based (smart boards, LMS, virtual labs).',
      'Evaluation: **formative** (during learning) vs **summative** (at end); **diagnostic**; **norm-referenced** (compare with others) vs **criterion-referenced** (against a standard); **CBCS** (Choice Based Credit System, 2015 UGC); **CCE** (continuous & comprehensive); grading (10-point scale, SGPA/CGPA).',
      'Good test: **validity** (measures what it should), **reliability** (consistency), **objectivity**, **usability**.'
    ],
    m: [['Levels “M-U-R” = Herbart, Morrison, Hunt', '“My Uncle Rides” — Memory (Herbart), Understanding (Morrison), Reflective (Hunt).'],
      ['Bloom revised “R-U-A-A-E-C”', '“Rahul Usually Asks Awesome Educational Questions… Creatively”.']],
    f: ['SWAYAM stands for “Study Webs of Active-Learning for Young Aspiring Minds”.'],
    d: 'Levels of teaching\n Memory level — Herbart — rote\n Understanding level — Morrison — insight\n Reflective level — Hunt — problem-solving',
    k: ['Plan a 10-minute lesson using two maxims of teaching.'],
    r: ['Any standard Paper 1 guide (Trueman’s / Arihant) — Teaching Aptitude chapter'],
    q: [
      Q.mt('Match the level of teaching with its proponent:', ['Memory level', 'Understanding level', 'Reflective level', 'Andragogy'], ['Herbart', 'Morrison', 'Hunt', 'Malcolm Knowles'], '', ['Level', 'Proponent']),
      Q.mcq('Which is the highest level in the revised Bloom’s taxonomy?', ['Evaluate', 'Analyse', 'Create', 'Apply'], 2, ''),
      Q.mcq('Assessment done during the course of instruction to improve learning is:', ['Summative', 'Formative', 'Norm-referenced', 'Placement'], 1, ''),
      Q.mcq('A test that consistently gives the same results is said to be:', ['Valid', 'Reliable', 'Objective', 'Usable'], 1, ''),
      Q.st('Which of the following are learner-centred methods?', ['Project method', 'Lecture method', 'Problem-solving', 'Flipped classroom'], [true, false, true, true], ''),
      Q.ar('A reflective level of teaching is the most thoughtful level.', 'It is problem-centred and involves learners actively.', 0, '')
    ] });

  T({ id: 'p1-res', u: 'P2', t: 'Research aptitude: types, methods, steps, writing, ethics', h: 3,
    p: [
      'Research = systematic, objective search for new knowledge. Characteristics: empirical, logical, cyclical, replicable, controlled.',
      'Types by purpose: **fundamental/basic/pure** (theory), **applied** (solve practical problems), **action research** (Stephen Corey; teacher solves classroom problems), **evaluation research**. By method: **experimental**, **descriptive** (survey, case study), **historical**, **ex post facto** (cause after effect), **qualitative** (ethnography, phenomenology, grounded theory), **quantitative**, **mixed**.',
      'Paradigms: **positivism** (Comte; objective, quantitative) vs **post-positivism / interpretivism** (subjective meanings, qualitative).',
      'Steps: identify problem → review literature → **hypothesis** → research design → sampling → data collection → analysis → interpretation → report.',
      'Hypothesis: **null (H₀)** — no relation; **alternative (H₁)**. Errors: **Type I** = rejecting a true null; **Type II** = accepting a false null.',
      'Sampling: **probability** (simple random, systematic, stratified, cluster, multi-stage) vs **non-probability** (convenience, purposive/judgement, quota, **snowball**).',
      'Variables: independent, dependent, intervening, extraneous/moderator. Scales: **nominal, ordinal, interval, ratio** (NOIR).',
      'Tools: questionnaire, schedule, interview, observation, rating scale, **Likert scale** (attitudes), sociometry.',
      'Writing: thesis chapters, **abstract**, keywords, references (APA/MLA/Chicago), **impact factor**, **h-index**, peer review, **UGC-CARE** list.',
      'Ethics: informed consent, confidentiality, avoid **plagiarism**, fabrication, falsification; **UGC 2018 plagiarism regulations**; IPR & copyright.'
    ],
    m: [['Scales “NOIR” (French for black)', 'Nominal < Ordinal < Interval < Ratio (ratio has a true zero).'],
      ['Type I = “False alarm”, Type II = “Missed alarm”', 'Rejecting a true null vs accepting a false null.']],
    f: ['Snowball sampling is useful for hidden populations — each respondent refers the next one.'],
    d: 'Research types\n By purpose\n  Fundamental · Applied · Action\n By method\n  Experimental · Descriptive · Historical · Ex post facto\n By data\n  Qualitative · Quantitative · Mixed',
    k: ['Design a mini study on “mobile phone use and study hours” — name the variables, hypothesis and sample.'],
    r: ['Paper 1 guide — Research Aptitude chapter', 'IGNOU MHI-103 (research methods)'],
    q: [
      Q.mcq('Research undertaken by a teacher to solve a classroom problem is:', ['Fundamental', 'Action', 'Historical', 'Ex post facto'], 1, ''),
      Q.mcq('Rejecting a true null hypothesis is a:', ['Type I error', 'Type II error', 'Sampling error', 'Standard error'], 0, ''),

      'Types: **verbal** (oral, written) & **non-verbal** (**kinesics** – body language, **proxemics** – space, **chronemics** – time, **haptics** – touch, **paralanguage** – tone/pitch, oculesics – eye contact); intrapersonal, interpersonal, group, public, mass; formal (vertical, horizontal, diagonal) & informal (**grapevine**).',

      '**Barriers**: physical (noise), semantic (language/jargon), psychological (emotions, prejudice), cultural, organisational, physiological.',

  T({ id: 'p1-logic', u: 'P6', t: 'Logical reasoning: arguments, deduction/induction, Venn diagrams, analogies, Indian logic', h: 3,
    p: [
      'Argument = **premises** + **conclusion**. **Deductive**: conclusion necessarily follows (valid/invalid; sound = valid + true premises). **Inductive**: probable (strong/weak), from particular to general.',
      'Categorical propositions: **A** (All S are P), **E** (No S is P), **I** (Some S are P), **O** (Some S are not P). **Square of opposition**: A–O & E–I **contradictories**; A–E **contraries** (both can’t be true); I–O **sub-contraries** (both can’t be false); A→I, E→O **subalternation**.',
      'Distribution: A distributes subject; E both; I none; O predicate (“**Asebinop**”). Syllogism rules: middle term distributed at least once; no term distributed in conclusion unless in premise; two negatives → no conclusion.',
      'Fallacies (Western): ad hominem, straw man, begging the question (circular), false dilemma, slippery slope, hasty generalisation, appeal to authority/emotion.',
      '**Venn diagrams** for relations (e.g., doctors–women–mothers).',
      '**Indian logic — Pramanas** (means of valid knowledge): **pratyaksha** (perception), **anumana** (inference), **upamana** (comparison/analogy), **shabda** (verbal testimony), **arthapatti** (postulation/presumption), **anupalabdhi** (non-apprehension). Charvaka: 1 (pratyaksha); Buddhist/Vaisheshika: 2; Sankhya: 3; Nyaya: 4; Prabhakara Mimamsa: 5; Bhatta Mimamsa & Advaita: 6.',
      '**Nyaya five-membered inference (panchavayava)**: **pratijna** (thesis: hill has fire), **hetu** (reason: smoke), **udaharana** (example: kitchen), **upanaya** (application), **nigamana** (conclusion). Terms: **paksha** (subject — hill), **sadhya** (to be proved — fire), **hetu/linga** (smoke), **vyapti** (invariable concomitance).',
      '**Hetvabhasa** (fallacies of reason): **savyabhichara** (irregular/inconclusive), **viruddha** (contradictory), **satpratipaksha** (counter-balanced), **asiddha** (unproved), **badhita** (contradicted by other pramana).'
    ],
    m: [['Pramanas “P-A-U-S-A-A”', 'Pratyaksha, Anumana, Upamana, Shabda, Arthapatti, Anupalabdhi — “Please Always Use Simple Answers, Amigo”.'],
      ['Panchavayava “P-H-U-U-N”', 'Pratijna, Hetu, Udaharana, Upanaya, Nigamana — “Please Help Us Understand Nyaya”.'],
      ['“Asebinop”', 'A distributes Subject, E Both, I Neither, O Predicate.']],
    f: ['The classic Indian inference example — “the hill has fire because it has smoke, like a kitchen” — is over 1,500 years old.'],
    d: 'Square of opposition\n A (All S are P) ↔ O (Some S are not P): contradictory\n E (No S is P) ↔ I (Some S are P): contradictory\n A ↔ E: contrary\n I ↔ O: sub-contrary\n A → I, E → O: subalternation',
    k: ['Convert “smoke on the hill” into all five Nyaya steps aloud.'],
    r: ['Paper 1 guide — Logical Reasoning & Indian Logic'],
    q: [
      Q.mt('Match the Nyaya step with its meaning:', ['Pratijna', 'Hetu', 'Udaharana', 'Nigamana'], ['Statement of thesis', 'Reason', 'Example with universal rule', 'Conclusion'], '', ['Step', 'Meaning']),

      Q.mcq('Arthapatti as a pramana means:', ['Perception', 'Comparison', 'Postulation/presumption', 'Non-apprehension'], 2, ''),
      Q.mcq('How many pramanas does the Nyaya school accept?', ['One', 'Two', 'Four', 'Six'], 2, ''),
      Q.mcq('In “the hill has fire because it has smoke”, the paksha is:', ['Fire', 'Smoke', 'Hill', 'Kitchen'], 2, ''),

/* Paper 1 comprehension passages (original practice passages written for this app, NTA style: 5 questions each). */
(function (J) {
  var Q = J.Q;
  J.passages = [
    { t: 'Memory and the archive',
      text: 'Societies remember in many ways. Long before the printing press, communities preserved their past through songs, genealogies recited at weddings, inscriptions on temple walls and the careful copying of manuscripts. Each of these carried not only information but also a point of view. A court poet praising a king selected victories and quietly forgot defeats; a village ballad might celebrate a rebel whom official records called a bandit.\n\nThe modern archive promised something different: a neutral storehouse where documents would wait for the historian. Yet archives too are made by people. Officials decided what to file and what to burn, which languages counted as worth preserving, and whose petitions deserved a reply. The silence of an archive is therefore itself a kind of evidence. When historians notice that the voices of women, labourers or forest communities are missing, they learn something about the power that shaped the record.\n\nThis does not make the past unknowable. It means that the historian must read with two eyes: one on what a source says, and the other on why it exists at all. Oral testimony, folk songs and material remains can then be placed beside official files, each correcting the blind spots of the others.',
      q: [
        Q.mcq('According to the passage, why is the silence of an archive important?', ['It shows that nothing happened', 'It reveals the power that shaped what was recorded', 'It proves archives are useless', 'It means oral sources are always reliable'], 1, 'Para 2: “The silence of an archive is therefore itself a kind of evidence.”'),
        Q.mcq('The author’s attitude towards archives is best described as:', ['Uncritical admiration', 'Total rejection', 'Critical but constructive', 'Indifferent'], 2, 'Archives are useful but must be read critically.'),
        Q.mcq('“Read with two eyes” means the historian should consider:', ['Two languages', 'Both content and the purpose behind a source', 'Only official and only oral sources', 'Two different archives'], 1, ''),
        Q.mcq('Which of the following is NOT mentioned as a way societies preserved the past?', ['Genealogies', 'Temple inscriptions', 'Manuscript copying', 'Photographs'], 3, ''),
        Q.mcq('A suitable title for the passage is:', ['The Death of History', 'Archives, Silence and the Historian', 'How to Write Folk Songs', 'The Printing Revolution'], 1, '')

    { t: 'Learning that lasts',
      text: 'Students often believe that reading a chapter several times is the best way to learn it. The feeling of familiarity that comes from re-reading is pleasant, but it is misleading. Research on memory shows that information is retained far longer when learners are made to retrieve it — by answering questions, explaining an idea aloud, or writing down what they remember without looking.\n\nRetrieval works best when it is spaced. A fact recalled after one day, then after three days, then after a week becomes steadily more durable, because each act of recall strengthens the memory just as it begins to fade. Cramming the night before an examination may produce a decent score the next morning, but most of that knowledge disappears within weeks.\n\nTeachers can use these findings without expensive technology. Short low-stakes quizzes at the start of a class, asking students to teach a concept to a partner, and returning to old topics at intervals all build long-term learning. The aim is not to make study harder for its own sake, but to make the right kind of effort.',

      ] },
    { t: 'Water and the city',
      text: 'Many Indian cities once depended on a dense network of tanks, step-wells and channels that captured monsoon rain and recharged groundwater. Rulers, merchants and temple trusts built and maintained these structures, and local communities had clear rules about their use and cleaning. Over the last century, piped supply from distant rivers and deep borewells made such systems seem old-fashioned. Many tanks were filled in to make room for housing, bus stands and markets.\n\nThe consequences are now visible. Cities that receive heavy rainfall suffer floods because water has nowhere to go, and the same cities face shortages in summer because groundwater is not replenished. Restoring traditional water bodies is not merely nostalgia; it is a practical response that combines storage, flood control and ecological benefits.\n\nSuccess, however, depends on governance. A restored tank without community participation soon becomes a dumping ground. Where residents, municipal bodies and local experts share responsibility, water bodies have revived along with the neighbourhoods around them.',
      q: [
        Q.mcq('Why were many traditional water bodies filled in?', ['They had dried up permanently', 'Piped water made them seem unnecessary and land was needed', 'Courts ordered it', 'They caused diseases'], 1, ''),
        Q.mcq('The passage links urban flooding and summer shortages to:', ['Too many tanks', 'Loss of rain-capturing water bodies', 'Excess piped supply', 'Climate alone'], 1, ''),
        Q.mcq('According to the author, restoring tanks is:', ['Mere nostalgia', 'A practical, multi-benefit response', 'Too costly to attempt', 'Only of religious value'], 1, ''),
        Q.mcq('What is identified as the key to successful restoration?', ['New technology', 'Shared governance with community participation', 'Private ownership', 'Central government control alone'], 1, ''),
        Q.mcq('The tone of the passage is:', ['Alarmist and hopeless', 'Analytical and solution-oriented', 'Humorous', 'Purely descriptive with no view'], 1, '')
      ] },
    { t: 'The idea of a public university',
      text: 'A university is sometimes described as a factory that turns students into employees. The image is attractive to planners because outputs can be counted: degrees awarded, placements made, papers published. Yet the oldest idea of the university is wider. It is a community in which knowledge is not only transmitted but tested, argued over and renewed.\n\nPublic universities carry an additional responsibility. Funded by society, they are expected to open doors for those who could not otherwise afford advanced education, and to pursue questions that markets may ignore — the history of a dying language, the ecology of a remote forest, or the long-term effects of a public policy. Such work rarely produces quick returns, but a society without it loses its memory and its capacity to imagine alternatives.\n\nNone of this means that employability is unimportant. Students rightly expect their education to help them earn a living. The challenge is to hold both aims together: to prepare graduates for work while also preparing them to think, question and take part in public life.',
      q: [

/* State, persistence, spaced repetition, XP, streaks, logs. All data stays in this browser (localStorage). */
(function (J) {

  var DAY = 86400000;

    d = d || new Date();
