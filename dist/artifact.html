<title>JRF Sadhana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* JRF Sadhana — calm, low-noise study interface.
   Layout concept: one reading column (≤ 46rem) with a single primary action per screen; tabs top on desktop, bottom on phones. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --ink: #172033; --muted: #56617a; --line: #d8dee9;
  --accent: #2f43a8; --accent-ink: #ffffff; --accent-soft: #e3e7fa;
  --copper: #a85a26; --copper-soft: #f6e8dd;
  --good: #1f7656; --good-soft: #dff2e9; --bad: #b0382d; --bad-soft: #f9e3e0; --warn: #8a6200; --warn-soft: #fbf0d2;
  --shadow: 0 1px 2px rgba(23, 32, 51, .06), 0 4px 16px rgba(23, 32, 51, .06);
  --f-body: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-display: 'Bricolage Grotesque', 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --fs: 17px; --lh: 1.65; --ls: 0em;
  --r: 14px; --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141c; --surface: #171c27; --surface-2: #1d2331; --ink: #e8ecf4; --muted: #9ba5bb; --line: #2b3346;
    --accent: #9aa9ff; --accent-ink: #0e1330; --accent-soft: #252d4f;
    --copper: #e6a06c; --copper-soft: #3a2a20;
    --good: #61c99d; --good-soft: #173528; --bad: #f08d81; --bad-soft: #3d211e; --warn: #e6c35c; --warn-soft: #3a3219;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141c; --surface: #171c27; --surface-2: #1d2331; --ink: #e8ecf4; --muted: #9ba5bb; --line: #2b3346;
  --accent: #9aa9ff; --accent-ink: #0e1330; --accent-soft: #252d4f;
  --copper: #e6a06c; --copper-soft: #3a2a20;
  --good: #61c99d; --good-soft: #173528; --bad: #f08d81; --bad-soft: #3d211e; --warn: #e6c35c; --warn-soft: #3a3219;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
/* User-chosen skins (Tweaks) override the system theme */
:root[data-skin="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --ink: #172033; --muted: #56617a; --line: #d8dee9;
  --accent: #2f43a8; --accent-ink: #ffffff; --accent-soft: #e3e7fa; --copper: #a85a26; --copper-soft: #f6e8dd;
  --good: #1f7656; --good-soft: #dff2e9; --bad: #b0382d; --bad-soft: #f9e3e0; --warn: #8a6200; --warn-soft: #fbf0d2; color-scheme: light;
}
:root[data-skin="dark"] {
  --bg: #10141c; --surface: #171c27; --surface-2: #1d2331; --ink: #e8ecf4; --muted: #9ba5bb; --line: #2b3346;
  --accent: #9aa9ff; --accent-ink: #0e1330; --accent-soft: #252d4f; --copper: #e6a06c; --copper-soft: #3a2a20;
  --good: #61c99d; --good-soft: #173528; --bad: #f08d81; --bad-soft: #3d211e; --warn: #e6c35c; --warn-soft: #3a3219; color-scheme: dark;
}
:root[data-skin="sepia"] {
  --bg: #efe6d6; --surface: #faf4e8; --surface-2: #f3ead9; --ink: #2d2417; --muted: #6b5a43; --line: #ddcdb2;
  --accent: #6b3f1d; --accent-ink: #fff8ec; --accent-soft: #eadbc3; --copper: #8d4a1f; --copper-soft: #f0dcc7;
  --good: #3d6b34; --good-soft: #e1ead2; --bad: #9c3a26; --bad-soft: #f3dacf; --warn: #7d5b0c; --warn-soft: #f3e5bf; color-scheme: light;
}
:root[data-skin="contrast"] {
  --bg: #000000; --surface: #0b0b0b; --surface-2: #151515; --ink: #ffffff; --muted: #d6d6d6; --line: #7a7a7a;
  --accent: #ffd400; --accent-ink: #000000; --accent-soft: #332b00; --copper: #ffb36b; --copper-soft: #33220f;
  --good: #59f2a6; --good-soft: #0d3322; --bad: #ff8a80; --bad-soft: #3a1210; --warn: #ffe066; --warn-soft: #332a00; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { font-size: var(--fs); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: var(--lh); letter-spacing: var(--ls);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 650; }
h3 { font-size: 1.08rem; font-weight: 650; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: max(12px, .86rem); }
.tiny { font-size: max(12px, .76rem); }
.eyebrow { font-size: max(12px, .74rem); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---------- shell ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 72rem; margin: 0 auto; display: flex; align-items: center; gap: 14px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; white-space: nowrap; }
.brand svg { color: var(--accent); }
.tabs { display: flex; gap: 2px; flex: 1; justify-content: center; }
.tab { display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: max(12px, .95rem); }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; align-items: center; gap: 8px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: max(12px, .86rem); font-weight: 600; color: var(--ink); min-height: 36px; }
.chip-btn:hover { border-color: var(--accent); }
.chip-btn .ic { color: var(--copper); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 120px; }
.wrap { max-width: 46rem; margin: 0 auto; display: grid; gap: 18px; }
.wrap.wide { max-width: 72rem; }
.bottom-nav { display: none; }
@media (max-width: 760px) {
  .tabs { display: none; }
  .brand span { display: none; }
  .top-in { justify-content: space-between; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: max(12px, .7rem); color: var(--muted); text-decoration: none; padding: 6px 0; border-radius: 10px; font-weight: 600; }
  .bottom-nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  h1 { font-size: 1.45rem; }
}
.focus-mode .hide-in-focus { display: none !important; }

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.hero { box-shadow: var(--shadow); border-color: transparent; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 12px; }
.stack { display: grid; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 11px; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { min-height: 56px; font-size: 1.06rem; padding: 12px 22px; border-radius: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: max(12px, .86rem); border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: max(12px, .76rem); font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.copper { background: var(--copper-soft); color: var(--copper); border-color: transparent; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.copper > i { background: var(--copper); }
.bar.good > i { background: var(--good); }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--f-mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: max(12px, .8rem); color: var(--muted); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.check:hover { border-color: var(--accent); }
.check .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.check.done { background: var(--surface-2); }
.check.done .box { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.check.done .lbl { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.check .lbl { flex: 1; min-width: 0; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: max(12px, .92rem); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 11px; padding: 3px; background: var(--surface-2); flex-wrap: wrap; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.togglechips { display: flex; flex-wrap: wrap; gap: 6px; }
.togglechips button { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: max(12px, .86rem); min-height: 36px; color: var(--muted); }
.togglechips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { border-collapse: collapse; width: 100%; font-size: max(12px, .92rem); }
table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.tbl th { font-size: max(12px, .78rem); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
table.tbl td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- today ---------- */
.next { display: grid; gap: 14px; padding: 22px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid transparent; }
.next .what { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.dayline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.daycount { font-family: var(--f-mono); font-weight: 700; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.quest .bar { grid-column: 1 / -1; height: 7px; }

/* ---------- learn ---------- */
.lesson { display: grid; gap: 16px; }
.pointer-card { min-height: 42vh; display: grid; align-content: center; gap: 14px; padding: 28px 24px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-size: 1.22em; line-height: 1.6; }
.pointer-card b, .plist b { color: var(--accent); font-weight: 650; }
.plist { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; }
.plist li::marker { color: var(--copper); }
.mnem { border-left: 4px solid var(--copper); padding: 10px 14px; background: var(--copper-soft); border-radius: 0 12px 12px 0; display: grid; gap: 4px; }
.mnem b { color: var(--copper); }
.fact { padding: 10px 14px; border-radius: 12px; background: var(--good-soft); color: var(--ink); }
.tree { font-size: max(12px, .95rem); display: grid; gap: 4px; }
.tree .node { display: flex; align-items: flex-start; gap: 8px; }
.tree .node .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: .55em; background: var(--accent); }
.tree .node.l0 { font-weight: 700; font-family: var(--f-display); font-size: 1.05rem; }
.tree .node.l0 .dot { width: 14px; height: 14px; margin-top: .35em; border-radius: 4px; }
.tree .node.l2 .dot { background: var(--copper); }
.tree .node.l3 .dot, .tree .node.l4 .dot { background: var(--muted); width: 8px; height: 8px; }
.tree .kids { margin-left: 4px; padding-left: 16px; border-left: 2px solid var(--line); display: grid; gap: 4px; }
.cloze { display: inline-block; min-width: 4em; border-bottom: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; cursor: pointer; color: transparent; user-select: none; }
.cloze.shown { color: var(--accent); background: transparent; }

/* ---------- quiz ---------- */
.qcard { display: grid; gap: 14px; }
.qtext { font-size: 1.1em; white-space: pre-line; line-height: 1.6; }
.qmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.opts { display: grid; gap: 9px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 13px; padding: 12px 14px; cursor: pointer; min-height: 52px; width: 100%; }
.opt:hover { border-color: var(--accent); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; background: var(--surface-2); font-size: max(12px, .9rem); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--accent-ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--accent-ink); }
.opt[disabled] { cursor: default; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: max(12px, .95rem); }
.mcol { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); min-width: 0; }
.mcol > div { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.mcol > div:last-child { border-bottom: 0; }
.mcol .h { background: var(--surface-2); font-weight: 700; font-size: max(12px, .78rem); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
@media (max-width: 560px) { .match { grid-template-columns: 1fr; } }
.explain { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.explain.ok { background: var(--good-soft); }
.explain.no { background: var(--bad-soft); }
.combo { font-family: var(--f-mono); font-weight: 700; color: var(--copper); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.palette button { min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: max(12px, .8rem); cursor: pointer; }
.palette button.ans { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.palette button.mark { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.palette button.cur { outline: 2px solid var(--accent); }
.passage { max-height: 40vh; overflow: auto; padding: 14px; background: var(--surface-2); border-radius: 12px; white-space: pre-line; font-size: max(12px, .95rem); border: 1px solid var(--line); }

/* ---------- flashcards ---------- */
.flash { min-height: 40vh; display: grid; align-content: center; gap: 14px; text-align: center; padding: 26px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; white-space: pre-line; font-size: 1.15em; }
.flash .back { color: var(--accent); font-weight: 650; font-size: 1.1em; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* ---------- timeline ---------- */
.tl { position: relative; display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 6.5rem 1fr; gap: 14px; padding: 8px 0; align-items: baseline; }
.tl-item .y { font-family: var(--f-mono); font-weight: 700; color: var(--copper); text-align: right; font-variant-numeric: tabular-nums; }
.tl-item .t { border-left: 2px solid var(--line); padding-left: 14px; min-width: 0; }
.tl-cent { font-family: var(--f-display); font-weight: 700; padding: 14px 0 4px; color: var(--muted); }
.story { min-height: 46vh; display: grid; align-content: center; gap: 12px; padding: 28px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.story .y { font-family: var(--f-mono); font-size: 2.6rem; font-weight: 700; color: var(--copper); }
.story .t { font-size: 1.3rem; font-weight: 600; text-wrap: balance; }
.order-list { display: grid; gap: 8px; }
.order-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.order-item .n { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-mono); font-weight: 700; }
.order-item.picked { border-color: var(--accent); }
.order-item.picked .n { background: var(--accent); color: var(--accent-ink); }
.order-item.okk { border-color: var(--good); background: var(--good-soft); }
.order-item.nok { border-color: var(--bad); background: var(--bad-soft); }

/* ---------- maps ---------- */
.mapbox { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 13%, var(--surface)); touch-action: none; }
.mapbox svg { display: block; width: 100%; height: min(72vh, 92vw); }
.map-land { fill: var(--surface); stroke: none; }
.map-river { fill: none; stroke: var(--accent); stroke-opacity: .35; stroke-width: .09; stroke-linejoin: round; stroke-linecap: round; }
.map-dot { cursor: pointer; stroke: var(--surface); stroke-width: .06; }

  T({ id: 'h1-src', u: 'H1', t: 'Archaeological sources: exploration, excavation, dating, epigraphy, coins', h: 3,

  T({ id: 'h1-lit', u: 'H1', t: 'Literary sources & foreign accounts (Greek, Chinese, Arabic)', h: 2,

  T({ id: 'h1-pre', u: 'H1', t: 'Prehistory: Palaeolithic & Mesolithic', h: 1.5,

  T({ id: 'h1-hrp', u: 'H1', t: 'Harappan civilization I: origin, extent, sites, town planning', h: 3,
    p: [
      '**1921 Harappa** (Daya Ram Sahni; on **Ravi**, Punjab, Pakistan) · **1922 Mohenjo-daro** (R.D. Banerji; on **Indus**, Sindh). John Marshall announced the civilization in 1924.',
      'Phases: Early Harappan (c. 3200–2600 BCE) → **Mature (c. 2600–1900 BCE)** → Late (c. 1900–1300 BCE).',
      'Extent (cardinal limits): **N – Manda** (Chenab, J&K) · **S – Daimabad** (Pravara, Maharashtra) · **E – Alamgirpur** (Hindon, UP) · **W – Sutkagen-dor** (Dasht, Makran coast). **Shortugai** (Afghanistan, Amu Darya) = trading outpost.',
      'Indian sites: **Dholavira** (Kutch; 3-part city, reservoirs, “signboard”; UNESCO 2021; R.S. Bisht) · **Lothal** (Bhogava; dockyard, bead factory; S.R. Rao) · **Kalibangan** (Ghaggar; ploughed field, fire altars; B.B. Lal & B.K. Thapar) · **Rakhigarhi** (Haryana; largest in India) · **Banawali** (toy plough) · **Ropar** (Sutlej) · **Surkotada, Rangpur, Bhirrana**.',

      'Planning: grid streets, **citadel (west, raised) + lower town (east)**, **burnt bricks in 1:2:4 ratio**, covered drains, house-wells.',
      '**Great Bath** (Mohenjo-daro): ~11.88 × 7.01 m, 2.43 m deep, waterproofed with bitumen. Large “granaries” at Harappa & Mohenjo-daro (interpretation debated).',

      'Origin debates: **diffusion from Mesopotamia** (Wheeler, early view) vs **indigenous evolution** from early farming cultures — Mehrgarh → Amri, Kot Diji, Sothi–Siswal (M.R. Mughal, Possehl, Kenoyer).',
      'Called India’s **first urbanization**; second urbanization comes in the Ganga valley c. 6th c. BCE.'
    ],
    m: [['“Daya-Ravi, Banerji-Indus”', 'Daya Ram Sahni → Harappa on Ravi (1921). R.D. Banerji → Mohenjo-daro on Indus (1922).'],

    q: [
      Q.mt('Match the Harappan site with the river on which it is located:', ['Harappa', 'Mohenjo-daro', 'Kalibangan', 'Lothal'], ['Ravi', 'Indus', 'Ghaggar', 'Bhogava'], '', ['Site', 'River']),
      Q.mcq('Which Harappan site was divided into three parts instead of two?', ['Kalibangan', 'Dholavira', 'Lothal', 'Banawali'], 1, 'Citadel, middle town, lower town.'),

  T({ id: 'h1-hrp2', u: 'H1', t: 'Harappan civilization II: craft, trade, religion, society, decline', h: 2.5,
    p: [
      '**Seals**: mostly square steatite; **unicorn** = commonest motif; the “**Pashupati**” seal (horned figure, animals around) = proto-Shiva (Marshall).',
      '**Script**: pictographic, ~400 signs, mostly **right to left**, still **undeciphered**.',
      '**Weights**: cubical chert; binary in small sizes (1, 2, 4, 8, 16…) and decimal in large; **16** as a basic unit.',
      'Crafts: etched **carnelian beads** (Chanhudaro, Lothal), shell (Nageshwar, Balakot), faience, **bronze “Dancing Girl”** (lost-wax, Mohenjo-daro), steatite **“Priest-King”** (Mohenjo-daro), red sandstone torso (Harappa).',
      'Agriculture: wheat, barley, peas, sesame, mustard; **rice** husks at Lothal & Rangpur; **cotton** (Greek *sindon*); ploughed field at Kalibangan; terracotta plough at Banawali.',
      'Trade: Mesopotamian texts call the Indus region **“Meluhha”** (Sargon of Akkad, c. 2350 BCE). Intermediate stations **Dilmun (Bahrain)** and **Magan (Oman)**. Lapis lazuli from **Badakhshan** (Shortugai); copper from **Khetri** & Oman.',
      'Religion: Mother-goddess terracottas, Pashupati seal, linga & yoni stones, **fire altars** (Kalibangan, Lothal), pipal tree; **no temple** identified.',
      'Society & polity: no palaces or royal tombs; uniformity of bricks, weights and seals suggests a strong elite or central authority — nature still debated.',
      '**Decline c. 1900 BCE** — theories: Aryan invasion (Wheeler: “Indra stands accused”; refuted by G.F. Dales’ “Mythical Massacre”), floods & tectonic uplift (Raikes, Dales, M.R. Sahni), **drying of Ghaggar–Hakra** (Lambrick, Possehl), climate change/aridity (Gurdip Singh), ecological degradation (Fairservis), decline of trade.',
      'Modern view (Possehl): **“de-urbanization”** and localization, not a sudden collapse. Late Harappan cultures: **Cemetery H** (Punjab), **Jhukar** (Sindh), **Rangpur** (Gujarat).'

    m: [['“Meluhha Must Deal Mostly”', 'Meluhha (Indus) ↔ Dilmun (Bahrain) ↔ Magan (Oman) ↔ Mesopotamia.'],
      ['FAT-CD for decline', 'Floods, Aryans, Tectonics, Climate, Drying of Ghaggar — five headline theories.']],
    f: ['The Dancing Girl from Mohenjo-daro is only about 10.5 cm tall.', 'Harappan weights were so standard that the same unit turns up from Shortugai to Lothal.'],

      Q.st('Which of the following were found at Mohenjo-daro?', ['Great Bath', 'Bronze dancing girl', 'Steatite “priest-king”', 'Ploughed field'], [true, true, true, false], 'Ploughed field = Kalibangan.')
    ] });

  T({ id: 'h1-ved', u: 'H1', t: 'Early Vedic (Rigvedic) age & the Aryan debate', h: 2.5,
    p: [
      '**Rigveda**: 10 mandalas, 1028 hymns; **Mandalas 2–7 = family books** (oldest); 1 & 10 later. **Purusha Sukta** (Mandala 10) first mentions the four varnas. **Gayatri mantra** (Mandala 3, Vishvamitra, to Savitri).',
      'Region: **Sapta Sindhu** (land of seven rivers). Most-mentioned river = **Sindhu**; most sacred = **Saraswati** (“naditama”).',
      'Rigvedic river names: **Vitasta** (Jhelum), **Asikni** (Chenab), **Parushni** (Ravi), **Vipas** (Beas), **Sutudri** (Sutlej), Kubha (Kabul), Gomati (Gomal), Krumu (Kurram).',
      '**Battle of Ten Kings (Dasharajna)** on the Parushni (Ravi): **Sudas** of the Bharatas (priest **Vasishtha**) defeated ten tribes (backed by **Vishvamitra**). In Mandala 7.',
      'Polity: **Rajan** (chief), Purohita, Senani, Gramani; tribal assemblies **Sabha, Samiti, Vidatha** (oldest), Gana. **Bali** = voluntary offering. Women attended Sabha & Vidatha.',
      'Economy: **pastoral**; wealth = cattle; war = **gavishti** (search for cows); grain = **yava** (barley); **nishka** = gold ornament (not coin).',
      'Society: jana → vish → grama → kula; varna = “colour” (Arya vs Dasa/Dasyu); women poets **Lopamudra, Ghosha, Apala, Vishvavara**.',
      'Gods: **Indra** (~250 hymns; Purandara – breaker of forts), **Agni** (~200; messenger), **Varuna** (upholder of **rita** – cosmic order), Soma, Surya, Ushas, Aditi. No temples or idols.',
      '**Boghazkoi inscription** (c. 1380 BCE, Turkey) — Hittite–Mitanni treaty names Indra, Mitra, Varuna, Nasatyas.',
      'Aryan homeland debate: **Central Asia** (Max Müller), **Arctic** (Tilak, *Arctic Home in the Vedas*), **Tibet** (Dayananda Saraswati), indigenous/“out of India” views. Evidence: Indo-European languages, horse & spoked wheel, BMAC/Andronovo, Gandhara Grave culture, recent ancient-DNA studies (Rakhigarhi, 2019).'
    ],
    m: [['“Very Angry People Visit Sutlej”', 'Five Punjab rivers W→E: Vitasta (Jhelum), Asikni (Chenab), Parushni (Ravi), Vipas (Beas), Sutudri (Sutlej).'],
      ['SSV-G', 'Assemblies: Sabha (elders), Samiti (people), Vidatha (oldest, also distribution), Gana.']],
    f: ['The word “gavishti” (war) literally means “searching for cows” — cattle raids were the main conflict!', 'Indra has more hymns than any other god but is almost forgotten in later Hinduism.'],
    d: 'Rigvedic polity\n Rajan (tribal chief)\n  Purohita (priest-adviser)\n  Senani (army chief)\n  Gramani (head of village/unit)\n Assemblies\n  Sabha\n  Samiti\n  Vidatha\n  Gana',
    k: ['Explain the Battle of Ten Kings like a cricket match: teams, captains, coaches (priests), venue (river).'],
    r: ['Upinder Singh ch. 5', 'IGNOU MHI-104 early state formation'],
    q: [
      Q.mt('Match the Rigvedic name with the modern river:', ['Vitasta', 'Asikni', 'Parushni', 'Sutudri'], ['Jhelum', 'Chenab', 'Ravi', 'Sutlej'], '', ['Rigvedic', 'Modern']),
      Q.mcq('The Battle of Ten Kings was fought on the banks of:', ['Saraswati', 'Parushni', 'Vipas', 'Sindhu'], 1, 'Parushni = Ravi.'),
      Q.mcq('Which part of the Rigveda contains the Purusha Sukta?', ['Mandala 3', 'Mandala 7', 'Mandala 9', 'Mandala 10'], 3, ''),
      Q.mcq('The Boghazkoi inscription is significant because it:', ['Is the earliest Brahmi inscription', 'Mentions Vedic gods in a treaty in West Asia', 'Records Alexander’s invasion', 'Describes the Harappan decline'], 1, ''),
      Q.ar('The Rigvedic economy was primarily pastoral.', 'Cattle were the chief measure of wealth and wars were fought over cows.', 0, ''),

  T({ id: 'h1-lved', u: 'H1', t: 'Later Vedic age: state, varna, iron, philosophy', h: 2.5,
    p: [
      'Texts: **Samaveda** (melodies), **Yajurveda** (sacrificial formulae; Shukla & Krishna), **Atharvaveda** (charms, popular beliefs), **Brahmanas** (ritual; Shatapatha largest), **Aranyakas**, **Upanishads** (philosophy; Brihadaranyaka & Chandogya oldest).',
      '**“Satyameva Jayate”** comes from the **Mundaka Upanishad**.',
      'Shift east to the **Ganga–Yamuna doab** (Kuru–Panchala). Material culture: **Painted Grey Ware (PGW)** c. 1200–600 BCE — Hastinapur, Ahichchhatra, Atranjikhera.',
      'Iron = **shyama/krishna ayas**. Common in the Ganga valley by c. 1000 BCE; some sites (Malhar, Raja Nal-ka-Tila) give earlier dates.',
      'Shatapatha Brahmana: **Videgha Mathava** carried Agni east across the **Sadanira (Gandak)** — story of expansion into Videha.',
      'Polity: territorial kingdoms (**rashtra**); big sacrifices **Rajasuya** (consecration), **Ashvamedha** (horse), **Vajapeya** (chariot race). **Ratnins** (12 “jewels”) in Rajasuya. Officials: **Bhagadugha** (tax), **Sangrahitri** (treasurer), Suta, Akshavapa. Sabha & Samiti decline; women excluded.',
      'Society: rigid **four varnas**; **gotra** exogamy appears; **ashramas** — four stages first in the **Jabala Upanishad**; upanayana for the three upper varnas.',
      'Gods: **Prajapati** (supreme), Vishnu, Rudra rise; Indra & Agni lose importance; **Pushan** = god of cattle (linked to Shudras).',
      'Ideas: **Brahman–Atman** identity, karma & rebirth, moksha; **Purusharthas** (dharma, artha, kama, moksha); **three rinas** (debts to gods, sages, ancestors); **16 samskaras**.',
      'Six darshanas (later): **Nyaya** (Gautama), **Vaisheshika** (Kanada), **Sankhya** (Kapila), **Yoga** (Patanjali), **Mimamsa** (Jaimini), **Vedanta** (Badarayana).'
    ],
    m: [['“Good Kids Keep Practising Jolly Bhajans”', 'Founders of six darshanas: Gautama (Nyaya), Kanada (Vaisheshika), Kapila (Sankhya), Patanjali (Yoga), Jaimini (Mimamsa), Badarayana (Vedanta).'],
      ['Pairs: N-V, S-Y, M-V', 'The six schools come in pairs: Nyaya–Vaisheshika, Sankhya–Yoga, Mimamsa–Vedanta.']],
    f: ['In the Ashvamedha, a horse wandered freely for a year; any land it crossed unchallenged was claimed by the king.'],
    d: 'Vedic literature\n Samhitas\n  Rig · Sama · Yajur · Atharva\n Brahmanas (ritual)\n Aranyakas (forest)\n Upanishads (philosophy)\n Vedangas (6)\n  Shiksha · Kalpa · Vyakarana · Nirukta · Chhanda · Jyotisha',
    k: ['Compare Rigvedic and Later Vedic polity in 4 contrasts (chief→king, assemblies, sacrifice, territory).'],
    r: ['Upinder Singh ch. 5'],
    q: [
      Q.mcq('“Satyameva Jayate” is taken from:', ['Katha Upanishad', 'Mundaka Upanishad', 'Chandogya Upanishad', 'Isha Upanishad'], 1, ''),
      Q.mt('Match the darshana with its founder:', ['Nyaya', 'Vaisheshika', 'Sankhya', 'Mimamsa'], ['Gautama', 'Kanada', 'Kapila', 'Jaimini'], '', ['Darshana', 'Founder']),
      Q.mcq('Which pottery is associated with the Later Vedic people?', ['Black-and-Red Ware', 'Painted Grey Ware', 'Northern Black Polished Ware', 'Ochre Coloured Pottery'], 1, ''),
      Q.mcq('The four ashramas are first mentioned together in the:', ['Rigveda', 'Jabala Upanishad', 'Arthashastra', 'Manusmriti'], 1, ''),
      Q.ar('The importance of the Sabha and Samiti declined in the Later Vedic period.', 'Royal power increased with large territorial kingdoms and elaborate sacrifices.', 0, ''),
      Q.ch('Arrange in chronological order of composition (earliest first):', ['Rigveda', 'Brahmanas', 'Upanishads', 'Dharmasutras'], '')
    ] });

  T({ id: 'h1-meg', u: 'H1', t: 'Megaliths of South India & iron technology', h: 1,
    p: [
      '**Megalith** = “big stone” burial monuments, mostly in the peninsula, c. 1200/1000 BCE – 300 CE.',
      'Associated with **Black-and-Red Ware** and **iron** tools, weapons, horse equipment.',
      'Types: **cairn circles**, **dolmens** (stone table), **cists**, **menhirs** (single upright stone), **urn burials**, Kerala’s **topikal** (hat-stone) & **kudaikal** (umbrella-stone), rock-cut caves.',
      'Sites: **Brahmagiri, Maski, Hallur** (Karnataka), **Adichanallur** (TN, urn burials), **Junapani** (Vidarbha), Mahurjhari, **Porkalam** (Kerala), Kodumanal, Paiyampalli.',
      'Megalithic communities lead into the **Sangam age** culture of Tamilakam.',
      'Living megalithic traditions continue among the **Khasi** and other north-eastern communities.'
    ],
    m: [['“Big stone, Black-red, Iron bone”', 'Megaliths = big stones + Black-and-Red Ware + iron + burials.']],
    f: ['Some megaliths are aligned with sunrise/sunset points — possible early astronomy.'],
    d: 'Megalith types\n Cairn circle\n Dolmen\n Cist\n Menhir\n Urn burial\n Topikal / Kudaikal (Kerala)',

    r: ['Upinder Singh ch. 5 (South India section)'],
    q: [
      Q.mcq('Megalithic culture of South India is mainly associated with:', ['Painted Grey Ware', 'Black-and-Red Ware', 'Ochre Coloured Pottery', 'Grey Ware'], 1, ''),

    ] });

  T({ id: 'h1-mjp', u: 'H1', t: 'Mahajanapadas, republics & second urbanization', h: 2.5,
    p: [
      '**16 Mahajanapadas** listed in the Buddhist **Anguttara Nikaya** (the Jain *Bhagavati Sutra* gives a different list).',
      'Capitals: **Anga**–Champa · **Magadha**–Rajagriha (Girivraja) · **Kashi**–Varanasi · **Kosala**–Shravasti · **Vajji**–Vaishali · **Malla**–Kushinara & Pava · **Chedi**–Shuktimati · **Vatsa**–Kaushambi.',
      '**Kuru**–Indraprastha · **Panchala**–Ahichchhatra & Kampilya · **Matsya**–Viratanagara · **Shurasena**–Mathura · **Ashmaka**–Potana (on Godavari; only one south of Vindhyas) · **Avanti**–Ujjayini & Mahishmati · **Gandhara**–Taxila · **Kamboja**–Rajapura.',
      'Four big monarchies: **Magadha, Kosala, Vatsa, Avanti** — Magadha won.',
      '**Republics (gana/sangha)**: **Vajji** (confederacy of 8 clans incl. Licchavis, Videhas, Jnatrikas), **Malla**, Shakyas (Kapilavastu), Koliyas, Moriyas, Bulis, Bhaggas.',
      'Republican features: power with an assembly of clan heads (*rajas*), meeting hall **santhagara**, voting with **salaka** (sticks) collected by the **salakagahapaka**.',
      '**Second urbanization** (c. 6th c. BCE, middle Ganga valley): **NBPW** pottery (c. 700–200 BCE), **punch-marked coins**, writing, cities like Rajagriha, Shravasti, Kaushambi, Champa, Varanasi, Ujjayini, Taxila.',
      'New groups: **gahapati** (householder-landowner), **setthi** (merchant-banker), **shreni** (guild). Causes: iron tools, wet-rice surplus, trade, rise of states.'
    ],
    m: [['“Aam Mein Kela Kaju · Vada Mein Chatni Vadi · Kulfi Paneer Mithai Sweet · Aloo Achaar Gajar Kheer”', 'Anga Magadha Kashi Kosala · Vajji Malla Chedi Vatsa · Kuru Panchala Matsya Shurasena · Ashmaka Avanti Gandhara Kamboja (roughly east → west).'],

      Q.mcq('The only Mahajanapada located south of the Vindhyas was:', ['Avanti', 'Chedi', 'Ashmaka', 'Matsya'], 2, ''),
      Q.mcq('The list of sixteen Mahajanapadas is found in:', ['Digha Nikaya', 'Anguttara Nikaya', 'Arthashastra', 'Ashtadhyayi'], 1, ''),
      Q.mcq('Which pottery is the hallmark of the second urbanization?', ['PGW', 'NBPW', 'OCP', 'BRW'], 1, 'Northern Black Polished Ware.'),
      Q.ar('In the gana-sanghas, decisions were taken in assemblies.', 'Power was shared by the heads of leading clan families.', 0, ''),
      Q.st('Which of the following were republics (gana-sanghas)?', ['Vajji', 'Malla', 'Shakya', 'Kosala'], [true, true, true, false], '')
    ] });

  T({ id: 'h1-het', u: 'H1', t: 'Heterodox sects: Buddhism, Jainism, Ajivikas & others', h: 3,
    p: [
      'Why they arose (6th c. BCE): reaction to costly Vedic sacrifice and Brahmana dominance; new agrarian economy needed cattle (ahimsa); support from Kshatriyas & Vaishyas; urban growth.',
      '**Buddha**: Siddhartha of the **Shakya** clan, born **Lumbini**; parents Suddhodana & Mahamaya; wife Yashodhara, son Rahula. Renunciation at 29; **enlightenment at Bodh Gaya** (Niranjana river) at 35; **first sermon at Sarnath** (Dharmachakrapravartana); **death at Kushinagar** (Malla) at 80.',
      'Teachings: **Four Noble Truths**, **Eightfold Path** (Middle Way), anicca (impermanence), anatta (no-soul), **pratityasamutpada** (dependent origination). Triratna: Buddha, Dhamma, Sangha.',
      'Buddhist councils: **1st Rajagriha** (Ajatashatru; Mahakassapa; Sutta & Vinaya) · **2nd Vaishali** (Kalashoka; Sabakami; split into Sthaviravadins & Mahasanghikas) · **3rd Pataliputra** (Ashoka; Moggaliputta Tissa; Abhidhamma; missions) · **4th Kashmir/Kundalavana** (Kanishka; Vasumitra & Ashvaghosha; Mahayana–Hinayana split).',
      '**Jainism**: 24 Tirthankaras; 1st **Rishabhanatha**; 23rd **Parshvanatha** (4 vows: ahimsa, satya, asteya, aparigraha); 24th **Mahavira** added **brahmacharya**.',
      '**Mahavira**: born **Kundagrama** near Vaishali; father Siddhartha (Jnatrika clan), mother **Trishala** (Licchavi, sister of Chetaka); kaivalya at **Jrimbhikagrama** (Rijupalika river) at 42; death at **Pavapuri** at 72.',
      'Jain ideas: **Triratna** (right faith, knowledge, conduct), **anekantavada**, **syadvada** (7-fold predication), **sallekhana** (fasting unto death).',
      'Sects: **Digambara** (Bhadrabahu went south with Chandragupta Maurya during famine) vs **Shvetambara** (Sthulabhadra). Councils: **Pataliputra** (c. 300 BCE, Sthulabhadra) and **Valabhi** (5th–6th c. CE, Devardhi Kshamashramana).',
      '**Ajivikas**: **Makkhali Gosala** — **niyati** (strict fatalism). Ashoka and Dasharatha gifted the **Barabar & Nagarjuni caves** to them.',
      'Other teachers: **Ajita Kesakambalin** (materialist), **Purana Kassapa** (no merit or sin), **Pakudha Kaccayana** (eternal elements), **Sanjaya Belatthiputta** (sceptic).'
    ],
    m: [['Councils: “RVPK” + “AKAK”', 'Places Rajagriha–Vaishali–Pataliputra–Kashmir; kings Ajatashatru–Kalashoka–Ashoka–Kanishka.'],
      ['“Lumbini → Bodh Gaya → Sarnath → Kushinagar” = Born, Bodhi, Sermon, Sleep', 'Four great places of the Buddha’s life in order.']],
    f: ['Mahavira and the Buddha were contemporaries, and both were Kshatriyas from republican clans.', 'Buddhist texts speak of 62 rival schools of thought in the Buddha’s time.'],
    d: 'Buddhist councils\n 1st Rajagriha — Ajatashatru — Mahakassapa\n 2nd Vaishali — Kalashoka — Sabakami\n 3rd Pataliputra — Ashoka — Moggaliputta Tissa\n 4th Kashmir — Kanishka — Vasumitra',
    k: ['Teach the Eightfold Path to a 10-year-old in three groups: wisdom, conduct, meditation.'],
    r: ['Upinder Singh ch. 6'],
    q: [
      Q.mt('Match the Buddhist council with its patron king:', ['First', 'Second', 'Third', 'Fourth'], ['Ajatashatru', 'Kalashoka', 'Ashoka', 'Kanishka'], '', ['Council', 'King']),
      Q.mcq('Which Tirthankara added brahmacharya to the four vows?', ['Rishabhanatha', 'Parshvanatha', 'Neminatha', 'Mahavira'], 3, ''),
      Q.mcq('The doctrine of niyati (fatalism) is associated with:', ['Ajita Kesakambalin', 'Makkhali Gosala', 'Purana Kassapa', 'Sanjaya Belatthiputta'], 1, ''),
      Q.mcq('The Barabar caves were donated to the:', ['Buddhists', 'Jainas', 'Ajivikas', 'Charvakas'], 2, ''),
      Q.ch('Arrange the events of the Buddha’s life in order:', ['Birth at Lumbini', 'Enlightenment at Bodh Gaya', 'First sermon at Sarnath', 'Mahaparinirvana at Kushinagar'], ''),
      Q.ar('The split between Mahayana and Hinayana is associated with the Fourth Buddhist Council.', 'The Fourth Council was held under the patronage of Kanishka.', 1, 'Both true; Kanishka’s patronage does not explain the split.'),
      Q.s2('Mahavira attained kaivalya at Pavapuri.', 'Mahavira’s mother Trishala was a Licchavi princess.', false, true, 'Kaivalya at Jrimbhikagrama; death at Pavapuri.')
    ] });
})(window.JRF);

/* UNIT II — Magadha to Harsha */
(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'h2-mag', u: 'H2', t: 'Rise of Magadha, Persian & Alexander’s invasions', h: 2,
    p: [
      '**Haryanka**: **Bimbisara** (c. 544–492 BCE) — marriage alliances with Kosala (got a Kashi village as dowry), Licchavis (Chellana) & Madra (Khema); annexed **Anga**; sent physician **Jivaka** to cure Pradyota of Avanti.',
      '**Ajatashatru** (c. 492–460 BCE): killed his father; crushed Vajji using **mahashilakantaka** (catapult) & **rathamusala** (chariot with mace); built a fort at **Pataligrama**; patron of **1st Buddhist council**.',
      '**Udayin** founded **Pataliputra** at the Ganga–Son confluence. **Shishunaga** destroyed the Pradyota dynasty of Avanti; **Kalashoka** hosted the 2nd council.',
      '**Nandas**: **Mahapadma Nanda** — “Ekarat”, “Sarvakshatrantaka” (destroyer of all Kshatriyas), conquered Kalinga (Hathigumpha mentions Nandaraja’s canal). **Dhana Nanda** = Greek “Agrammes”; his army frightened Alexander’s soldiers.',
      'Why Magadha won: **iron** (Gaya/Barabar hills), fertile alluvium, rivers Ganga–Son–Gandak, **elephants** from forests, hill-girt **Rajagriha** & water-fort **Pataliputra**, ambitious rulers, less orthodox society.',
      'Persians: **Cyrus** took Gandhara; **Darius I** made India (Hindush) the **20th satrapy** paying 360 talents of gold dust (Herodotus). **Kharoshthi** derives from Aramaic.',
      '**Alexander**: crossed Indus **326 BCE**; **Ambhi of Taxila** submitted; **Battle of Hydaspes (Jhelum)** vs **Porus**; troops refused to go beyond the **Beas (Hyphasis)**; died at Babylon **323 BCE**.',
      'Effects: opened land & sea routes, Greek settlements, gives a fixed date (326 BCE) for Indian chronology, weakened NW states → easier for Chandragupta Maurya.'
    ],
    m: [['“Hari Shishu Nanda” → H-S-N', 'Magadha dynasties in order: Haryanka → Shishunaga → Nanda → Maurya.'],
      ['Bimbisara’s 3 wives = 3 alliances', 'Kosala-devi (Kosala), Chellana (Licchavi), Khema (Madra).']],
    f: ['Bimbisara is said to have been a friend of both the Buddha and Mahavira.', 'Alexander spent only about 19 months in India.'],
    d: 'Magadha dynasties\n Haryanka\n  Bimbisara → Ajatashatru → Udayin\n Shishunaga\n  Shishunaga → Kalashoka\n Nanda\n  Mahapadma → Dhana Nanda\n Maurya\n  Chandragupta (c. 321 BCE)',
    k: ['List five geographical reasons for Magadha’s rise without looking.'],
    r: ['Upinder Singh ch. 6', 'IGNOU MHI-104 (Mahajanapadas to empire)'],
    q: [
      Q.mcq('Who founded the city of Pataliputra?', ['Bimbisara', 'Ajatashatru', 'Udayin', 'Mahapadma Nanda'], 2, 'Ajatashatru built a fort at Pataligrama; Udayin founded the city.'),
      Q.mcq('Alexander’s army refused to march beyond the river:', ['Jhelum', 'Chenab', 'Ravi', 'Beas'], 3, 'Hyphasis = Beas.'),
      Q.ch('Arrange the dynasties of Magadha chronologically:', ['Haryanka', 'Shishunaga', 'Nanda', 'Maurya'], ''),
      Q.mcq('Which Persian ruler made north-west India the twentieth satrapy?', ['Cyrus', 'Darius I', 'Xerxes', 'Cambyses'], 1, ''),
      Q.ar('Magadha had a military advantage over its rivals.', 'Its forests supplied elephants and its hills supplied iron.', 0, '')
    ] });

  T({ id: 'h2-mau', u: 'H2', t: 'Mauryan empire: expansion, polity, society, economy', h: 3,
    p: [
      '**Chandragupta Maurya** (c. 321–297 BCE): with **Kautilya/Chanakya** overthrew Dhana Nanda; defeated **Seleucus Nicator (c. 305 BCE)** → got Arachosia, Gedrosia, Paropamisadae, Aria; **Megasthenes** came as envoy. Jain tradition: went south with **Bhadrabahu**, died by **sallekhana** at Shravanabelagola.',
      'Junagadh inscription: his governor **Pushyagupta** built the **Sudarshana lake**.',
      '**Bindusara** (c. 297–273 BCE): “**Amitraghata**” (slayer of foes); asked **Antiochus I** for sweet wine, dried figs and a sophist; envoy **Deimachus**; Ajivika leanings; Ashoka suppressed a Taxila revolt.',
      '**Ashoka** (c. 268–232 BCE): **Kalinga war c. 261 BCE** (8th regnal year). Called “Devanampiya Piyadasi”; the name “Ashoka” appears in **Maski, Gujarra, Nittur, Udegolam** minor edicts.',
      'Centre: king + **mantriparishad**; Arthashastra’s **18 tirthas**; **Samaharta** (chief revenue collector), **Sannidhata** (treasurer); **adhyakshas** (superintendents: sita – crown agriculture, panya – trade, shulka – tolls, akara – mines, lavana – salt).',
      'Provinces: **Pataliputra** (centre), **Taxila** (Uttarapatha), **Ujjayini** (Avanti), **Tosali** (Kalinga), **Suvarnagiri** (Dakshinapatha) — under **Kumaras/Aryaputras**. Local: **Rajuka** (land & justice), Pradeshika, Yukta, Gramika.',
      'Megasthenes: **7 castes** (philosophers, farmers, soldiers, herdsmen, artisans, magistrates, councillors); Pataliputra run by **6 committees × 5 members**; officials **Agronomoi** (district) & **Astynomoi** (city).',
      'Economy: crown land (**sita**), taxes **bhaga** (usually 1/6), **bali**, **hiranya** (cash); state control of mines & salt; punch-marked silver (**karshapana**) & copper (**mashaka**) coins; salaries in **panas**.',
      '**Saptanga** theory of state (Arthashastra): **Swami, Amatya, Janapada, Durga, Kosha, Danda, Mitra**.',

  T({ id: 'h2-ash', u: 'H2', t: 'Ashoka’s Dhamma, edicts, language & script', h: 2.5,
    p: [
      '**14 Major Rock Edicts** at Kalsi, Girnar, Shahbazgarhi, Mansehra, Dhauli, Jaugada, Sopara, Erragudi, Sannati, Kandahar (fragments). At **Dhauli & Jaugada**, RE XI–XIII are replaced by the **two Separate Kalinga Edicts**.',
      '**RE XIII**: Kalinga war (1 lakh killed, 1.5 lakh deported); **dhammavijaya**; names five Greek kings — **Antiochus II, Ptolemy II, Antigonus Gonatas, Magas, Alexander**.',
      '**RE II**: medical care for humans & animals; mentions **Cholas, Pandyas, Satiyaputras, Keralaputras, Tambapanni** (Sri Lanka).',
      'RE I: ban on animal sacrifice & festive **samajas** · RE III: officials tour every 5 years · RE IV: **dhammaghosha** replaces bherighosha · **RE V: Dhamma-mahamattas** appointed · RE VIII: **dhamma-yatras** replace hunting tours (visit to Sambodhi) · RE IX: useless ceremonies criticised · **RE XII: religious tolerance**, restraint in speech.',
      '**7 Pillar Edicts**; **PE VII only on the Delhi-Topra pillar** (brought to Delhi by Firoz Shah Tughlaq).',
      '**Rummindei (Lumbini)** pillar: village exempted from bali, bhaga reduced to **1/8**. **Nigali Sagar**: enlarged stupa of Buddha Konakamana. **Sarnath, Sanchi, Allahabad**: “schism edict”.',
      'Minor Rock Edicts: **Maski** (first found with the name Ashoka), Gujarra, Brahmagiri, Rupnath, Sasaram, Ahraura, **Bairat/Bhabru** (Ashoka’s faith in Buddha–Dhamma–Sangha; list of 7 texts).',
      '**Dhamma** = a moral code: obedience to parents, respect for elders, teachers, brahmanas & shramanas, kindness to slaves & servants, non-violence, tolerance, generosity.',
      'Interpretations: **Buddhist upasaka ethic** (D.R. Bhandarkar) vs **policy for social cohesion of a diverse empire** (Romila Thapar).',
      'Language **Prakrit**; scripts **Brahmi** (most), **Kharoshthi** (NW), **Greek & Aramaic** (Afghanistan).'
    ],
    m: [['RE “2-5-12-13”', '2 = medicine & southern neighbours; 5 = Dhamma-mahamattas; 12 = tolerance; 13 = Kalinga war & Greek kings.'],

    d: 'Ashokan inscriptions\n Major Rock Edicts (14)\n  RE XIII Kalinga war\n  Separate Kalinga Edicts (Dhauli, Jaugada)\n Minor Rock Edicts\n  Maski (name Ashoka)\n  Bairat/Bhabru\n Pillar Edicts (7)\n  PE VII only Delhi-Topra\n Minor Pillar Edicts\n  Rummindei (Lumbini)\n  Schism edict (Sarnath, Sanchi)',

      Q.mcq('Pillar Edict VII is found only on the pillar at:', ['Delhi-Meerut', 'Delhi-Topra', 'Allahabad-Kosam', 'Rampurva'], 1, ''),
      Q.mcq('Which inscription first revealed the name “Ashoka”?', ['Rummindei', 'Maski', 'Girnar', 'Dhauli'], 1, ''),
      Q.mt('Match the Rock Edict with its theme:', ['RE II', 'RE V', 'RE XII', 'RE XIII'], ['Medical care & southern neighbours', 'Appointment of Dhamma-mahamattas', 'Religious tolerance', 'Kalinga war'], '', ['Edict', 'Theme']),
      Q.st('Which statements about the Rummindei pillar are correct?', ['It marks Lumbini as the Buddha’s birthplace.', 'The village was exempted from bali.', 'The bhaga was reduced to one-eighth.', 'It is written in Greek.'], [true, true, true, false], ''),

  T({ id: 'h2-maud', u: 'H2', t: 'Mauryan decline; Mauryan art & architecture', h: 1.5,

  T({ id: 'h2-pm', u: 'H2', t: 'Post-Mauryan north: Shungas, Kanvas, Indo-Greeks, Shakas, Parthians, Kushanas', h: 3,
    p: [
      '**Shungas**: **Pushyamitra** (c. 187–151 BCE), two **ashvamedhas** (Ayodhya inscription of Dhanadeva), Patanjali as priest; Buddhist texts accuse him of persecution (debated). Son **Agnimitra** = hero of Kalidasa’s *Malavikagnimitram*.',
      '**Heliodorus pillar** (Besnagar/Vidisha): set up by **Heliodorus**, envoy of Indo-Greek **Antialcidas**, at the court of Shunga **Bhagabhadra**; calls himself a **Bhagavata** (Garuda pillar to Vasudeva).',
      '**Kanvas** (c. 73–28 BCE): Vasudeva Kanva killed the last Shunga Devabhuti; ended by the Satavahanas.',
      '**Indo-Greeks**: Demetrius; **Menander/Milinda** (capital **Sakala**/Sialkot) — *Milindapanho* (questions to monk **Nagasena**). Gave **coins with portraits & bilingual legends**, Hellenistic art (→ Gandhara), astronomy (*Yavanajataka*), *yavanika* (curtain).',
      '**Shakas**: first king **Maues (Moga)**. Branches incl. **Kshaharatas** (Western India – **Nahapana**, defeated by Gautamiputra Satakarni) and **Kardamakas** of Ujjain (**Chashtana**, **Rudradaman I**). Vikrama era **57 BCE** linked to a legend of expelling Shakas.',
      '**Rudradaman I** (c. 130–150 CE): **Junagadh inscription** — repaired **Sudarshana lake**; defeated the Satavahanas twice; Sanskrit patron. Western Kshatrapas ended by **Chandragupta II**.',
      '**Parthians (Pahlavas)**: **Gondophernes** (Takht-i-Bahi inscription); tradition of **St. Thomas** visiting his court.',
      '**Kushanas** (Yuezhi): Kujula Kadphises → Vima Takto → **Vima Kadphises** (first large **gold coins**; Shiva devotee) → **Kanishka** → Huvishka → Vasudeva I.',
      '**Kanishka**: capitals **Purushapura (Peshawar)** & **Mathura**; **Rabatak inscription** (Bactrian) gives genealogy; **4th Buddhist council**; patron of **Ashvaghosha, Vasumitra, Nagarjuna, Charaka**. Era usually linked with **78 CE (Shaka era)**; some scholars (e.g. Falk) argue 127 CE.',
      'Kushana titles: **Devaputra, Maharaja, Rajatiraja, Kaisara**; royal portrait gallery (**devakula**) at **Mat**, Mathura (headless Kanishka statue).'
    ],
    m: [['“Kushan KVK-HV”', 'Kujula, Vima Takto, (Vima) Kadphises, Kanishka, Huvishka, Vasudeva.'],
      ['Sudarshana lake relay', 'Built: Pushyagupta (Chandragupta) → channels: Tushaspha (Ashoka) → repaired: Rudradaman → repaired: Parnadatta & Chakrapalita (Skandagupta).']],
    f: ['The Shaka era (78 CE) is the basis of India’s official national calendar adopted in 1957.', 'Menander’s debates with Nagasena are among the earliest “dialogues” between Greek and Indian thought.'],
    d: 'Post-Mauryan North\n Indigenous\n  Shungas → Kanvas\n Foreign\n  Indo-Greeks (Menander)\n  Shakas (Nahapana, Rudradaman)\n  Parthians (Gondophernes)\n  Kushanas (Kanishka)',
    k: ['Tell the “Sudarshana lake relay” story with all four names.'],
    r: ['Upinder Singh ch. 8'],
    q: [
      Q.mcq('The Heliodorus pillar at Besnagar was dedicated to:', ['Shiva', 'Vasudeva', 'Surya', 'Buddha'], 1, ''),
      Q.mcq('Milindapanho is a dialogue between Menander and:', ['Nagarjuna', 'Nagasena', 'Ashvaghosha', 'Vasumitra'], 1, ''),
      Q.mcq('Which Kushana ruler first issued gold coins on a large scale?', ['Kujula Kadphises', 'Vima Kadphises', 'Kanishka', 'Huvishka'], 1, ''),
      Q.mcq('The Rabatak inscription is written in:', ['Prakrit', 'Sanskrit', 'Bactrian', 'Aramaic'], 2, ''),
      Q.mt('Match the ruler with the dynasty:', ['Nahapana', 'Gondophernes', 'Menander', 'Pushyamitra'], ['Kshaharata Shaka', 'Parthian', 'Indo-Greek', 'Shunga'], '', ['Ruler', 'Dynasty']),
      Q.ch('Arrange the Kushana rulers chronologically:', ['Kujula Kadphises', 'Vima Kadphises', 'Kanishka', 'Huvishka'], ''),

    ] });

  T({ id: 'h2-sat', u: 'H2', t: 'Satavahanas, Kharavela & Jainism', h: 2,
    p: [
      'Founder **Simuka**; capital **Pratishthana (Paithan)** on the Godavari; later Amaravati/Dharanikota in Andhra. Puranas call them “Andhras”.',
      '**Satakarni I**: **Naneghat inscription** of queen **Naganika**; performed ashvamedha & rajasuya; “Dakshinapathapati”.',
      '**Hala**: compiled ***Gathasattasai*** (700 Prakrit verses).',
      '**Gautamiputra Satakarni** (c. 106–130 CE): **Nasik inscription of his mother Gautami Balashri** — destroyer of Shakas, Yavanas, Pahlavas; uprooted the **Kshaharatas (Nahapana)**; “**ekabrahmana**”; stopped varna-mixing. Restruck Nahapana’s coins (Jogalthembi hoard).',
      'Later: Vasishthiputra Pulumavi (Andhra), **Yajna Sri Satakarni** (last great king; **ship-motif coins**).',
      'Features: **metronymics** (Gautamiputra, Vasishthiputra) but **patrilineal** succession; **earliest land grants** to brahmanas & Buddhist monks with tax immunities; feudatory titles **Maharathi, Mahabhoja, Mahasenapati**; lead & potin coins; Prakrit.',
      'Monuments: chaityas & viharas at **Karle** (largest chaitya), Bhaja, Nasik, Kanheri; **Sanchi gateways** (ivory-carvers of Vidisha) & **Amaravati** stupa.',
      '**Kharavela** of Kalinga (Mahameghavahana / Chedi dynasty): **Hathigumpha inscription** (Udayagiri, near Bhubaneswar; Prakrit) gives year-by-year deeds; brought back the **Jina image** taken by a Nanda king; extended **Nandaraja’s canal**; great **Jain** patron; Udayagiri–Khandagiri caves (**Rani Gumpha**).'
    ],
    m: [['“Naganika Nanaghat, Gautami Nasik”', 'Two queen-mother inscriptions: Naganika at Naneghat (Satakarni I) and Gautami Balashri at Nasik (Gautamiputra).']],
    f: ['Satavahana kings are named after their mothers (Gautamiputra = son of Gautami), but the throne passed from father to son.', 'Yajna Sri Satakarni’s ship coins hint at a strong maritime trade.'],
    d: 'Satavahanas\n Simuka (founder)\n Satakarni I — Naneghat (Naganika)\n Hala — Gathasattasai\n Gautamiputra Satakarni — Nasik (Gautami Balashri)\n Vasishthiputra Pulumavi\n Yajna Sri — ship coins',

    q: [

      Q.mcq('Gathasattasai was compiled by the Satavahana king:', ['Simuka', 'Hala', 'Pulumavi', 'Satakarni I'], 1, ''),
      Q.ar('The Satavahanas were the first to make land grants to brahmanas and Buddhist monks.', 'Satavahana inscriptions record grants of villages with fiscal and administrative immunities.', 0, ''),
      Q.s2('Satavahana kings bore metronymics.', 'Succession among the Satavahanas was matrilineal.', true, false, 'Names were metronymic, succession patrilineal.')
    ] });

  T({ id: 'h2-sang', u: 'H2', t: 'Sangam age: literature, polity & society', h: 2.5,

      'Three **Sangams** (assemblies) at Madurai under Pandya patronage (tradition from *Iraiyanar Agapporul*). Surviving works mostly from the **third**; **Tolkappiyam** (grammar) linked to the second.',
      'Corpus: **Ettuttokai** (8 anthologies, e.g. Akananuru, Purananuru, Narrinai, Kuruntokai), **Pattuppattu** (10 idylls, e.g. Maduraikkanchi, Pattinappalai), **Patinenkilkanakku** (18 minor works incl. **Tirukkural** of Tiruvalluvar).',
      'Epics: **Silappadikaram** (Ilango Adigal — Kannagi & Kovalan; Pattini cult) and **Manimekalai** (Sittalai Sattanar — Buddhist). Later: Sivaka Chintamani (Jain).',
      'Themes: **akam** (love, inner life) and **puram** (war, ethics, public life).',
      'Five **tinai** (landscapes): **Kurinji** (hills, Murugan) · **Mullai** (pasture, Mayon) · **Marutam** (wetland farming, Vendan) · **Neytal** (coast, Varunan) · **Palai** (arid land, Korravai).',
      'Three crowned kings (**muvendar**): **Cheras** (Vanji/Karur; bow; port Muziris; Senguttuvan), **Cholas** (Uraiyur & Puhar; tiger; **Karikala** — Battle of Venni, **Kallanai** on Kaveri), **Pandyas** (Madurai; fish; port Korkai; Nedunjeliyan – Talaiyalanganam). Plus **Velir** chieftains.',
      'Polity: king (ko/vendan), court (**avai**), officials amaichar, purohitar, senapatiyar, dutar, orrar (spies); **hero-stones (nadukal)** for fallen warriors.',
      'Society: Vellalar (farmers), Arasar, bards **Panar & Viraliyar**, women poets **Avvaiyar**, Nachchellai, Kakkaipadiniyar; brahmanas present.',
      'Economy & trade: rice, pepper, pearls, muslin; ports **Muziris, Tondi, Korkai, Puhar, Arikamedu**; **Yavanas** (Romans) in Tamil poems; Roman coin hoards.'

      Q.mt('Match the tinai with its landscape:', ['Kurinji', 'Mullai', 'Marutam', 'Neytal'], ['Hilly region', 'Pastoral forest', 'Agricultural wetland', 'Coastal region'], '', ['Tinai', 'Landscape']),
      Q.mcq('Silappadikaram was written by:', ['Tiruvalluvar', 'Ilango Adigal', 'Sittalai Sattanar', 'Tolkappiyar'], 1, ''),

  T({ id: 'h2-trade', u: 'H2', t: 'Trade & commerce (2nd c. BCE–3rd c. CE), Roman trade, Mahayana', h: 2,

      'Use of the **monsoon winds** for direct sailing (credited to **Hippalus** in the *Periplus*) boosted Indo-Roman sea trade from the 1st c. CE.',
      'Exports: **pepper** (“yavanapriya”), spices, **muslin**, beryl & gems, ivory, indigo, sandalwood, steel. Imports: **Roman gold & silver coins**, wine & olive oil in **amphorae**, **Arretine ware**, glass, tin, lead, coral.',
      'Ports: **Barygaza/Bharukachchha** (Broach), **Sopara, Kalyan, Muziris, Arikamedu (Poduke), Puhar, Tamralipti**.',
      '**Pliny** complained that India drained Rome’s gold. **Arikamedu** (Wheeler, 1945) yielded Roman pottery & a bead industry.',
      '**Guilds (shreni)** acted as bankers: the **Nasik inscription** records money deposited with weavers’ guilds for interest.',
      '**Mahayana**: **Bodhisattva** ideal, Buddha images & worship, Sanskrit texts, salvation for all; thinkers **Nagarjuna** (Madhyamika/Shunyavada), **Asanga & Vasubandhu** (Yogachara), **Ashvaghosha** (*Buddhacharita*).',

    r: ['Upinder Singh ch. 8', 'IGNOU MHI-105 (trade)'],
    q: [
      Q.mcq('Arretine ware found at Arikamedu indicates contact with:', ['China', 'Rome', 'Persia', 'Egypt only'], 1, ''),
      Q.mcq('Barygaza of the Greek sources is modern:', ['Sopara', 'Broach', 'Kalyan', 'Muziris'], 1, ''),
      Q.mt('Match the Mahayana thinker with the school/work:', ['Nagarjuna', 'Asanga', 'Ashvaghosha', 'Vasumitra'], ['Madhyamika', 'Yogachara', 'Buddhacharita', 'President of the Fourth Council'], '', ['Thinker', 'School/Work']),

  T({ id: 'h2-art', u: 'H2', t: 'Post-Mauryan art: Gandhara, Mathura, Amaravati, stupas & caves', h: 1.5,

      '**Amaravati** (Krishna valley, Andhra): **white marble/limestone**; lively **narrative reliefs** (Jatakas); patrons **Satavahanas & Ikshvakus**; also Nagarjunakonda, Goli, Jaggayyapeta.',
      'Stupas: **Bharhut** (Shunga; labelled railing reliefs), **Sanchi** gateways (Satavahana era), **Amaravati**.',

  T({ id: 'h2-gup', u: 'H2', t: 'Gupta–Vakataka age: polity, land grants, revenue, coins', h: 3,
    p: [
      'Kings: Sri Gupta → Ghatotkacha → **Chandragupta I** (Gupta era **319–320 CE**; married Licchavi princess **Kumaradevi**) → **Samudragupta** → (Ramagupta) → **Chandragupta II** → **Kumaragupta I** → **Skandagupta** → later Guptas (Budhagupta, Narasimhagupta Baladitya, Vishnugupta).',
      '**Samudragupta** (c. 335–375): **Allahabad prashasti by Harishena** — uprooted **9 kings of Aryavarta**; captured & released **12 kings of Dakshinapatha** (*grahana-moksha-anugraha*); forest kings (*atavika*) made servants; frontier kings & tribes paid tribute; Sri Lankan **Meghavarna** sought leave for a monastery at Bodh Gaya. V.A. Smith: “**Napoleon of India**”. Veena-player coins.',
      '**Chandragupta II Vikramaditya** (c. 375–415): ended the **Western Kshatrapas** (lion-slayer & silver coins); daughter **Prabhavatigupta** married Vakataka **Rudrasena II**; **Mehrauli iron pillar** (“Chandra”); **Udayagiri** Varaha panel; **Fa-Hien** visited; Kalidasa tradition.',
      '**Kumaragupta I**: founded **Nalanda** (Shakraditya in Hiuen Tsang); peacock/Kartikeya coins. **Skandagupta**: repelled **Hunas** (**Bhitari** pillar); Junagadh: **Parnadatta & Chakrapalita** repaired the Sudarshana lake.',
      'Hunas: **Toramana** (Eran boar inscription), **Mihirakula** (Gwalior inscription) — defeated by **Yashodharman of Mandasor** & Narasimhagupta.',
      'Administration: grand titles (**Maharajadhiraja, Paramabhattaraka**), divine kingship; **kumaramatyas**; **sandhivigrahika** (peace & war). Units: **bhukti** (uparika) → **vishaya** (vishayapati) → vithi → grama. Town boards (Damodarpur plates): **nagarashreshthi, sarthavaha, prathama-kulika, prathama-kayastha**.',
      'Land grants: **agrahara/brahmadeya** to brahmanas, **devagrahara** to temples — with fiscal & administrative rights → R.S. Sharma’s **Indian feudalism** thesis.',
      'Revenue: **bhaga** (1/4–1/6), bhoga, kara, **udranga, uparikara**, hiranya; **vishti** (forced labour). Land: **kshetra** (cultivated), **khila** (waste), **aprahata** (forest), **vasti** (habitation), gopata sarah (pasture). Measures: nivartana, kulyavapa, dronavapa.',
      'Coins: **most gold coins (dinara)** of ancient India — archer, battle-axe, tiger-slayer, lion-slayer, horseman, **ashvamedha**, **veena** types; purity declines in late Gupta times.',
      '**Vakatakas**: Vindhyashakti (founder); **Pravarasena I** (only Vakataka “Samrat”); **Prabhavatigupta** (regent; Poona plates); **Pravarasena II** (*Setubandha*); **Harishena** (Vatsagulma branch) — patron of **Ajanta caves 16, 17** (minister Varahadeva).',
      'Society: rigid varna, **Chandalas** outside villages (Fa-Hien); **Narada Smriti** lists 15 kinds of slaves; first epigraphic **sati** — **Eran inscription (510 CE)** of Bhanugupta: the wife of his general Goparaja became sati.'
    ],
    m: [['“Sir Ghee Chaawal Samosa, Rajma Chole Kulche Skewers”', 'Sri Gupta, Ghatotkacha, Chandragupta I, Samudragupta, Ramagupta, Chandragupta II, Kumaragupta I, Skandagupta.'],
      ['Bhukti > Vishaya > Vithi > Grama = “Big Vans Visit Gaon”', 'Gupta units from province to village.']],
    f: ['The Mehrauli iron pillar has resisted rust for about 1,600 years thanks to a thin protective “misawite” layer.', 'Samudragupta’s Allahabad prashasti is carved on the same pillar as Ashoka’s edicts.'],
    d: 'Gupta administration\n King (Maharajadhiraja)\n  Mantrin, Sandhivigrahika, Mahadandanayaka\n Bhukti (Uparika)\n  Vishaya (Vishayapati + town board)\n   Vithi\n    Grama (Gramika)',

    q: [

      Q.mt('Match the inscription with the ruler:', ['Bhitari pillar', 'Mehrauli iron pillar', 'Eran inscription (510 CE)', 'Mandasor inscription'], ['Skandagupta', 'Chandra (Chandragupta II)', 'Bhanugupta', 'Yashodharman'], '', ['Inscription', 'Ruler']),

  T({ id: 'h2-gupc', u: 'H2', t: 'Gupta culture: temples, Puranic Hinduism, Sanskrit, science', h: 2.5,
    p: [
      'Beginning of **structural temples**: **Sanchi Temple 17** (flat roof), **Tigawa**, **Bhumara**, **Nachna (Parvati)**, **Deogarh Dashavatara** (early shikhara, panchayatana; Sheshashayi Vishnu panel), **Bhitargaon** (brick, Kanpur).',
      'Puranic Hinduism: **image worship, bhakti, temples, pilgrimage**; Vaishnavism (**Garuda** on Gupta seals/coins; Varaha avatar at Udayagiri), Shaivism, Shakti; Puranas compiled; Smritis of **Narada, Brihaspati, Katyayana, Yajnavalkya**.',
      '**Kalidasa**: dramas *Abhijnanashakuntalam, Malavikagnimitram, Vikramorvashiyam*; epics *Raghuvamsha, Kumarasambhava*; lyrics *Meghaduta, Ritusamhara*.',
      '**Shudraka** – *Mrichchhakatika*; **Vishakhadatta** – *Mudrarakshasa, Devichandraguptam*; **Bhasa** – *Svapnavasavadattam* (13 plays found in 1912); **Bharavi** – *Kiratarjuniya*; **Dandin** – *Dashakumaracharita*; **Vishnu Sharma** – *Panchatantra*; **Amarasimha** – *Amarakosha*; **Vatsyayana** – *Kamasutra*; **Bhartrihari** – *Vakyapadiya*.',
      '**Aryabhata** (b. 476): *Aryabhatiya* (499) — earth rotates on its axis, eclipses explained, **π ≈ 3.1416**, place-value system; worked at Kusumapura.',
      '**Varahamihira**: *Pancha Siddhantika, Brihat Samhita, Brihat Jataka*. **Brahmagupta**: *Brahmasphutasiddhanta* (628) — rules for **zero**. Bhaskara I explained Aryabhata.',
      'Medicine: **Vagbhata** – *Ashtanga Hridaya*; **Palakapya** – *Hastyayurveda* (elephants); earlier **Charaka** (medicine) & **Sushruta** (surgery).',
      'Art: **Ajanta** paintings (Caves 1, 2, 16, 17 — Padmapani Bodhisattva in Cave 1), **Bagh** caves; **Sultanganj** copper Buddha; Sarnath school Buddha images.',
      'Education: **Nalanda** (founded by Kumaragupta I).'
    ],
    m: [['Kalidasa = “3 dramas, 2 epics, 2 lyrics”', 'S-M-V dramas · R-K epics · M-R lyrics.'],
      ['ABV-B = astronomers in order', 'Aryabhata (499) → Varahamihira (6th c.) → Brahmagupta (628) → Bhaskara II (12th c.).']],
    f: ['Aryabhata’s satellite (1975), India’s first, was named after him.', 'Kalidasa’s Meghaduta is a love message sent through a cloud — an ancient “cloud messaging” app!'],
    d: 'Gupta temple evolution\n Stage 1: flat roof (Sanchi 17)\n Stage 2: flat roof + raised platform (Nachna)\n Stage 3: low shikhara (Deogarh)\n Stage 4: oblong (later)\n Stage 5: circular (later)',
    k: ['Name one work each for Kalidasa, Shudraka, Vishakhadatta, Bharavi, Dandin in 20 seconds.'],
    r: ['Upinder Singh ch. 9'],
    q: [
      Q.mt('Match the author with the work:', ['Shudraka', 'Vishakhadatta', 'Bharavi', 'Dandin'], ['Mrichchhakatika', 'Mudrarakshasa', 'Kiratarjuniya', 'Dashakumaracharita'], '', ['Author', 'Work']),
      Q.mcq('The Dashavatara temple is located at:', ['Bhitargaon', 'Deogarh', 'Tigawa', 'Nachna'], 1, ''),
      Q.mcq('Who first stated that the earth rotates on its axis?', ['Varahamihira', 'Aryabhata', 'Brahmagupta', 'Bhaskara I'], 1, ''),
      Q.ch('Arrange the works in chronological order:', ['Aryabhatiya', 'Pancha Siddhantika', 'Brahmasphutasiddhanta', 'Lilavati'], '499 → 6th c. → 628 → 1150 (Bhaskara II).'),

  T({ id: 'h2-har', u: 'H2', t: 'Harsha and his times; Salankayanas & Vishnukundins', h: 1.5,

      '**Pushyabhutis** of Thanesar: Prabhakaravardhana → Rajyavardhana (killed by **Shashanka of Gauda**) → **Harsha (606–647 CE)**; **Harsha era** starts **606 CE**; capital moved to **Kanauj**.',
      'Sister **Rajyashri** (wife of Maukhari Grahavarman) rescued from the Vindhyan forest. **Harsha was defeated by Pulakeshin II** on the **Narmada** (Aihole inscription).',
      '**Hiuen Tsang** visited (c. 630–645): **Kanauj assembly (643)** & **Prayag assembly** (every five years Harsha gave away his wealth — Mahamoksha Parishad).',
      'Harsha wrote **Nagananda, Ratnavali, Priyadarshika**. Court poet **Banabhatta** — *Harshacharita, Kadambari*; also Mayura.',
      'Records: **Banskhera** & **Madhuban** copper plates, **Sonepat** seal. Religion: Shaiva who later favoured Mahayana; patron of **Nalanda**.',
      'Administration: more **feudal** — samantas, officials paid with land; revenue ~1/6. Hiuen Tsang: crown land divided into four parts.',
      'After Harsha: usurper **Arunashva**; Chinese envoy **Wang Xuance** intervened.',

      '**Vishnukundins** (c. 5th–6th c., Andhra): capital Indrapalanagara; **Madhava Varma I** (many sacrifices); **Undavalli & Mogalrajapuram caves** attributed to them; replaced by the **Eastern Chalukyas** of Vengi.'
    ],
    m: [['“Harsha: 606-647, 3 plays, 2 assemblies, 1 defeat”', 'Era 606; Nagananda/Ratnavali/Priyadarshika; Kanauj & Prayag; defeated by Pulakeshin II.']],

(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'h3-dec1', u: 'H3', t: 'Deccan I: Gangas, Kadambas, Chalukyas (Badami, Vengi, Kalyani), Rashtrakutas', h: 3,
    p: [
      '**Kadambas** of Banavasi: founder **Mayurasharman** (a brahmana who became a warrior after an insult at Kanchi); **Talagunda inscription**; **Halmidi** inscription = earliest **Kannada** inscription (c. 450 CE).',
      '**Western Gangas** of Talakad: Jain patrons; minister **Chamundaraya** built the **Gommateshvara (Bahubali)** statue at **Shravanabelagola** (c. 983 CE).',
      '**Chalukyas of Badami (Vatapi)**: Pulakeshin I (founder, ashvamedha) → Kirtivarman I → Mangalesha → **Pulakeshin II (610–642)** — defeated **Harsha** on the Narmada; **Aihole inscription by Ravikirti** (Jain); killed when **Narasimhavarman I Pallava (“Vatapikonda”)** took Vatapi (642).',
      '**Vikramaditya II** captured Kanchi (spared it); queen **Lokamahadevi** built the **Virupaksha temple, Pattadakal**. Temples at **Aihole** (“cradle of Indian temple architecture”), **Badami** (caves), **Pattadakal** (UNESCO: Nagara + Dravida styles side by side).',
      '**Eastern Chalukyas of Vengi**: founded by **Kubja Vishnuvardhana** (brother of Pulakeshin II, c. 624). Later merged with the Cholas by marriage (**Kulottunga I**).',
      '**Rashtrakutas** of Manyakheta (Malkhed): **Dantidurga** overthrew the Badami Chalukyas (c. 753) → **Krishna I** built the **Kailasa temple, Ellora (Cave 16)** → Dhruva & **Govinda III** (raided north in the Tripartite struggle) → **Amoghavarsha I** (wrote *Kavirajamarga* in Kannada, *Prashnottara Ratnamalika*; Jain leanings; Arab Sulaiman praised him as one of four great kings) → Indra III → **Krishna III** (Battle of **Takkolam, 949** vs Cholas).',
      'Arab writers call the Rashtrakuta king **“Balhara”** (Vallabharaja).',
      '**Chalukyas of Kalyani** (Western Chalukyas): **Tailapa II** (973) overthrew the Rashtrakutas; **Vikramaditya VI** (Chalukya-Vikrama era 1076) — court of **Bilhana** (*Vikramankadevacharita*) and **Vijnaneshvara** (*Mitakshara*, on inheritance by birth).'
    ],
    m: [['Badami Chalukya order “P K M P”', 'Pulakeshin I, Kirtivarman I, Mangalesha, Pulakeshin II — “Please Keep My Phone”.'],
      ['Rashtrakuta “D-K-G-A-K”', 'Dantidurga → Krishna I (Kailasa) → Govinda III → Amoghavarsha → Krishna III (Takkolam).']],
    f: ['The Kailasa temple at Ellora was carved top-down out of a single rock — about 2 lakh tonnes of stone removed!', 'Mitakshara’s rule that sons get a right in ancestral property by birth shaped Hindu law until 2005.'],
    d: 'Deccan powers (c. 550–1200)\n Badami Chalukyas (543–753)\n  ↓ overthrown by\n Rashtrakutas (753–973)\n  ↓ overthrown by\n Kalyani Chalukyas (973–1190)\n  ↓ split into\n Yadavas · Kakatiyas · Hoysalas',
    k: ['Narrate the Pallava–Chalukya rivalry as a tennis match with points to each side.'],
    r: ['Upinder Singh ch. 10', 'Satish Chandra ch. 2'],
    q: [
      Q.mcq('Who composed the Aihole inscription?', ['Harishena', 'Ravikirti', 'Bilhana', 'Vijnaneshvara'], 1, ''),
      Q.mcq('The Kailasa temple at Ellora was built by:', ['Dantidurga', 'Krishna I', 'Govinda III', 'Amoghavarsha'], 1, ''),
      Q.mt('Match the author with the work:', ['Amoghavarsha', 'Bilhana', 'Vijnaneshvara', 'Ravikirti'], ['Kavirajamarga', 'Vikramankadevacharita', 'Mitakshara', 'Aihole prashasti'], '', ['Author', 'Work']),
      Q.mcq('The earliest Kannada inscription is from:', ['Talagunda', 'Halmidi', 'Aihole', 'Shravanabelagola'], 1, ''),
      Q.ch('Arrange the dynasties in order of their rise:', ['Chalukyas of Badami', 'Rashtrakutas', 'Chalukyas of Kalyani', 'Yadavas of Devagiri'], ''),

  T({ id: 'h3-dec2', u: 'H3', t: 'Deccan II: Kakatiyas, Hoysalas, Yadavas', h: 1.5,
    p: [
      '**Yadavas (Seunas) of Devagiri**: **Bhillama V** founded Devagiri (c. 1187); **Singhana**; court of **Hemadri** (*Chaturvarga Chintamani*; “Hemadpanti” style). Ramachandra submitted to **Alauddin Khalji (1296)**.',
      '**Kakatiyas of Warangal**: **Ganapati**, **Rudramadevi** (woman ruler; praised by **Marco Polo**), **Prataparudra** (defeated by Ulugh Khan/Muhammad bin Tughlaq, 1323). **Thousand Pillar Temple** (Hanamkonda), **Ramappa temple** (UNESCO 2021), large tanks. Nayankara-like military fiefs.',
      '**Hoysalas of Dvarasamudra (Halebid)**: **Vishnuvardhana** (converted from Jainism by **Ramanuja**) built **Chennakeshava temple, Belur** (1117); **Hoysaleshvara, Halebid**; **Kesava, Somanathapura**. Star-shaped (stellate) plans on raised platforms (jagati), soapstone. Last ruler **Ballala III** fought the Sultanate.',
      'Hoysala temples: “**Sacred Ensembles of the Hoysalas**” — UNESCO (2023).'
    ],
    m: [['“Y-K-H = Devagiri, Warangal, Dvarasamudra”', 'Yadava → Devagiri; Kakatiya → Warangal; Hoysala → Halebid (Dvarasamudra).']],
    f: ['Marco Polo praised Rudramadevi of the Kakatiyas as a just ruler.', 'Ramappa temple is named after its sculptor, not a god or king.'],
    d: 'Successor states of Kalyani Chalukyas\n Yadavas — Devagiri — Alauddin 1296\n Kakatiyas — Warangal — Tughlaq 1323\n Hoysalas — Dvarasamudra — Malik Kafur 1311',

    q: [

      Q.mcq('Rudramadevi belonged to the dynasty of:', ['Hoysalas', 'Kakatiyas', 'Yadavas', 'Kadambas'], 1, ''),
      Q.mcq('The Chennakeshava temple at Belur was built by:', ['Vishnuvardhana Hoysala', 'Ballala III', 'Ganapati Kakatiya', 'Singhana'], 0, '')
    ] });

  T({ id: 'h3-south', u: 'H3', t: 'South: Pallavas, Cheras, Cholas, Pandyas', h: 3,
    p: [
      '**Pallavas of Kanchi**: Simhavishnu → **Mahendravarman I** (*Mattavilasa Prahasana*; “Vichitrachitta”; Mandagapattu rock-cut temple; converted from Jainism by **Appar**) → **Narasimhavarman I “Mamalla”/“Vatapikonda”** (killed Pulakeshin II, 642; Mahabalipuram **rathas**) → **Narasimhavarman II “Rajasimha”** (**Shore temple**, **Kailasanatha temple Kanchi**) → Nandivarman II (Vaikuntha Perumal) → Aparajita (defeated at **Sripurambiyam**, c. 885).',
      'Pallava art phases: Mahendra (rock-cut halls) → **Mamalla** (monolithic rathas, *Arjuna’s Penance*) → **Rajasimha** (structural temples) → Nandivarman (small temples).',
      '**Imperial Cholas**: **Vijayalaya** took Thanjavur (c. 850) → Aditya I → **Parantaka I** (Uttaramerur inscriptions **919 & 921 CE**) → **Rajaraja I (985–1014)**: Sri Lanka (Anuradhapura), Maldives, **Brihadishvara temple, Thanjavur (1010)**, land survey → **Rajendra I (1014–1044)**: Ganga expedition (“**Gangaikonda Cholapuram**”), **naval raid on Srivijaya (1025)**, “Kadaram-konda” → Rajadhiraja → Kulottunga I (Chalukya-Chola; sent 72 merchants to China).',
      'Chola local government: **ur** (general village assembly), **sabha/mahasabha** (brahmadeya villages), **nagaram** (merchants); **nadu** (group of villages), **valanadu**, **mandalam** (province); committees **variyams** chosen by **kudavolai** (lot from a pot).',
      '**Uttaramerur** inscriptions give qualifications for sabha members (property, age 35–70, Vedic learning) and disqualifications.',
      'Chola art: Dravida temples (Thanjavur, **Gangaikondacholapuram, Darasuram**) — “Great Living Chola Temples” UNESCO; **bronze Nataraja** (lost-wax).',
      '**Pandyas** (early medieval): Kadungon revived the dynasty; later **Maravarman Kulasekhara**; Marco Polo visited **Kayal**; capital Madurai; Malik Kafur raid (1311).',
      '**Cheras / Perumals of Mahodayapuram** (Kodungallur): **Kulasekhara Alvar**; **Cheraman Perumal** legends; Syrian Christian & Jewish copper plates (Tarisapalli).'
    ],
    m: [['Pallava “Simha-Mahendra-Narasimha” = Lion, King, Man-Lion', 'Simhavishnu → Mahendravarman I → Narasimhavarman I → … Rajasimha (Narasimhavarman II).'],
      ['Chola levels “U-S-N” + “N-V-M”', 'Assemblies: Ur, Sabha, Nagaram. Units: Nadu → Valanadu → Mandalam.']],
    f: ['The shadow of the Thanjavur temple’s vimana is said never to fall on the ground at noon — a popular myth, not true!', 'Rajendra I brought Ganga water to his new capital and dug a lake called Cholagangam.'],
    d: 'Chola administration\n King\n Mandalam (province)\n  Valanadu\n   Nadu\n    Ur / Sabha / Nagaram\n     Variyams (committees, kudavolai lots)',
    k: ['Explain how a Chola village elected committee members by kudavolai.'],
    r: ['Satish Chandra ch. 3', 'Upinder Singh ch. 10', 'Nilakanta Sastri, The Colas'],
    q: [
      Q.mcq('The Uttaramerur inscriptions belong to the reign of:', ['Rajaraja I', 'Parantaka I', 'Rajendra I', 'Vijayalaya'], 1, ''),
      Q.mcq('The Shore temple at Mahabalipuram was built by:', ['Mahendravarman I', 'Narasimhavarman I', 'Narasimhavarman II', 'Nandivarman II'], 2, ''),

  T({ id: 'h3-wn', u: 'H3', t: 'West & North: Maitrakas, Chaulukyas, Pratiharas, Kalachuris, Gahadavalas, Paramaras; Tripartite struggle', h: 2.5,
    p: [
      '**Maitrakas of Valabhi** (Saurashtra): founded by **Bhatarka**; Valabhi = great centre of learning (I-tsing compares it to Nalanda); **Jain council at Valabhi** (5th–6th c.).',
      '**Chaulukyas/Solankis of Gujarat** (Anahilapataka/Patan): **Mularaja I**; **Bhima I** (Somnath sacked by Mahmud 1025; **Modhera Sun temple** 1026); **Jayasimha Siddharaja**; **Kumarapala** (Jain scholar **Hemachandra**); queen **Naiki Devi** (regent for **Mularaja II**) defeated Muhammad Ghori at **Kayadara (1178)**. Ministers Vastupala–Tejapala built **Dilwara (Mt Abu)** temples.',
      '**Gurjara-Pratiharas** (Kanauj): **Nagabhata I** (resisted Arabs) → Vatsaraja → **Nagabhata II** (took Kanauj) → **Mihira Bhoja** (**Gwalior prashasti**; Adivaraha coins; Sulaiman: best cavalry, enemy of Islam) → Mahendrapala I (patron of **Rajashekhara** – *Karpuramanjari, Kavyamimamsa*) → decline after Rashtrakuta Indra III sacked Kanauj (c. 916).',
      '**Tripartite struggle** (c. 750–950) for **Kanauj** between **Palas, Pratiharas, Rashtrakutas**. Kanauj = symbol of imperial power after Harsha.',
      '**Kalachuri-Chedis** of Tripuri (Jabalpur): **Gangeyadeva** (Vikramaditya title), **Lakshmikarna** (Karna) — powerful 11th c.',
      '**Gahadavalas** of Kanauj/Varanasi: **Chandradeva** (founder), **Govindachandra** (minister Lakshmidhara – *Kritya-kalpataru*), **Jayachandra** (killed at **Chandawar, 1194** by Muhammad Ghori). “**Turushkadanda**” tax.',
      '**Paramaras of Malwa** (Dhara): Munja, **Bhoja (c. 1010–1055)** — poet-king, *Samaranganasutradhara* (architecture), *Yuktikalpataru*, **Bhojshala** & Bhojpur temple & lake.',
      'Also important: **Chahamanas/Chauhans** of Shakambhari & Ajmer (**Prithviraj III**), **Chandelas** of Jejakabhukti (**Khajuraho**, Kandariya Mahadeva by Vidyadhara; Lakshmana temple by Yashovarman).'
