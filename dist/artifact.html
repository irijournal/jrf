  T({ id: 'h3-char', u: 'H3', t: 'Early medieval polity: legitimation & state-formation debates', h: 2.5,
    p: [
      'Features: many **regional kingdoms**, **samanta** (subordinate chief) system, land grants, titles like **mahasamanta, maharajadhiraja**, temples and Puranic religion used for **legitimation**.',
      'Legitimation tools: **genealogies** linking kings to solar/lunar lines, **prashastis**, grants to brahmanas & temples, big temples (state deity), **coronation rituals**, patronage of Sanskrit.',
      '**A) Feudal model** — **R.S. Sharma** (*Indian Feudalism*, 1965), **D.D. Kosambi** (“feudalism from above” & “from below”), **B.N.S. Yadava**: land grants → decentralisation, decline of trade & towns (urban decay), fewer coins, peasant subjection, forced labour (**vishti**), sub-infeudation.',
      'Critiques: **D.C. Sircar** (grants did not create feudal lords), **Harbans Mukhia** (“Was there feudalism in Indian history?” — peasants were free; no serfdom), **B.D. Chattopadhyaya** (trade & towns did not decline uniformly).',
      '**B) Segmentary state** — **Burton Stein** (*Peasant State and Society in Medieval South India*, 1980; model borrowed from Aidan **Southall**’s African studies): Chola king had real power only in the core; ritual sovereignty elsewhere; **nadu** as peasant micro-regions.',
      'Critiques: Kesavan Veluthat, R. Champakalakshmi, Noboru **Karashima** (Chola state had real bureaucracy & revenue).',
      '**C) Integrative / processual model** — **B.D. Chattopadhyaya** (*The Making of Early Medieval India*, 1994), Hermann Kulke: local state formation through **integration** of tribes, lineages, land grants, temples; expansion of agrarian society — not decline.',
      'Also: **Hermann Kulke** — “**nuclear area**” of states and the role of **Jagannatha cult** in Odisha (royal legitimation).'
    ],
    m: [['F-S-I = Sharma, Stein, Chattopadhyaya', 'Feudal (Sharma/Kosambi/Yadava), Segmentary (Stein/Southall), Integrative (Chattopadhyaya/Kulke).']],
    f: ['Burton Stein borrowed the segmentary state idea from studies of the Alur people in Uganda.'],
    d: 'State formation debates\n Feudal model\n  R.S. Sharma, D.D. Kosambi, B.N.S. Yadava\n  Critics: Mukhia, Sircar\n Segmentary model\n  Burton Stein (from Southall)\n  Critics: Veluthat, Karashima\n Integrative model\n  B.D. Chattopadhyaya, H. Kulke',
    k: ['Defend and attack the feudal model in one minute each.'],
    r: ['Upinder Singh ch. 10', 'IGNOU MHI-104 (Early medieval state block)', 'Harbans Mukhia (ed.), The Feudalism Debate'],
    q: [
      Q.mt('Match the historian with the model:', ['R.S. Sharma', 'Burton Stein', 'B.D. Chattopadhyaya', 'Harbans Mukhia'], ['Indian feudalism', 'Segmentary state', 'Integrative model', 'Critique: “Was there feudalism?”'], '', ['Historian', 'Model']),
      Q.mcq('Burton Stein adapted the segmentary state concept from the work of:', ['Max Weber', 'Aidan Southall', 'Karl Marx', 'Marc Bloch'], 1, ''),
      Q.mcq('“The Making of Early Medieval India” was written by:', ['R.S. Sharma', 'B.D. Chattopadhyaya', 'Hermann Kulke', 'D.N. Jha'], 1, ''),
      Q.ar('According to the feudal model, early medieval India saw a decline of trade and towns.', 'Land grants led to closed village economies and fewer coins.', 0, ''),
      Q.s2('Harbans Mukhia argued that Indian peasants were not serfs like those of Europe.', 'Burton Stein based his model on Chola inscriptions and the nadu.', true, true, '')
    ] });

  T({ id: 'h3-econ', u: 'H3', t: 'Agrarian economy, land rights, taxation, coins; trade, towns, guilds, SE Asia', h: 2.5,

  T({ id: 'h4-src', u: 'H4', t: 'Sources of medieval Indian history', h: 2.5,
    p: [
      'Sultanate chronicles: **Hasan Nizami** – *Taj-ul-Maasir* (first official history) · **Minhaj-us-Siraj** – *Tabaqat-i-Nasiri* (to 1259/60) · **Ziauddin Barani** – *Tarikh-i-Firoz Shahi* & *Fatawa-i-Jahandari* · **Shams Siraj Afif** – *Tarikh-i-Firoz Shahi* · **Isami** – *Futuh-us-Salatin* · **Yahya Sirhindi** – *Tarikh-i-Mubarak Shahi* · Firoz Shah – *Futuhat-i-Firoz Shahi*.',
      '**Amir Khusrau**: *Khazain-ul-Futuh* (Alauddin’s conquests), *Miftah-ul-Futuh* (Jalaluddin), *Qiran-us-Sadain* (Bughra Khan meets Kaiqubad), *Ashiqa* (Deval Rani–Khizr Khan), *Nuh Sipihr* (Mubarak Shah), *Tughlaq Nama*.',
      'Mughal: **Babur** – *Baburnama* (Turki) · **Gulbadan Begum** – *Humayun Nama* · **Jauhar Aftabchi** – *Tazkirat-ul-Waqiat* · **Abbas Khan Sarwani** – *Tarikh-i-Sher Shahi* · **Abul Fazl** – *Akbarnama* (vol. 3 = *Ain-i-Akbari*) · **Badauni** – *Muntakhab-ut-Tawarikh* (critical of Akbar) · **Nizamuddin Ahmad** – *Tabaqat-i-Akbari*.',
      'Later: **Jahangir** – *Tuzuk-i-Jahangiri* · **Abdul Hamid Lahori** – *Badshahnama* · **Inayat Khan** – *Shahjahannama* · **Muhammad Kazim** – *Alamgirnama* · **Saqi Mustaid Khan** – *Maasir-i-Alamgiri* · **Khafi Khan** – *Muntakhab-ul-Lubab* · **Bhimsen** – *Nuskha-i-Dilkusha* · **Ishwardas Nagar** – *Futuhat-i-Alamgiri* · **Firishta** – *Tarikh-i-Firishta* (Bijapur).',
      '**Daftar-khanas** (record rooms): **firman** (emperor’s order), **nishan** (prince’s order), **hasb-ul-hukm** (wazir’s order on emperor’s behalf), **parwana**, **akhbarat** (newsletters by **waqia-navis**), **arzdasht** (petitions); merchants’ **bahis/pothis** (account books); Rajasthan archives (Bikaner, Jaipur — vakil reports).',
      'Sanskrit/regional: *Prithvirajavijaya* (Jayanaka), *Hammira Mahakavya* (Nayachandra Suri), *Prithviraj Raso* (Chand Bardai), Kashmir chronicles of **Jonaraja & Srivara**, *Amuktamalyada* (Krishnadevaraya), Marathi **bakhars**, Assamese **Buranjis**, Odisha **Madala Panji**.',
      'Foreign travellers: **Marco Polo** (Pandya, Kakatiya) · **Ibn Battuta** (Muhammad bin Tughlaq; *Rihla*) · **Nicolo Conti** (Devaraya I) · **Abdur Razzaq** (Devaraya II, 1443) · **Athanasius Nikitin** (Bahmani) · **Domingo Paes** (Krishnadevaraya) · **Fernao Nuniz** (Achyutaraya) · **Ralph Fitch** (Akbar) · **William Hawkins** & **Thomas Roe** (Jahangir) · **Pelsaert** (Jahangir) · **Peter Mundy, Tavernier, Bernier, Manucci** (Shah Jahan–Aurangzeb).'
    ],
    m: [['“Hasan Minhaj Barani Afif” = H M B A', 'Sultanate chroniclers roughly in time order: Hasan Nizami → Minhaj → Barani → Afif.'],
      ['Vijayanagara visitors “C-R-P-N”', 'Conti (Devaraya I) → Razzaq (Devaraya II) → Paes (Krishnadeva) → Nuniz (Achyuta).']],
    f: ['Khafi Khan wrote his history secretly because Aurangzeb had banned official history-writing after his tenth year.', 'Bernier was Dara Shikoh’s physician and later served a Mughal noble.'],
    d: 'Medieval sources\n Persian chronicles\n  Sultanate (Minhaj, Barani, Afif)\n  Mughal (Abul Fazl, Badauni, Lahori)\n Documents\n  Firman, Nishan, Hasb-ul-hukm, Akhbarat\n Regional\n  Bakhars, Buranjis, Madala Panji\n Travellers\n  Ibn Battuta, Razzaq, Paes, Bernier',
    k: ['Pick any three chroniclers and say which ruler each one wrote about.'],
    r: ['V.D. Mahajan ch. 1 (Sources)', 'Satish Chandra (bibliographies at chapter ends)'],
    q: [
      Q.mt('Match the work with the author:', ['Tabaqat-i-Nasiri', 'Tarikh-i-Firoz Shahi (earlier)', 'Futuh-us-Salatin', 'Taj-ul-Maasir'], ['Minhaj-us-Siraj', 'Ziauddin Barani', 'Isami', 'Hasan Nizami'], '', ['Work', 'Author']),
      Q.mt('Match the traveller with the ruler visited:', ['Nicolo Conti', 'Abdur Razzaq', 'Domingo Paes', 'Fernao Nuniz'], ['Devaraya I', 'Devaraya II', 'Krishnadevaraya', 'Achyutadevaraya'], '', ['Traveller', 'Ruler']),
      Q.mcq('An order issued by a Mughal prince was called:', ['Firman', 'Nishan', 'Parwana', 'Hasb-ul-hukm'], 1, ''),
      Q.mcq('Which work is critical of Akbar’s religious policy?', ['Akbarnama', 'Tabaqat-i-Akbari', 'Muntakhab-ut-Tawarikh', 'Ain-i-Akbari'], 2, 'Badauni.'),
      Q.mcq('Humayun Nama was written by:', ['Jauhar Aftabchi', 'Gulbadan Begum', 'Abul Fazl', 'Bayazid Bayat'], 1, ''),
      Q.ch('Arrange the European visitors to the Mughal court in order:', ['Ralph Fitch', 'William Hawkins', 'Thomas Roe', 'François Bernier'], '1580s → 1608 → 1615 → 1650s–60s.')
    ] });

  T({ id: 'h4-ds1', u: 'H4', t: 'Ghorids & the early Turkish (Ilbari) Sultans', h: 2.5,
    p: [
      '**Muhammad Ghori**: Multan 1175 · defeated at **Kayadara (1178)** by the Chaulukyas · took Lahore 1186 (last Ghaznavid) · **Tarain I (1191)** lost to **Prithviraj III** · **Tarain II (1192)** won · **Chandawar (1194)** killed Jayachandra · murdered by Khokhars 1206.',
      '**Bakhtiyar Khalji** raided Bihar (Odantapuri/Nalanda) and took **Nadia** from **Lakshmanasena** (c. 1204).',
      '**Qutbuddin Aibak (1206–10)**: “**Lakh Bakhsh**”; capital **Lahore**; **Quwwat-ul-Islam** mosque, began **Qutb Minar**, **Adhai Din ka Jhonpra** (Ajmer); died playing **chaugan** (polo).',
      '**Iltutmish (1210–36)**: real consolidator; capital **Delhi**; crushed Yildiz & Qubacha; kept away from the **Mongols** (refused shelter to Jalaluddin Mangbarni, 1221); created **Turkan-i-Chahalgani** (the Forty); organised **iqta**; issued **silver tanka & copper jital**; **investiture from the Abbasid Caliph (1229)**; completed Qutb Minar; built **Sultan Ghari** (first Islamic tomb in India).',
      '**Raziya (1236–40)**: only woman ruler of Delhi; promoted Abyssinian **Jamaluddin Yaqut**; gave up purdah; revolt of **Altunia** (Bhatinda) whom she married; killed 1240.',
      'Weak rulers → nobles’ power: **naib-i-mamlikat** post created under Bahram Shah. **Nasiruddin Mahmud (1246–66)** — Balban as naib; *Tabaqat-i-Nasiri* dedicated to him.',
      '**Balban (1266–87)**: kingship as **Niyabat-i-Khudai** & **Zill-i-Ilahi**; introduced **sijda & paibos**, Persian festival **Nauroz**; “**blood and iron**”; broke the Forty; created **diwan-i-arz** (military dept.); spies (**barids**); crushed **Tughril Khan** (Bengal) and Mewatis. Son Prince Muhammad killed fighting Mongols (1285).',
      'End: Kaiqubad & Kayumars → **Khalji revolution (1290)**.'
    ],
    m: [['“A-I-R-B” = Aibak, Iltutmish, Raziya, Balban', '“All Indians Respect Balban” — main Mamluk rulers in order.'],
      ['Tarain “1-9-1 lost, 1-9-2 won”', 'Ghori lost Tarain I (1191) and won Tarain II (1192).']],
    f: ['The name “Lakh Bakhsh” (giver of lakhs) shows Aibak’s generosity.', 'Iltutmish’s silver tanka weighed about 175 grains and became the base of later Indian silver currency.'],
    d: 'Ilbari / Mamluk rulers\n Qutbuddin Aibak (1206–10)\n Aram Shah (1210)\n Iltutmish (1210–36)\n Ruknuddin Firuz (1236)\n Raziya (1236–40)\n Bahram · Masud\n Nasiruddin Mahmud (1246–66)\n Balban (1266–87)\n Kaiqubad · Kayumars (–1290)',
    k: ['Compare Iltutmish and Balban as state-builders in four points.'],
    r: ['Satish Chandra ch. 5–6', 'V.D. Mahajan ch. 6–7'],
    q: [
      Q.mcq('Who received a letter of investiture from the Abbasid Caliph?', ['Qutbuddin Aibak', 'Iltutmish', 'Balban', 'Alauddin Khalji'], 1, '1229.'),
      Q.mcq('Who introduced sijda and paibos?', ['Iltutmish', 'Raziya', 'Balban', 'Alauddin'], 2, ''),
      Q.mcq('Turkan-i-Chahalgani was organised by:', ['Aibak', 'Iltutmish', 'Balban', 'Raziya'], 1, ''),
      Q.ch('Arrange the battles chronologically:', ['First Battle of Tarain', 'Second Battle of Tarain', 'Battle of Chandawar', 'Capture of Nadia by Bakhtiyar Khalji'], ''),
      Q.ar('Balban broke the power of the Chahalgani.', 'He believed that only a strong, awe-inspiring monarch could control the nobility.', 0, ''),
      Q.mt('Match the monument with its builder:', ['Quwwat-ul-Islam mosque', 'Sultan Ghari', 'Adhai Din ka Jhonpra', 'Alai Darwaza'], ['Qutbuddin Aibak', 'Iltutmish', 'Qutbuddin Aibak (Ajmer)', 'Alauddin Khalji'], '', ['Monument', 'Builder'])
    ] });

  T({ id: 'h4-ds2', u: 'H4', t: 'Khaljis: conquests, market control, revenue, army', h: 2.5,
    p: [
      '**Jalaluddin Khalji (1290–96)**: mild ruler; capital Kilokhri; settled Ulghu’s Mongols (“New Muslims”); executed **Sidi Maula**; killed by nephew **Alauddin** at Kara after the **Devagiri raid (1296)**.',
      '**Alauddin (1296–1316)** — “Sikandar-i-Sani”. North: **Gujarat 1299** (bought **Malik Kafur**), **Ranthambhor 1301** (Hammir Deva), **Chittor 1303** (Ratan Singh; Jayasi’s *Padmavat*, 1540, created the Padmini legend), Malwa 1305, Siwana, Jalor.',
      'South via **Malik Kafur**: **Devagiri 1307–08** (Ramachandra), **Warangal 1309–10** (Prataparudra), **Dvarasamudra 1310–11** (Ballala III), **Madurai 1311** (Pandyas). Policy: tribute, not annexation.',
      'Mongol attacks beaten: **Kili (1299)** Qutlugh Khwaja; **Targhi (1303)** besieged Delhi → **Siri** fort built; Amroha (1305); Ravi (1306).',
      '**Four ordinances** to stop revolts: confiscate grants (milk, inam, waqf); spy network; **ban on liquor**; nobles need permission to meet/marry.',
      '**Market control** (Barani): **Shahna-i-Mandi** (market superintendent), **Diwan-i-Riyasat**, **Sarai-i-Adl** (cloth & costly goods market), fixed prices of grain, cloth, horses, slaves, cattle; spies (**munhiyan**); grain stored; **Banjaras** carried grain.',
      'Revenue: land measured (**masahat**, unit **biswa**); demand **50%** of produce (kharaj) mainly in kind in the Doab; **ghari** (house tax) & **chari** (grazing tax); khuts, muqaddams, chaudharis lose privileges.',
      'Army: **first standing army paid in cash**; **dagh** (branding horses) & **huliya/chehra** (descriptive roll).',
      'Buildings: **Alai Darwaza (1311)** — earliest true dome built on Islamic principles (the earliest true arch is usually credited to **Balban’s tomb**); **Siri**; **Hauz-i-Alai**; unfinished **Alai Minar**.',
      'End: Mubarak Shah (1316–20) killed by **Khusrau Khan** → Ghazi Malik (Tughlaq) seized power 1320.'
    ],
    m: [['South raids “D-W-D-M” = “Delhi Wants Daily Money”', 'Devagiri → Warangal → Dvarasamudra → Madurai (Malik Kafur).'],
      ['Market staff “S-D-S”', 'Shahna-i-Mandi, Diwan-i-Riyasat, Sarai-i-Adl.']],
    f: ['Barani claims prices stayed the same throughout Alauddin’s reign, even in years of drought.', 'Alai Darwaza’s dome and pointed horseshoe arches show Seljuk-style craftsmanship brought by artisans fleeing the Mongols.'],
    d: 'Alauddin’s market control\n Why: pay a big army cheaply\n How\n  Fixed prices (grain, cloth, horses)\n  Shahna-i-Mandi + spies\n  Grain revenue in kind from Doab\n  Banjaras supply chain\n Effect\n  Stable prices; burden on peasants & traders',
    k: ['Explain why Alauddin needed price control (hint: Mongols + cash salaries).'],
    r: ['Satish Chandra ch. 7', 'V.D. Mahajan ch. 8–9'],
    q: [
      Q.mcq('Shahna-i-Mandi was the officer in charge of:', ['Revenue', 'Markets', 'Army', 'Spies'], 1, ''),
      Q.mcq('Which Sultan introduced dagh and huliya?', ['Balban', 'Alauddin Khalji', 'Muhammad bin Tughlaq', 'Firoz Tughlaq'], 1, ''),
      Q.ch('Arrange Malik Kafur’s campaigns chronologically:', ['Devagiri', 'Warangal', 'Dvarasamudra', 'Madurai'], ''),
      Q.mcq('Ghari and chari were taxes on:', ['Houses and grazing', 'Trade and salt', 'Pilgrims and markets', 'Liquor and horses'], 0, ''),
      Q.ar('Alauddin Khalji fixed the prices of essential goods.', 'He wanted to maintain a large standing army on low cash salaries.', 0, ''),
      Q.s2('Alai Darwaza is regarded as the first building in India with a true dome.', 'Siri fort was built after the Mongol siege of Delhi in 1303.', true, true, 'Balban’s tomb is credited with the earliest true arch.')
    ] });

  T({ id: 'h4-ds3', u: 'H4', t: 'Tughlaqs, Sayyids, Lodis, provincial kingdoms & decline', h: 3,
    p: [
      '**Ghiyasuddin Tughlaq (1320–25)**: built **Tughlaqabad**; Warangal annexed 1323; moderate revenue (increase limited to 1/10–1/11); canals; clash with **Nizamuddin Auliya** (“*Hunuz Dilli dur ast*”); died when a pavilion collapsed at Afghanpur.',
      '**Muhammad bin Tughlaq (1325–51)** experiments: ① **Doab tax increase** (during famine) ② **capital to Daulatabad (1327)** ③ **token currency (1329–30)** in copper/brass ④ **Khurasan** expedition (army raised, disbanded) ⑤ **Qarachil** (Kumaon) disaster. Created **Diwan-i-Kohi** (agriculture dept.) & gave **sondhar/taqavi** loans.',
      'Ibn Battuta served as **qazi of Delhi** and was sent as envoy to **China (1342)**. Revolts: **Madurai** (1335), **Vijayanagara (1336)**, **Bengal**, **Bahmani (1347)**. Died at **Thatta (1351)** — Badauni: “the king was freed of his people and they of him.”',
      '**Firoz Shah Tughlaq (1351–88)**: **Diwan-i-Khairat** (charity), **Dar-ul-Shifa** (hospital), **Diwan-i-Bandagan** (slaves; ~1,80,000), employment bureau; canals (**Western Yamuna**), towns (**Firozabad, Hisar, Jaunpur, Fatehabad**); brought **Ashokan pillars** (Topra, Meerut) to Delhi; taxes per sharia + **haq-i-sharb** (irrigation, 1/10); **jizya on brahmanas**; made **iqtas & army posts hereditary**; *Futuhat-i-Firoz Shahi*; Sanskrit books translated after **Nagarkot**.',
      '**Timur’s invasion (1398)** sacked Delhi in Nasiruddin Mahmud Tughlaq’s reign.',
      '**Sayyids (1414–51)**: **Khizr Khan** (Timur’s deputy, took title *Rayat-i-Ala*, not Sultan) → Mubarak Shah → Muhammad Shah → Alam Shah (gave Delhi to Bahlul Lodi).',
      '**Lodis (1451–1526)**: **Bahlul** (first Afghan dynasty; conquered Jaunpur; nobles as equals) → **Sikandar (1489–1517)**: founded **Agra (1504)**, **gaz-i-Sikandari** (land measure), pen-name **Gulrukhi**, abolished corn duty → **Ibrahim (1517–26)**: alienated nobles (**Daulat Khan Lodi** invited Babur); lost **Khatauli (1517–18)** to Rana Sanga; killed at **Panipat 1526**.',
      'Provincial kingdoms: **Jaunpur** (Sharqis; Atala Masjid), **Bengal** (Ilyas Shah; Adina mosque; Husain Shah), **Gujarat** (Ahmad Shah – Ahmedabad 1411; **Mahmud Begarha**), **Malwa** (Mandu; Hoshang Shah), **Kashmir** (**Zain-ul-Abidin “Budshah”**), **Mewar** (**Rana Kumbha** – Vijay Stambh, Kumbhalgarh; Rana Sanga).',
      'Decline of the Sultanate: Muhammad bin Tughlaq’s failed projects, Firoz’s hereditary iqtas & slave corps, **Timur 1398**, provincial breakaways, noble factions & no succession law.'
    ],
    m: [['MBT’s 5 experiments = “D-C-T-K-Q”', 'Doab tax, Capital shift, Token currency, Khurasan, Qarachil — “Daddy Can’t Take Kids Quietly”.'],
      ['Firoz’s 4 Diwans = “K-S-B-I”', 'Khairat (charity), Shifa (hospital), Bandagan (slaves), Istihqaq (pensions).']],
    f: ['Firoz moved Ashoka’s 40-tonne Topra pillar to Delhi on a 42-wheeled cart pulled by 8,400 men, wrapped in silk cotton.', 'Ibn Battuta survived being robbed and shipwrecked on his way to China as MBT’s envoy.'],
    d: 'Delhi Sultanate dynasties\n Mamluk/Ilbari (1206–1290)\n Khalji (1290–1320)\n Tughlaq (1320–1414)\n Sayyid (1414–1451)\n Lodi (1451–1526)',
    k: ['Defend Muhammad bin Tughlaq: give one sensible reason behind each experiment.'],
    r: ['Satish Chandra ch. 7, 10', 'V.D. Mahajan ch. 10–13'],
    q: [
      Q.mcq('Diwan-i-Kohi was established by:', ['Alauddin Khalji', 'Ghiyasuddin Tughlaq', 'Muhammad bin Tughlaq', 'Firoz Tughlaq'], 2, ''),
      Q.mt('Match the department with its function:', ['Diwan-i-Khairat', 'Diwan-i-Bandagan', 'Diwan-i-Arz', 'Diwan-i-Kohi'], ['Charity', 'Slaves', 'Military', 'Agriculture'], '', ['Department', 'Function']),
      Q.mcq('Who founded the city of Agra?', ['Bahlul Lodi', 'Sikandar Lodi', 'Ibrahim Lodi', 'Babur'], 1, ''),
      Q.ch('Arrange in chronological order:', ['Token currency of Muhammad bin Tughlaq', 'Timur’s invasion', 'Foundation of Agra', 'First Battle of Panipat'], ''),
      Q.mcq('Which Sayyid ruler did NOT take the title of Sultan?', ['Khizr Khan', 'Mubarak Shah', 'Muhammad Shah', 'Alam Shah'], 0, ''),
      Q.ar('Firoz Shah Tughlaq weakened the Sultanate in the long run.', 'He made iqtas and military posts hereditary.', 0, ''),
      Q.mt('Match the provincial kingdom with a ruler:', ['Kashmir', 'Gujarat', 'Jaunpur', 'Mewar'], ['Zain-ul-Abidin', 'Mahmud Begarha', 'Ibrahim Shah Sharqi', 'Rana Kumbha'], '', ['Kingdom', 'Ruler'])
    ] });

  T({ id: 'h4-mug1', u: 'H4', t: 'Babur, Humayun and the Sur interlude', h: 2.5,
    p: [
      '**Babur**: Timurid (father) + Chingizid (mother); from **Farghana**; took **Kabul 1504**; invited by **Daulat Khan Lodi**.',
      '**First Panipat (21 April 1526)** vs Ibrahim Lodi — **tulughma** (flanking) + **araba** carts in Ottoman (“Rumi”) style + artillery (**Ustad Ali, Mustafa**).',
      '**Khanwa (1527)** vs **Rana Sanga** — declared jihad, gave up wine, abolished **tamgha** for Muslims, took title **Ghazi**. **Chanderi (1528)** vs Medini Rai. **Ghaghra (1529)** vs Afghans (Mahmud Lodi) & Nusrat Shah of Bengal.',
      'Babur died at Agra (1530), buried at Kabul. ***Baburnama*** in Chaghatai Turki (Persian translation by **Abdur Rahim Khan-i-Khanan**). Built charbagh gardens (Ram Bagh, Agra).',
      '**Humayun (1530–40; 1555–56)**: divided empire with brothers (**Kamran** got Kabul–Kandahar–Punjab); built **Dinpanah**; Gujarat campaign vs Bahadur Shah (1535); lost **Chausa (1539)** & **Kanauj/Bilgram (1540)** to Sher Khan; exile in **Persia** (Shah Tahmasp); won **Machhiwara & Sirhind (1555)**; died falling from the **Sher Mandal** library stairs (1556).',
      '**Humayun’s tomb** (built by **Bega Begum**, architect **Mirak Mirza Ghiyas**) = first great **charbagh garden-tomb**, model for the Taj.',
      '**Sher Shah Sur (1540–45)**: Farid of **Sasaram**; Malwa, **Raisen (1543)**, Marwar — **Battle of Samel/Giri-Sumel (1544)** vs **Maldeo** (“for a handful of bajra…”); died at **Kalinjar (1545)** in a gunpowder blast; tomb at **Sasaram**.',
      'Sher Shah’s reforms: **rupiya** (silver, ~178 grains) & **dam** (copper); **Sarak-i-Azam/GT Road** (Sonargaon–Peshawar) with **sarais** & dak chowkis; land **measured** (gaz-i-Sikandari, **jarib**), crop-rate schedule **rai**, demand **1/3** of average produce, **patta & qabuliyat**; local responsibility for crime (**muqaddams**).',
      'Sur administration: sarkar (**shiqdar-i-shiqdaran**, **munsif-i-munsifan**), pargana (**shiqdar, amin, fotedar, karkuns**). Built **Purana Qila** (Qila-i-Kuhna mosque) & **Rohtas fort**.',
      'After Sher Shah: **Islam Shah**; **Hemu** (minister of Adil Shah Sur) took Delhi as “Vikramaditya” (1556) before Second Panipat.'
    ],
    m: [['Babur’s 4 battles = “Panipat Khanwa Chanderi Ghaghra” = “People Keep Calling Ghaghra”', '1526, 1527, 1528, 1529 — one per year!'],
      ['Humayun’s 2 losses = “Chausa-Kanauj”, 2 wins = “Machhiwara-Sirhind”', '1539–40 lost; 1555 regained.']],
    f: ['Lane-Poole wrote that Humayun “tumbled through life and tumbled out of it”.', 'Sher Shah’s rupiya is the ancestor of today’s rupee.'],
    d: 'Sher Shah’s land revenue\n Measure land (jarib)\n Classify (good / middling / bad)\n Average produce\n Rai (crop-rate schedule)\n State share 1/3\n Patta (title) ↔ Qabuliyat (agreement)',
    k: ['Teach Sher Shah’s revenue system step by step like a recipe.'],
    r: ['Satish Chandra ch. 12', 'V.D. Mahajan Mughal part ch. 2–4'],
    q: [
      Q.mt('Match the battle with the year:', ['First Panipat', 'Khanwa', 'Chanderi', 'Ghaghra'], ['1526', '1527', '1528', '1529'], '', ['Battle', 'Year']),
      Q.mcq('Humayun was defeated at Chausa in:', ['1537', '1539', '1540', '1545'], 1, ''),
      Q.mcq('The Battle of Samel (Giri-Sumel) was fought between Sher Shah and:', ['Maldeo', 'Puran Mal', 'Rana Sanga', 'Humayun'], 0, ''),
      Q.mcq('Patta and qabuliyat were introduced by:', ['Babur', 'Sher Shah', 'Akbar', 'Alauddin'], 1, ''),
      Q.ar('Babur won at Panipat despite a smaller army.', 'He used tulughma tactics, carts and field artillery.', 0, ''),
      Q.ch('Arrange chronologically:', ['Battle of Khanwa', 'Battle of Chausa', 'Battle of Samel', 'Second Battle of Panipat'], '1527 → 1539 → 1544 → 1556.')
    ] });

  T({ id: 'h4-mug2', u: 'H4', t: 'Akbar to Aurangzeb: expansion & consolidation', h: 4,
    p: [
      '**Akbar (1556–1605)**: born **Amarkot** (1542); crowned at **Kalanaur**; **Second Panipat (5 Nov 1556)** vs **Hemu** (regent **Bairam Khan**, till 1560); “petticoat government” (Maham Anaga) 1560–64.',
      'Rajput policy: marriage with **Bharmal’s daughter (Amber, 1562)**; abolished **pilgrim tax (1563)** & **jizya (1564)**; **Chittor (1568)**, Ranthambhor (1569); **Haldighati (1576)** vs **Maharana Pratap** (Mughal side led by **Man Singh**).',
      'Expansion: **Gujarat 1572–73** (→ **Buland Darwaza**), Bengal 1576, Kabul 1581, **Kashmir 1586**, Sindh 1591, Odisha 1592, Kandahar 1595; Deccan — Berar 1596, **Ahmadnagar 1600** (**Chand Bibi**), **Asirgarh 1601** (last conquest).',
      'Religion: **Ibadat Khana (1575)** at Fatehpur Sikri (opened to all 1578) → **Mahzar (1579)** → **Din-i-Ilahi/Tauhid-i-Ilahi (1582)** (Birbal only Hindu member) → **Sulh-i-kul**; Jesuits (**Acquaviva, Monserrate**), Jain **Hiravijaya Suri**, Parsi **Dastur Meherji Rana**; **Ilahi era**; translation bureau (**Maktab Khana**) – *Razmnama* (Mahabharata).',
      '**Jahangir (1605–27)**: **chain of justice**; executed **Guru Arjan (1606)** for helping rebel Khusrau; married **Nur Jahan (1611)** — “junta” of **Itimad-ud-Daula, Asaf Khan, Khurram**; Mewar peace (1615); Kangra (1620); Kandahar lost (1622); **Hawkins & Roe** came; **Mahabat Khan’s coup (1626)**; painting peak (**Mansur, Abul Hasan, Bishandas**).',
      '**Shah Jahan (1628–58)**: revolts of **Khan Jahan Lodi** & **Bundelas**; **Ahmadnagar annexed (1633)**; Deed of Submission (1636) from Bijapur & Golconda; **Balkh–Badakhshan** failure (1646–47); **Kandahar lost (1649)**; **Peacock Throne**, **Taj Mahal** (Ustad Ahmad Lahori), **Shahjahanabad/Red Fort** (1639–48), Jama Masjid.',
      'War of succession (1657–59): **Dharmat** (Aurangzeb & Murad beat Jaswant Singh) → **Samugarh** (Dara beaten) → **Khajwa** (Shuja) → **Deorai** (Dara). Shah Jahan confined in **Agra fort** till 1666.',
      '**Aurangzeb (1658–1707)**: “Alamgir”, “Zinda Pir”; stopped music at court, **jharokha darshan**, tuladan, Nauroz; **jizya reimposed 1679**; temples destroyed (Vishwanath 1669, Keshav Rai 1670).',
      'Revolts: **Jats** (Gokula 1669, Rajaram, Churaman), **Satnamis (1672)**, **Sikhs** (**Guru Tegh Bahadur** executed 1675), **Rajputs** (Marwar after Jaswant Singh, **Durgadas**, Ajit Singh; Prince Akbar’s revolt 1681), **Afghans** (Yusufzai, Afridi).',
      'Deccan: **Bijapur 1686**, **Golconda 1687** annexed; **Sambhaji executed 1689**; long war with Marathas; died **Ahmednagar 1707**, buried **Khuldabad**. *Fatawa-i-Alamgiri* compiled; **Bibi ka Maqbara** (Aurangabad, by Azam Shah).'
    ],
    m: [['Akbar’s religion path “I-M-D-S”', 'Ibadat Khana 1575 → Mahzar 1579 → Din-i-Ilahi 1582 → Sulh-i-kul: “I Make Dal Sweet”.'],
      ['Succession war “D-S-K-D”', 'Dharmat, Samugarh, Khajwa, Deorai — “Don’t Steal Kids’ Doughnuts”.']],

  T({ id: 'h4-mug3', u: 'H4', t: 'Later Mughals & decline of the Mughal Empire (debates)', h: 2,
    p: [
      '**Bahadur Shah I (1707–12)** — won **Jajau** vs Azam; released **Shahu**; “Shah-i-Bekhabar”; Banda Bahadur’s revolt.',
      '**Jahandar Shah (1712–13)** — **Zulfiqar Khan** as wazir; **ijara** (revenue farming) spreads.',
      '**Farrukhsiyar (1713–19)** — **Sayyid brothers** (Abdullah Khan & Husain Ali Khan, “king-makers”); **1717 farman** to the East India Company; Banda executed 1716.',
      '**Muhammad Shah “Rangila” (1719–48)**: rise of successor states — **Murshid Quli Khan** (Bengal), **Saadat Khan** (Awadh, 1722), **Nizam-ul-Mulk** (Hyderabad; **Shakar Kheda 1724**); **Baji Rao’s raid on Delhi (1737)**; **Nadir Shah (1739)** — **Karnal**, massacre, took **Peacock Throne & Koh-i-Noor**.',
      '**Ahmad Shah Abdali** raids (1748–67); **Third Panipat 1761**. **Shah Alam II** (1759–1806): **Buxar 1764**, **Allahabad treaty 1765** (Diwani); returned to Delhi under **Mahadji Sindhia (1772)**; blinded by Ghulam Qadir (1788); British control from **1803**.',
      '**Akbar II** sent **Ram Mohan Roy** to England (gave title “Raja”). **Bahadur Shah II “Zafar”** — led 1857, exiled to **Rangoon** (d. 1862).',
      'Decline debates — **J.N. Sarkar** (Aurangzeb’s policies & personal failings) · **Satish Chandra** (crisis of the **jagirdari system**; *Parties and Politics at the Mughal Court*) · **Irfan Habib** (**agrarian crisis**, over-exploitation, peasant revolts) · **M. Athar Ali** (shortage of jagirs, “cultural failure”).',
      'Revisionists: **Muzaffar Alam** (*Crisis of Empire in Mughal North India* — regional prosperity in Awadh/Punjab) · **C.A. Bayly** (*Rulers, Townsmen and Bazaars* — rise of intermediaries) · **Karen Leonard** (“**great firm**” theory — bankers withdrew support) · **André Wink** (**fitna** – sedition/alliance politics) · **J.F. Richards** (Deccan drain).'
    ],
    m: [['Later Mughals “Big Jumbo Fries Make All Americans Smile After Burgers”', 'Bahadur Shah I, Jahandar, Farrukhsiyar, Muhammad Shah, Ahmad Shah, Alamgir II, Shah Alam II, Akbar II, Bahadur Shah II.'],
      ['Decline schools: “Aligarh = crisis; Revisionist = regions”', 'Habib/Chandra/Athar Ali → crisis of the system; Alam/Bayly/Wink → regional reorganisation, not just decay.']],
    f: ['The 1717 farman of Farrukhsiyar is often called the “Magna Carta” of the East India Company.', 'Nadir Shah took so much loot from Delhi that he exempted Iran from taxes for three years.'],
    d: 'Decline of Mughals — explanations\n Personal / religious\n  J.N. Sarkar\n Structural (Aligarh school)\n  Jagirdari crisis — Satish Chandra\n  Agrarian crisis — Irfan Habib\n  Jagir shortage — Athar Ali\n Regional / revisionist\n  Muzaffar Alam, C.A. Bayly\n  Great firm — Karen Leonard\n  Fitna — André Wink',
    k: ['Pick one “Aligarh” and one “revisionist” historian and explain the difference in one minute.'],
    r: ['Satish Chandra ch. 19–20', 'IGNOU MHI-104 (18th century block)'],
    q: [
      Q.mt('Match the historian with the explanation of Mughal decline:', ['Irfan Habib', 'Satish Chandra', 'Karen Leonard', 'Muzaffar Alam'], ['Agrarian crisis', 'Crisis of the jagirdari system', 'Great firm theory', 'Regional prosperity and new elites'], '', ['Historian', 'Explanation']),
      Q.mcq('Who were known as the “king-makers” in the early 18th century?', ['Nizam-ul-Mulk and Saadat Khan', 'Sayyid brothers', 'Zulfiqar Khan and Asad Khan', 'Mahadji Sindhia and Nana Phadnavis'], 1, ''),
      Q.ch('Arrange chronologically:', ['Farman of Farrukhsiyar to the EIC', 'Nadir Shah’s invasion', 'Third Battle of Panipat', 'Battle of Buxar'], '1717 → 1739 → 1761 → 1764.'),

  T({ id: 'h4-vij', u: 'H4', t: 'Vijayanagara, Bahmanis, Deccan Sultanates, Eastern Gangas & Gajapatis', h: 3,
    p: [
      '**Vijayanagara** founded **1336** by **Harihara & Bukka** (Sangama) with sage **Vidyaranya**; capital **Hampi** on the Tungabhadra. Four dynasties: **Sangama → Saluva → Tuluva → Aravidu**.',
      'Sangama: **Devaraya I** (dam on Tungabhadra; **Nicolo Conti**), **Devaraya II** (Muslims in army; **Abdur Razzaq 1443**).',
      '**Krishnadevaraya (1509–29)**, Tuluva: *Amuktamalyada* (Telugu); **Ashtadiggajas** (e.g. **Allasani Peddana**, Tenali Ramakrishna); took **Raichur (1520)** from Bijapur; defeated **Prataparudra Gajapati**; ally of Portuguese; **Domingo Paes** visited; Vithala & Hazara Rama temples.',
      '**Battle of Talikota / Rakshasi-Tangadi (23 Jan 1565)**: **Bijapur, Ahmadnagar, Golconda, Bidar** defeated **Rama Raya** → Hampi sacked; Aravidus ruled from Penukonda/Chandragiri.',
      '**Bahmani kingdom (1347)**: **Alauddin Hasan Bahman Shah** at **Gulbarga** → capital **Bidar** (Ahmad Shah Wali, 1425); **Firoz Shah Bahmani** (observatory at Daulatabad); **Mahmud Gawan** (wazir 1463–81; madrasa at Bidar; 4 tarafs → 8; executed 1481).',
      'Five **Deccan Sultanates**: **Bijapur (Adil Shahi)**, **Ahmadnagar (Nizam Shahi)**, **Berar (Imad Shahi)**, **Golconda (Qutb Shahi)**, **Bidar (Barid Shahi)**. Berar → Ahmadnagar (1574); Bidar → Bijapur (1619); Ahmadnagar → Mughals (1633); Bijapur (1686) & Golconda (1687) → Aurangzeb.',
      '**Bijapur**: **Ibrahim Adil Shah II** (*Kitab-i-Nauras*, “Jagadguru”), **Gol Gumbaz** (Muhammad Adil Shah). **Golconda**: **Muhammad Quli Qutb Shah** founded **Hyderabad (1591)**, **Charminar**; diamonds. **Ahmadnagar**: **Chand Bibi**; **Malik Ambar** (revenue settlement, guerrilla war, founded Khadki/Aurangabad).',
      '**Eastern Gangas** (Odisha): **Anantavarman Chodaganga** (Jagannath temple, Puri), **Narasimhadeva I** (**Konark Sun temple**, 13th c.).',
      '**Suryavamshi Gajapatis (1434–1541)**: **Kapilendra Deva** (founder), **Purushottama**, **Prataparudra** (devotee of **Chaitanya**; lost to Krishnadevaraya).'
    ],
    m: [['Vijayanagara “Sangama Saluva Tuluva Aravidu” = “Some Silly Tigers Attack”', 'S-S-T-A in order.'],
      ['Deccan sultanates “BAG-BB”', 'Bijapur, Ahmadnagar, Golconda, Berar, Bidar. Talikota alliance = all except Berar.']],

    d: 'Bahmani break-up\n Bahmani (Gulbarga → Bidar)\n  Bijapur — Adil Shahi\n  Ahmadnagar — Nizam Shahi\n  Berar — Imad Shahi\n  Golconda — Qutb Shahi\n  Bidar — Barid Shahi',
    k: ['Narrate the Battle of Talikota in 5 sentences: who, why, where, result, aftermath.'],
    r: ['Satish Chandra ch. 9, 14', 'V.D. Mahajan ch. 14–15'],
    q: [
      Q.mt('Match the Deccan Sultanate with its dynasty:', ['Bijapur', 'Ahmadnagar', 'Golconda', 'Berar'], ['Adil Shahi', 'Nizam Shahi', 'Qutb Shahi', 'Imad Shahi'], '', ['Sultanate', 'Dynasty']),
      Q.mcq('Amuktamalyada was written by:', ['Devaraya II', 'Krishnadevaraya', 'Allasani Peddana', 'Achyutaraya'], 1, ''),
      Q.mcq('Which Deccan Sultanate did NOT join the alliance at Talikota?', ['Bijapur', 'Golconda', 'Berar', 'Ahmadnagar'], 2, ''),

      Q.ch('Arrange the Vijayanagara dynasties in order:', ['Sangama', 'Saluva', 'Tuluva', 'Aravidu'], ''),

    ] });

  T({ id: 'h4-mar', u: 'H4', t: 'Marathas: Shivaji, Peshwas, Confederacy, decline', h: 3,
    p: [
      'Roots: Western Ghats & forts, Bhakti saints (**Jnaneshwar, Namdev, Eknath, Tukaram, Ramdas**), Maratha service in Deccan sultanates (**Shahji Bhonsle**).',
      '**Shivaji** (b. **Shivneri, 1630**; mother **Jijabai**; guardian **Dadaji Kondadev**): Torna (1646) · Javli (1656) · killed **Afzal Khan** at **Pratapgarh (1659)** · night attack on **Shaista Khan** (Pune, 1663) · sacked **Surat (1664, 1670)**.',
      '**Treaty of Purandar (1665)** with **Jai Singh** — 23 forts surrendered; Agra visit & escape (1666). **Coronation at Raigad (1674)** by **Gaga Bhatt** — “Chhatrapati”. Karnataka campaign (Jinji, Vellore) 1677–78; died 1680.',
      '**Ashtapradhan**: **Peshwa** (PM), **Amatya/Mazumdar** (finance), **Sachiv/Shurunavis** (correspondence), **Mantri/Waqia-navis** (intelligence, household), **Senapati/Sar-i-Naubat** (army), **Sumant/Dabir** (foreign affairs), **Nyayadhish** (justice), **Panditrao** (religion). Only Nyayadhish & Panditrao had no military duty.',
      'Revenue: survey by **Annaji Datto**; demand rose to 40%; **chauth** (1/4 of revenue from neighbouring areas) & **sardeshmukhi** (extra 10%). Army: **paga/bargirs** (state horses) & **shiledars** (own horses); Mavali infantry; navy (later **Kanhoji Angre**).',
      'Successors: **Sambhaji** (executed 1689) → **Rajaram** (Jinji) → **Tarabai** (regent) → **Shahu** (released 1707; **Battle of Khed**; Satara vs Kolhapur; **Treaty of Warna 1731**).',
      'Peshwas: **Balaji Vishwanath** (1713–20; **1719 Mughal grants** of chauth & sardeshmukhi) → **Baji Rao I** (1720–40; **Palkhed 1728** vs Nizam; Delhi raid 1737; **Bhopal 1738**; Bassein from Portuguese 1739) → **Balaji Baji Rao / Nana Saheb** (1740–61; **Sangola 1750**; **Third Panipat 14 Jan 1761** — Sadashivrao Bhau vs **Ahmad Shah Abdali**).',
      'Later: **Madhav Rao I** (revival) → Narayan Rao (murdered 1773) → **Raghunath Rao** vs **Barbhai council (Nana Phadnavis)** → Sawai Madhav Rao → **Baji Rao II** (**Treaty of Bassein 1802**).',
      '**Confederacy**: Peshwa (Pune), **Bhonsle (Nagpur), Gaekwad (Baroda), Holkar (Indore), Sindhia (Gwalior)**.',
      'Anglo-Maratha wars: **I (1775–82)** — Wadgaon humiliation, **Salbai 1782** · **II (1803–05)** — **Assaye, Laswari**; treaties Deogaon, Surji-Arjangaon · **III (1817–18)** — **Koregaon**, Kirkee, Ashti; Peshwaship abolished. Decline: disunity, Panipat losses, no modern army discipline, British diplomacy & subsidiary alliance.'
    ],
    m: [['Ashtapradhan “P-A-S-M-S-S-N-P” = “Please Are Shivaji’s Men Sure Strong? No Problem!”', 'Peshwa, Amatya, Sachiv, Mantri, Senapati, Sumant, Nyayadhish, Panditrao.'],
      ['Peshwas “B-B-B-M” = “Balaji, Baji, Balaji, Madhav”', 'Balaji Vishwanath → Baji Rao I → Balaji Baji Rao (Nana Saheb) → Madhav Rao I.']],
    f: ['Shivaji escaped from Agra hidden in baskets of sweets (traditional account).', 'At Third Panipat, the Marathas’ artillery was commanded by Ibrahim Khan Gardi, trained by the French.'],
    d: 'Maratha Confederacy\n Chhatrapati (Satara) — nominal\n Peshwa (Pune) — head\n  Bhonsle — Nagpur\n  Gaekwad — Baroda\n  Holkar — Indore\n  Sindhia — Gwalior',
    k: ['Explain chauth and sardeshmukhi like a “protection fee + bonus” to a friend.'],
    r: ['Satish Chandra ch. 18–19', 'Spectrum: Anglo-Maratha wars'],
    q: [
      Q.mcq('The Treaty of Purandar (1665) was signed between Shivaji and:', ['Shaista Khan', 'Jai Singh', 'Afzal Khan', 'Aurangzeb directly'], 1, ''),
      Q.mt('Match the Ashtapradhan post with the function:', ['Amatya', 'Sumant', 'Sachiv', 'Panditrao'], ['Finance', 'Foreign affairs', 'Royal correspondence', 'Religious matters'], '', ['Post', 'Function']),
      Q.mcq('Third Battle of Panipat was fought in:', ['1748', '1757', '1761', '1764'], 2, ''),
      Q.mt('Match the Maratha house with its seat:', ['Bhonsle', 'Gaekwad', 'Holkar', 'Sindhia'], ['Nagpur', 'Baroda', 'Indore', 'Gwalior'], '', ['House', 'Seat']),
      Q.ch('Arrange chronologically:', ['Treaty of Purandar', 'Coronation of Shivaji', 'Treaty of Salbai', 'Treaty of Bassein'], '1665 → 1674 → 1782 → 1802.'),

/* src/data/h5.js */
/* UNIT V — Medieval administration & economy */
(function (J) {
  var T = J.T, Q = J.Q;

  T({ id: 'h5-sadm', u: 'H5', t: 'Sultanate administration, nature of state, iqta, succession', h: 2.5,
    p: [
      '**Nature of state** debate: **theocratic** (sharia, ulema, Caliph’s investiture, jizya) vs **secular-military in practice** (sultan’s own laws = **zawabit**; Barani’s *Fatawa-i-Jahandari*). Alauddin told Qazi Mughis he did what was good for the state.',
      'Central departments: **Diwan-i-Wizarat** (finance; **wazir**; mushrif-i-mamalik = accountant-general, mustaufi-i-mamalik = auditor-general) · **Diwan-i-Arz** (military; **ariz-i-mamalik**; created by Balban) · **Diwan-i-Insha** (royal correspondence; dabir-i-khas) · **Diwan-i-Risalat** (religious matters & appeals; **sadr-us-sudur**) · **Diwan-i-Qaza** (justice; qazi-ul-quzat).',
      'Household & court: **wakil-i-dar**, **amir-i-hajib** (ceremonial), **barid-i-mamalik** (intelligence & post), amir-i-akhur (stables).',
      'Special departments: **Diwan-i-Mustakhraj** (arrears – Alauddin), **Diwan-i-Riyasat** (markets – Alauddin), **Diwan-i-Kohi** (agriculture – MBT), **Diwan-i-Khairat, Bandagan, Istihqaq** (Firoz).',
      '**Iqta** = revenue assignment in lieu of salary; holder = **muqti/wali**; collects revenue, maintains troops, transferable. **Iltutmish** institutionalised it; **Balban** added **khwajas** (auditors); **Alauddin** tightened audit & transfers; **MBT** separated revenue collection from army pay; **Firoz** made iqtas **hereditary** (weakened state).',
      'Local: **shiq** (shiqdar) → **pargana** (amil, mushrif) → village (**khut, muqaddam, chaudhari, patwari**). **Khalisa** = crown land under direct collection.',
      'Taxes: **kharaj** (land tax; 1/5 → 1/2 under Alauddin), **jizya** (non-Muslims), **zakat** (2.5% on Muslim wealth), **khams** (1/5 of war booty; Alauddin kept 4/5). Firoz added **haq-i-sharb** (irrigation, ~1/10).',
      '**Succession**: no fixed law — nomination by sultan, election by nobles (Firoz), heredity, or force (Alauddin). Turkish idea that all sons had equal claims.'
    ],
    m: [['Big 4 Diwans = “W-A-I-R”', 'Wizarat (finance), Arz (army), Insha (letters), Risalat (religion) — “WAIR the crown”.'],
      ['Iqta timeline “I-B-A-M-F”', 'Iltutmish creates → Balban audits → Alauddin controls → MBT separates → Firoz makes hereditary.']],
    f: ['Barani’s Fatawa-i-Jahandari openly says a ruler may frame state laws (zawabit) when sharia is silent.'],
    d: 'Sultanate central government\n Sultan\n  Wazir — Diwan-i-Wizarat (finance)\n  Ariz-i-mamalik — Diwan-i-Arz (army)\n  Dabir-i-khas — Diwan-i-Insha (letters)\n  Sadr-us-sudur — Diwan-i-Risalat (religion)\n  Qazi-ul-quzat — justice\n  Barid-i-mamalik — intelligence',
    k: ['Is the Delhi Sultanate a theocracy? Give 2 points for and 2 against.'],
    r: ['Satish Chandra ch. 8', 'V.D. Mahajan ch. 16, 22', 'IGNOU MHI-104 (Sultanate polity)'],
    q: [
      Q.mt('Match the department with its head:', ['Diwan-i-Arz', 'Diwan-i-Insha', 'Diwan-i-Risalat', 'Diwan-i-Wizarat'], ['Ariz-i-mamalik', 'Dabir-i-khas', 'Sadr-us-sudur', 'Wazir'], '', ['Department', 'Head']),
      Q.mcq('Who made iqtas hereditary?', ['Iltutmish', 'Balban', 'Muhammad bin Tughlaq', 'Firoz Shah Tughlaq'], 3, ''),
      Q.mcq('Zakat was a tax on:', ['Non-Muslims', 'Muslims’ wealth', 'War booty', 'Irrigation'], 1, ''),
      Q.mcq('Mustaufi-i-mamalik was the:', ['Accountant-general', 'Auditor-general', 'Chief of intelligence', 'Chief judge'], 1, ''),
      Q.ar('The Delhi Sultanate cannot be called a pure theocracy.', 'Sultans framed state laws (zawabit) according to political needs.', 0, '')
    ] });

  T({ id: 'h5-madm', u: 'H5', t: 'Sher Shah’s reforms & Mughal administration: mansabdari, jagirdari, land revenue', h: 4,
    p: [
      'Mughal kingship: **farr-i-izadi** (divine light — Abul Fazl), **sulh-i-kul**, jharokha darshan.',
      'Centre: **Wakil** (regent/PM, faded after Bairam Khan) · **Wazir / Diwan-i-Kul** (finance) · **Mir Bakhshi** (military pay, mansabdars, intelligence) · **Mir Saman** (household & karkhanas) · **Sadr-us-Sudur** (grants, religious affairs) · **Qazi-ul-Quzat** · **Muhtasib** (public morals) · **Mir Atish** (artillery) · Daroga-i-Dak Chowki.',
      'Provinces (**subas**: 12 in 1580 → 15 by 1605): **subedar/nazim**, **diwan** (finance, independent check), **bakhshi**, sadr, qazi, **waqia-navis**, **kotwal** (city).',
      'Sarkar: **faujdar** (order), **amalguzar** (revenue), bitikchi, khazanadar. Pargana: **shiqdar, amil, qanungo** (land records, hereditary), fotedar, karkun. Village: **muqaddam, patwari**.',
      '**Mansabdari** (Akbar, c. 1573–77): decimal ranks; **zat** (personal rank & pay) and **sawar** (cavalry) dual ranks; classes by sawar/zat ratio; **dagh & chehra**; **du-aspa sih-aspa** (Jahangir — extra sawar without raising zat); **month-scale** jagirs (Shah Jahan).',
      '**Jagirdari**: assignment of revenue; **jama/jamadami** (estimated) vs **hasil** (actual); transferred every ~3 years; types — **tankhwah** (salary), **watan** (hereditary homeland of Rajput chiefs), **inam**, **mashrut**. **Khalisa** = crown land. Late 17th c. shortage = **be-jagiri** (jagirdari crisis).',
      'Revenue: Sher Shah’s **rai** → Akbar’s experiments → **Karori experiment (1574–75)** → **Ain-i-Dahsala (1580)** by **Raja Todar Mal**: 10-year (1570–79) average of produce & prices → cash rates (**dastur-ul-amal**) for revenue circles (**dasturs**) = **zabt**. Share ≈ **1/3**.',
      'Other methods: **batai/ghalla-bakhshi** (crop-sharing: khet, lang, rasi), **kankut** (estimation), **nasaq** (past records).',
      'Land classes: **polaj** (every year) · **parauti** (fallow 1–2 yrs) · **chachar** (3–4 yrs) · **banjar** (5+ yrs). **Ilahi gaz** (41 digits) & bamboo **jarib** with iron rings.',
      '**Madad-i-maash / suyurghal**: revenue-free grants to scholars & religious men, under the Sadr. **Taqavi** = loans to peasants.',
      'Zamindars (S. Nurul Hasan): **autonomous chiefs**, **intermediary** zamindars, **primary** zamindars.'
    ],
    m: [['Land classes “P-P-C-B” = “Please Put Chai Bro”', 'Polaj, Parauti, Chachar, Banjar — from best to worst.'],
      ['Mughal ministers “W-B-S-S” = “We Build Strong States”', 'Wazir (finance), Bakhshi (army), Saman (household), Sadr (religion).']],
    f: ['Jagirs were transferred so often that Bernier said jagirdars had no reason to care for peasants’ long-term welfare.', 'Todar Mal had earlier served Sher Shah — continuity across dynasties!'],
    d: 'Mansab ranks\n Zat → personal rank & salary\n Sawar → number of horsemen\n  Class 1: sawar = zat\n  Class 2: sawar ≥ 1/2 zat\n  Class 3: sawar < 1/2 zat\n Paid by\n  Naqd (cash)\n  Jagir (revenue assignment)',
    k: ['Explain zat & sawar to a friend using the example of a 1000/500 mansabdar.'],
    r: ['Satish Chandra ch. 13, 16', 'Irfan Habib, The Agrarian System of Mughal India', 'IGNOU MHI-104 / MHI-105'],
    q: [
      Q.mcq('The Ain-i-Dahsala system was introduced in:', ['1570', '1575', '1580', '1585'], 2, ''),
      Q.mt('Match the land category with its description:', ['Polaj', 'Parauti', 'Chachar', 'Banjar'], ['Cultivated every year', 'Fallow for 1–2 years', 'Fallow for 3–4 years', 'Fallow for 5 years or more'], '', ['Category', 'Description']),
      Q.mcq('The Mughal officer in charge of military pay and mansabdars was the:', ['Mir Saman', 'Mir Bakhshi', 'Sadr-us-Sudur', 'Diwan-i-Kul'], 1, ''),
      Q.mcq('Du-aspa sih-aspa was introduced by:', ['Akbar', 'Jahangir', 'Shah Jahan', 'Aurangzeb'], 1, ''),
      Q.mt('Match the jagir with its meaning:', ['Tankhwah jagir', 'Watan jagir', 'Inam jagir', 'Mashrut jagir'], ['Given in lieu of salary', 'Hereditary home territory of chiefs', 'Free of obligations', 'Conditional'], '', ['Jagir', 'Meaning']),
      Q.ar('The Mughal diwan of a province was independent of the subedar.', 'The empire used checks and balances to prevent provincial rebellion.', 0, ''),
      Q.st('Which of the following are methods of revenue assessment under Akbar?', ['Zabt', 'Batai', 'Kankut', 'Ijara'], [true, true, true, false], 'Ijara (revenue farming) spreads after Aurangzeb.')
    ] });

  T({ id: 'h5-dadm', u: 'H5', t: 'Deccan administration: Vijayanagara, Bahmani, Maratha', h: 2,
    p: [
      '**Vijayanagara**: raya with council; provinces (**rajya/mandala**) → **nadu** → **sthala** → **grama**.',
      '**Nayankara system**: **nayakas** (military chiefs) received **amaram** lands; supplied troops & tribute (Nuniz counted ~200). Later **Palaiyakkarar/Polygars** (Aravidus & Nayakas of Madurai, Thanjavur, Gingee).',
      '**Ayagar system**: **12 hereditary village functionaries** paid with tax-free (**manya**) land. Other land: **bhandaravada** (crown), brahmadeya, devadana, matha-pura.',
      'Interpretations: Nilakanta Sastri (“war state”), **Burton Stein** (segmentary), **Noboru Karashima** (compared the nayaka system with feudalism).',
      '**Bahmani**: **Wakil-us-Sultanat** (PM), **Wazir-i-Kul**, **Amir-i-Jumla** (finance), **Wazir-i-Ashraf** (foreign affairs), Nazir, Peshwa, Kotwal, **Sadr-i-Jahan** (justice & religion). Provinces = **tarafs** under **tarafdars** (4 → 8 by **Mahmud Gawan**, who kept khalisa land & forts under central control).',
      'Bahmani factions: **Afaqis** (newcomers: Persians, Turks, Arabs) vs **Dakhnis** (old settlers + Habshis) — caused Gawan’s fall.',
      '**Maratha (Shivaji)**: **Ashtapradhan**; forts as admin units; **chauth & sardeshmukhi**; land survey by **Annaji Datto**.',
      '**Peshwa era**: **Huzur Daftar** (central secretariat, Pune); **kamavisdar/mamlatdar** (district revenue); **deshmukh, deshpande** (hereditary pargana officers); village **patil** (head) & **kulkarni** (accountant); **balutedars** (artisans paid with baluta); **watan** = hereditary right.',
      'Division of chauth: **babti** (25% to king), **mokasa** (66% to sardars), **sahotra** (6%), **nadgaunda** (3%).'
    ],
    m: [['Vijayanagara “N-A-A” = Nayaka gets Amaram, Ayagars serve village', 'Nayankara (military fief) + Ayagar (village servants).'],
      ['Chauth split “B-M-S-N” = 25-66-6-3', 'Babti, Mokasa, Sahotra, Nadgaunda.']],
    f: ['Domingo Paes said Vijayanagara was “as large as Rome” and full of markets selling rubies and diamonds.'],
    d: 'Maratha village & district\n Peshwa (Huzur Daftar, Pune)\n Mamlatdar / Kamavisdar (district)\n Deshmukh · Deshpande (pargana, hereditary)\n Patil (village head) · Kulkarni (accountant)\n Balutedars (12 artisans)',
    k: ['Compare nayakas of Vijayanagara with Mughal jagirdars in three points.'],
    r: ['Satish Chandra ch. 9, 14, 18', 'Burton Stein, Vijayanagara (New Cambridge)'],
    q: [
      Q.mcq('Ayagars in the Vijayanagara empire were:', ['Military chiefs', 'Village functionaries', 'Temple dancers', 'Foreign merchants'], 1, ''),
      Q.mcq('In the Bahmani kingdom, provinces were called:', ['Subas', 'Tarafs', 'Iqtas', 'Mandalams'], 1, ''),
      Q.mt('Match the Maratha official with the role:', ['Patil', 'Kulkarni', 'Deshmukh', 'Kamavisdar'], ['Village headman', 'Village accountant', 'Hereditary pargana chief', 'Revenue officer of a district'], '', ['Official', 'Role']),
      Q.ar('Mahmud Gawan increased the number of tarafs from four to eight.', 'He wanted to reduce the power of provincial governors.', 0, '')
    ] });

  T({ id: 'h5-front', u: 'H5', t: 'Frontier policy & inter-state relations (Sultanate & Mughal)', h: 1.5,
    p: [
      '**Mongols**: Chingiz Khan reached the Indus (1221) chasing **Jalaluddin Mangbarni**; **Iltutmish** refused him shelter to avoid Mongol wrath.',
      '**Balban**: chain of forts — **Bhatinda, Sunam, Samana, Dipalpur, Multan, Lahore**; his cousin **Sher Khan** as warden; son Prince Muhammad died fighting (1285).',
      '**Alauddin**: repelled 6 big invasions; strong garrisons; **Ghazi Malik** (later Ghiyasuddin) as warden at **Dipalpur**. MBT faced **Tarmashirin**; planned the Khurasan expedition.',
      'Mughal NW frontier: **Kabul–Kandahar** line as the “scientific frontier”. **Kandahar**: taken by Akbar 1595 → lost to **Shah Abbas I (1622)** → regained 1638 (Ali Mardan Khan) → lost **1649**; failed sieges 1649, 1652 (Aurangzeb), 1653 (Dara).',
      'Central Asia: Akbar stayed at **Lahore (1585–98)** to watch **Abdullah Khan Uzbek**; Shah Jahan’s **Balkh–Badakhshan (1646–47)** failure.',
      'Afghan tribes: **Raushanai** movement (Bayazid Ansari); **Birbal killed (1586)** fighting Yusufzais; Aurangzeb’s **Yusufzai (1667)** & **Afridi (1672)** revolts; poet-chief **Khushhal Khan Khattak**.',
      'Inter-state relations: Sultanate–Deccan tribute; **Bahmani–Vijayanagara wars over Raichur doab**; Mughal–Rajput alliances & **watan jagirs**; **Deed of Submission (1636)**; Mughal–**Safavid** rivalry over Kandahar; Ottomans; Portuguese **cartaz** passes for ships.',
      'North-east: **Mir Jumla** invaded Assam (1662); Ahoms under **Lachit Borphukan** won **Saraighat (1671)**.'
    ],
    m: [['Kandahar ping-pong “95-22-38-49”', 'Mughal 1595 → Persian 1622 → Mughal 1638 → Persian 1649 (for good).']],
    f: ['Lachit Borphukan’s victory at Saraighat is celebrated as Lachit Divas (24 Nov) in Assam.'],
    d: 'Kandahar timeline\n 1595 Akbar takes it\n 1622 Shah Abbas I captures\n 1638 Ali Mardan Khan hands it back\n 1649 lost forever\n 1649/1652/1653 sieges fail',
    k: ['Why was Kandahar so important to both Mughals and Safavids? Two reasons.'],
    r: ['Satish Chandra ch. 6, 15'],
    q: [
      Q.mcq('Kandahar was finally lost by the Mughals in:', ['1622', '1638', '1649', '1653'], 2, ''),
      Q.mcq('The Battle of Saraighat (1671) was won by:', ['Mir Jumla', 'Ahoms under Lachit Borphukan', 'Ram Singh', 'Shaista Khan'], 1, ''),
      Q.ch('Arrange chronologically:', ['Akbar captures Kandahar', 'Shah Abbas I captures Kandahar', 'Ali Mardan Khan surrenders Kandahar to Mughals', 'Kandahar finally lost'], '')
    ] });

  T({ id: 'h5-econ', u: 'H5', t: 'Agriculture, irrigation, village economy, peasantry, urbanization & demography', h: 2.5,
    p: [
      'Two harvests: **rabi** (winter: wheat, barley, gram) & **kharif** (monsoon: rice, millets, cotton). Ain lists many cash crops: **sugarcane, cotton, indigo** (Bayana, Sarkhej), **opium**, poppy.',
      'New World crops via Portuguese: **tobacco** (early 17th c.; Jahangir tried to ban smoking), **maize, chillies**, pineapple, papaya, cashew.',
      'Irrigation: wells with **saqiya/Persian wheel** (Babur describes), tanks, canals — **Firoz’s Western Yamuna canal**, Shah Jahan’s **Nahr-i-Faiz** (Ali Mardan Khan), **Nahr-i-Bahisht**; **karez** at Bidar.',
      'Village: muqaddam & patwari; artisans paid in shares (**jajmani**). The “self-sufficient village republic” idea (Metcalfe, Marx) is now questioned — villages were linked to markets via cash revenue.',
      'Peasants: **khud-kasht** (resident cultivators), **pahi-kasht** (non-resident, often lower rates), **muzarian** (tenants). Irfan Habib — *The Agrarian System of Mughal India* (1963).',
      'Grants & loans: **madad-i-maash**, **inam**; **taqavi** (state loans; MBT’s **sondhar**).',
      'Urbanization: big cities **Agra, Delhi, Lahore, Fatehpur Sikri, Ahmedabad, Surat, Patna, Dhaka, Burhanpur, Masulipatnam**; Irfan Habib estimates ~15% urban population around 1600.',
      'Population c. 1600: **Moreland ~100 million**, Kingsley Davis ~125 million, **Shireen Moosvi ~145 million**.'
    ],
    m: [['Khud = “Khud ka” (own village)', 'Khud-kasht = resident; Pahi-kasht = from outside (pahi = traveller).']],
    f: ['Babur complained that Hindustan had no running-water gardens — so he made them!'],
    d: 'Mughal peasantry\n Khud-kasht (resident, own land)\n Pahi-kasht (non-resident)\n Muzarian (tenants)\n Landless labourers',
    k: ['Explain why pahi-kasht peasants often got lower revenue rates.'],
    r: ['Satish Chandra ch. 16', 'IGNOU MHI-105'],
    q: [
      Q.mcq('Pahi-kasht peasants were:', ['Resident owner-cultivators', 'Non-resident cultivators', 'Landless labourers', 'Village officials'], 1, ''),
      Q.mcq('“The Agrarian System of Mughal India” was written by:', ['W.H. Moreland', 'Irfan Habib', 'Shireen Moosvi', 'S. Nurul Hasan'], 1, ''),
      Q.mt('Match the estimate of India’s population c. 1600 with the scholar:', ['~100 million', '~125 million', '~145 million', 'Agrarian System of Mughal India'], ['W.H. Moreland', 'Kingsley Davis', 'Shireen Moosvi', 'Irfan Habib'], '', ['Estimate / Work', 'Scholar'])
    ] });

  T({ id: 'h5-trade', u: 'H5', t: 'Industries, trade, European trade, hundi, currency, mints, famines & revolts', h: 2.5,
    p: [
      'Textiles: cotton (**Gujarat, Coromandel – chintz/kalamkari, Bengal – Dhaka muslin**), silk (**Kasimbazar**, Gujarat patola), **Kashmir shawls**; **karkhanas** (imperial workshops). Others: **indigo, saltpetre (Bihar), sugar, shipbuilding** (Surat, Masulipatnam).',
      'Technology: **spinning wheel** & carding bow spread (13th–14th c.), paper, gunpowder & artillery (Babur), worm-gear cotton gin (Irfan Habib, *Technology in Medieval India*).',
      'Organisation: **dadani** (advance payments to weavers by merchants/companies) — putting-out system.',
      'Internal trade: **Banjaras** (bullock caravans), river traffic, roads & sarais. Ports: **Surat** (main Mughal port), Cambay, Broach, **Masulipatnam**, Pulicat, **Hugli, Satgaon, Chittagong**, Calicut, Cochin.',
      'Exports: textiles, indigo, saltpetre, spices, sugar. Imports: **silver & gold bullion** (India = “sink of precious metals”), horses, luxuries.',
      'Merchants: **Virji Vohra** (Surat), **Abdul Ghafur** (Surat ship-owner), **Shantidas Jhaveri** (Ahmedabad), **Jagat Seth** (Bengal bankers), **Mir Jumla**, Chettis, Khatris, Bohras, Armenians.',
      'Credit: **hundi** (bill of exchange), **sarrafs** (money-changers/bankers), **bima** (insurance for goods & ships).',
      'Currency: Akbar’s **mohur** (gold), **rupaya** (silver), **dam** (copper; **40 dams = 1 rupee**); many mints & **free coinage**; Jahangir’s **zodiac coins** & Nur Jahan’s name on coins.',
      'State income: land revenue (main), customs (~2.5–3.5%), mint, jizya, zakat, escheat, **peshkash**, booty. Expenditure: army, court, buildings.',
      'Famines: Doab (MBT, 1330s–40s), 1555–56, 1595–98, **1630–32 Deccan–Gujarat** (Peter Mundy) — relief through **langars**, remission, taqavi. Peasant revolts: Doab (MBT), **Jats, Satnamis, Sikhs, Marathas** (agrarian roots per Irfan Habib).'
    ],
    m: [['Surat merchants “V-A-S” = Virji, Abdul, Shantidas', 'Virji Vohra (Surat), Abdul Ghafur (Surat), Shantidas (Ahmedabad).'],
      ['“40 dam = 1 rupee”', 'Copper dam to silver rupaya under Akbar.']],
    f: ['Virji Vohra was so rich that the English Company borrowed money from him.', 'Dhaka muslin was so fine it was nicknamed “woven air” (abrawan — running water).'],
    d: 'Mughal trade system\n Producers (weavers, peasants)\n  ← dadani advances\n Merchants & brokers\n  ← hundi & sarraf credit\n Ports (Surat, Hugli, Masulipatnam)\n  → Europe, West Asia, SE Asia\n  ← bullion in',
    k: ['Explain how a hundi works with an example of a merchant from Surat paying in Agra.'],
    r: ['Satish Chandra ch. 16', 'IGNOU MHI-105'],
    q: [
      Q.mcq('Hundi in medieval India was a:', ['Land tax', 'Bill of exchange', 'Insurance policy', 'Weaver’s guild'], 1, ''),
      Q.mcq('Virji Vohra was a leading merchant of:', ['Ahmedabad', 'Surat', 'Masulipatnam', 'Hugli'], 1, ''),
      Q.mcq('Under Akbar, one rupee was equal to:', ['16 dams', '32 dams', '40 dams', '64 dams'], 2, ''),
      Q.ar('India was called a “sink of precious metals”.', 'Indian exports were paid for largely in gold and silver bullion.', 0, '')
    ] });
})(window.JRF);

(function (J) {

  T({ id: 'h6-sufi', u: 'H6', t: 'Sufism: orders, beliefs, practices, saints', h: 2.5,
    p: [
      'Terms: **khanqah** (hospice), **pir/shaikh** & **murid** (disciple), **silsila** (chain), **sama** (music), **zikr** (remembrance), **malfuzat** (conversations), **maktubat** (letters), **dargah**, **urs** (death anniversary).',
      '**Ba-shara** (follow sharia) vs **be-shara** (outside it — Qalandars, Madaris, Malangs, Haidaris).',
      '**Wahdat-ul-wujud** (unity of being — **Ibn al-Arabi**) vs **wahdat-ul-shuhud** (unity of witnessing — **Shaikh Ahmad Sirhindi**).',
      '**Al-Hujwiri** (Data Ganj Bakhsh, Lahore) – ***Kashf-ul-Mahjub***, earliest Persian treatise on Sufism. Abul Fazl lists **14 silsilas**.',
      '**Chishti**: **Muinuddin Chishti** (Ajmer, came c. 1192) → **Qutbuddin Bakhtiyar Kaki** (Delhi) → **Baba Farid** (Ajodhan/Pakpattan; verses in Adi Granth) → **Nizamuddin Auliya** (Delhi; disciple **Amir Khusrau**; *Fawaid-ul-Fuad* by Amir Hasan Sijzi) → **Nasiruddin Chiragh-i-Dilli**. Deccan: **Gesu Daraz** (Gulbarga). Akbar’s pir: **Shaikh Salim Chishti**. Chishtis kept away from the court and lived in poverty.',
      '**Suhrawardi**: **Bahauddin Zakariya** (Multan) — accepted state grants and posts; **Jalaluddin Tabrizi** (Bengal).',
      '**Firdausi**: **Sharfuddin Yahya Maneri** (Bihar; *Maktubat*). **Qadiri**: **Mian Mir** (Lahore), Mulla Shah — **Dara Shikoh** joined this order. **Shattari**: **Muhammad Ghaus Gwaliori** (Tansen’s teacher).',
      '**Naqshbandi**: brought by **Khwaja Baqi Billah**; **Shaikh Ahmad Sirhindi** (“Mujaddid Alf-i-Sani”) opposed Akbar’s ideas, imprisoned by Jahangir; later **Shah Waliullah** (18th c.).',
      '**Rishi order** (Kashmir): **Nuruddin Rishi (Nund Rishi)**, influenced by **Lal Ded**.',

    m: [['Chishti chain “M-Q-F-N-N” = “My Queen Feeds Nine Nightingales”', 'Muinuddin → Qutbuddin Kaki → Farid → Nizamuddin → Nasiruddin Chiragh.'],
      ['Shuhud vs Wujud', 'Wujud = everything IS God (Ibn Arabi). Shuhud = everything WITNESSES God (Sirhindi).']],

    k: ['Explain why Chishtis became more popular than Suhrawardis in north India.'],

    q: [
      Q.mt('Match the Sufi saint with the place:', ['Muinuddin Chishti', 'Baba Farid', 'Bahauddin Zakariya', 'Gesu Daraz'], ['Ajmer', 'Ajodhan (Pakpattan)', 'Multan', 'Gulbarga'], '', ['Saint', 'Place']),
      Q.mcq('Kashf-ul-Mahjub was written by:', ['Ali Hujwiri', 'Nizamuddin Auliya', 'Amir Khusrau', 'Ahmad Sirhindi'], 0, ''),
      Q.mcq('The doctrine of wahdat-ul-shuhud was propounded by:', ['Ibn al-Arabi', 'Shaikh Ahmad Sirhindi', 'Shah Waliullah', 'Mian Mir'], 1, ''),

  T({ id: 'h6-bhak', u: 'H6', t: 'Bhakti movement: Shaivism, Vaishnavism, Shaktism; saints north & south; women saints', h: 3,
    p: [
      '**Saguna** (God with form – Rama/Krishna: Tulsidas, Surdas, Mira, Chaitanya) vs **Nirguna** (formless: Kabir, Nanak, Dadu, Raidas).',
      '**Ramananda** (14th–15th c.): Rama bhakti in Hindi; disciples from all castes — **Kabir, Raidas, Dhanna, Sena, Pipa**, Padmavati.',
      '**Kabir** (weaver, Banaras): dohas/sakhis in *Bijak*; rejected idols, caste, rituals of both Hindus & Muslims. **Raidas** (cobbler, Banaras). **Dadu Dayal** (Rajasthan; Dadupanth; met Akbar).',
      '**Vallabhacharya**: **Shuddhadvaita**, **Pushti Marg** (Srinathji). **Surdas** (*Sursagar*, Krishna). **Tulsidas** — ***Ramcharitmanas*** (Awadhi, 1574). **Mirabai** (Merta princess married into Mewar; Krishna devotee).',
      '**Chaitanya** (Bengal; **Gaudiya Vaishnavism**, **kirtan**, achintya bhedabheda; lived at Puri). **Shankaradeva** (Assam; **Ekasarana Dharma**, **satras & namghars**, Ankiya Naat, Borgeet). **Narsinh Mehta** (Gujarat; “Vaishnav Jan To”).',
      'Maharashtra **Varkari** (Vithoba, Pandharpur): **Jnaneshwar** (*Jnaneshwari* 1290), **Namdev** (tailor; hymns in Guru Granth), **Eknath**, **Tukaram** (*abhangas*), **Ramdas** (*Dasbodh*). Women: **Janabai, Muktabai, Bahinabai**.',
      'Shaivism: **Virashaiva/Lingayat** (Basava, **Allama Prabhu, Akka Mahadevi** — vachanas); **Kashmir Shaivism**; **Nath panth** (**Gorakhnath**, hatha yoga); **Lal Ded** (Kashmiri vakhs).',
      '**Shaktism**: worship of the Goddess; **Shakti pithas** (e.g. **Kamakhya**, Assam), Shakta tantras, Kalika Purana; Bengal Shaktism (later Ramprasad Sen).',
      'Women saints: **Andal, Karaikkal Ammaiyar, Akka Mahadevi, Lal Ded, Mirabai, Janabai, Bahinabai**.',
      'Impact: vernacular literature, challenge to caste & ritual, space for women & low castes, Hindu–Muslim cultural exchange; but caste system largely survived.'
    ],
    m: [['Ramananda’s disciples “K-R-D-S-P” = “Kabir Ravi Dhanna Sena Pipa”', 'Weaver, cobbler, Jat peasant, barber, Rajput prince.'],
      ['“Saguna Sings Stories; Nirguna Needs Nothing”', 'Saguna = Rama/Krishna stories; Nirguna = formless God.']],
    f: ['When Kabir died, legend says Hindus and Muslims quarrelled over his body and found only flowers under the sheet.', 'Shankaradeva’s satras still run as monasteries on Majuli river island.'],
    d: 'Bhakti saints by region\n North — Ramananda, Kabir, Raidas, Tulsidas, Surdas\n Rajasthan — Mirabai, Dadu\n Bengal — Chaitanya\n Assam — Shankaradeva\n Gujarat — Narsinh Mehta\n Maharashtra — Jnaneshwar, Namdev, Eknath, Tukaram\n Karnataka — Basava, Akka Mahadevi\n Kashmir — Lal Ded',
    k: ['Pick 5 saints and say region + one work/idea for each without looking.'],
    r: ['Satish Chandra ch. 11, 17', 'V.D. Mahajan ch. 19'],
    q: [

  T({ id: 'h6-sikh', u: 'H6', t: 'Sikh movement: Guru Nanak to the Khalsa', h: 2,

      '**Guru Nanak (1469–1539)**, born **Talwandi** (Nankana Sahib): one formless God, **nam japna, kirat karna, vand chhakna**; **langar & sangat**; travels (**udasis**); settled at **Kartarpur**; *Babarvani* verses on Babur’s invasion.',
      '**Angad** (Gurmukhi script, langar) · **Amar Das** (**manji** system, opposed sati & purdah, Goindwal) · **Ram Das** (founded **Ramdaspur/Amritsar**) · **Arjan Dev** (**Adi Granth 1604**, **Harmandir Sahib**, **masands & dasvandh**; executed by Jahangir 1606).',
      '**Hargobind**: **miri & piri** (two swords), **Akal Takht (1606)**, armed followers · Har Rai · Har Krishan · **Tegh Bahadur** (executed by Aurangzeb, **1675**, Delhi).',
      '**Gobind Singh**: founded **Khalsa (13 April 1699, Baisakhi, Anandpur Sahib)** — **Panj Pyare**, **five Ks** (kesh, kangha, kara, kachera, kirpan), names Singh & Kaur; *Zafarnama* to Aurangzeb; ended personal guruship (Guru Granth & Panth); killed at **Nanded (1708)**.',

  T({ id: 'h6-soc', u: 'H6', t: 'Social classes, rural society, women, education & madrasas', h: 2,
    p: [
      'Ruling class: Mughal nobility of **Turanis, Iranis, Afghans, Indian Muslims (Shaikhzadas), Rajputs, Marathas**. M. Athar Ali: Hindu share of nobility rose under Aurangzeb (~31%), mostly Marathas.',
      '**Ulema**: theologians filling posts of **qazi, mufti, sadr, muhtasib**; held madad-i-maash grants.',
      'Merchants & professionals: **banias, Marwaris, Khatris, Bohras, Khojas, Chettis**, sarrafs, dalals (brokers); **Kayasthas & Khatris** as scribes; hakims & vaids.',
      '**Rajput society**: clan brotherhood (**bhaibant**), chivalry, **jauhar & saka**, sati, watan jagirs; Dirk Kolff — *Naukar, Rajput and Sepoy* (military labour market).',
      'Rural society: petty chiefs (**rais, ranas, rawats**), officials (**khut, muqaddam, chaudhari, patwari**), cultivators (**khud-kasht, pahi-kasht, muzarian**), non-cultivating & menial groups, **artisans (kamins)** in jajmani ties.',
      'Women: **zanana/harem** & purdah; powerful royal women — **Gulbadan, Nur Jahan** (coins, farmans), **Jahanara** (Chandni Chowk, sarai; Qadiri), **Zeb-un-Nisa** (poet “Makhfi”); fighters — **Rani Durgavati** (Gondwana, 1564), **Chand Bibi**, **Tarabai**.',
      'Akbar tried to stop **forced sati** & child marriage. **Devadasi** system: women dedicated to temples (music, dance); status declined over time.',
      'Education: **maktabs** (primary) & **madrasas** (higher) — Muizzi (Delhi), **Firozi**, **Mahmud Gawan’s madrasa (Bidar)**; Akbar reformed curriculum (ethics, arithmetic, agriculture, astronomy); 18th c. **Dars-i-Nizami** (Firangi Mahal, Lucknow).',
      'Hindu learning: **pathshalas, tols**; **Navadvipa** (Navya Nyaya – Raghunatha Shiromani), Varanasi, Mithila. **Jaunpur** = “**Shiraz of India**”.'

    m: [['Nobility groups “T-I-A-S-R-M”', 'Turani, Irani, Afghan, Shaikhzada, Rajput, Maratha — “Tea In A Small Royal Mug”.']],
    f: ['Jahanara designed Chandni Chowk with a pool that reflected the moonlight — hence “Moonlight Square”.'],
    d: 'Medieval society layers\n Ruling class (nobles, zamindars)\n Ulema & religious elites\n Merchants & professionals\n Peasants (khud-kasht, pahi-kasht)\n Artisans & menial groups',
    k: ['Give one example each of a powerful Mughal woman, a woman warrior, and a woman saint.'],
    r: ['Satish Chandra ch. 16–17', 'IGNOU MHI-106'],

      Q.mcq('Rani Durgavati ruled over:', ['Malwa', 'Gondwana', 'Mewar', 'Bundelkhand'], 1, '')
    ] });

  T({ id: 'h6-paint', u: 'H6', t: 'Painting schools & music', h: 2,
    p: [
      'Pre-Mughal: Western Indian **Jain manuscripts** (*Kalpasutra*), **Nimatnama** (cookbook, Mandu), *Chaurapanchashika*.',
      '**Mughal**: Humayun brought **Mir Sayyid Ali & Abdus Samad** from Persia. Akbar’s **tasvir-khana**: ***Hamzanama*** (~1400 paintings), *Razmnama*, *Akbarnama*; artists **Daswanth, Basawan**, Kesu, Lal, Miskina.',
      '**Jahangir** = peak: portraits & nature studies — **Ustad Mansur** (birds, flowers, zebra), **Abul Hasan** (“Nadir-uz-Zaman”), **Bishandas** (portraits), Manohar, Govardhan; European influences (halo, perspective). Shah Jahan: formal court scenes. Aurangzeb: decline → artists move to Rajput & Pahari courts.',
      '**Rajasthani**: Mewar (Sahibdin), **Bundi, Kota** (hunts), **Kishangarh** (*Bani Thani* by **Nihal Chand**, patron Sawant Singh “Nagaridas”), Marwar, Bikaner, Jaipur. Themes: **Ragamala, Krishna-lila, Baramasa, Rasikapriya, Gita Govinda**.',
      '**Pahari**: **Basohli** (bold colours, beetle-wing), **Guler** (**Pandit Seu, Manaku, Nainsukh**), **Kangra** (Raja **Sansar Chand**; lyrical), Chamba, **Garhwal** (**Mola Ram**, poet-painter; school seeded by painters who came with Dara’s son Sulaiman Shikoh, 1658).',
      'Deccani: Bijapur (*Nujum-ul-Ulum*), Ahmadnagar (*Tarif-i-Husain Shahi*), Golconda.',
      'Music: **Amir Khusrau** (qawwali, tarana; Indo-Persian ragas), **Sarangadeva**’s *Sangita Ratnakara* (13th c.), **Raja Man Singh Tomar** of Gwalior (**dhrupad**; *Man Kautuhal*), **Hussain Shah Sharqi** (khayal tradition), **Tansen** (Akbar; Miyan ki Malhar, Darbari Kanhada; guru **Swami Haridas**), **Baz Bahadur & Rupmati** (Malwa), Ibrahim Adil Shah II (*Kitab-i-Nauras*), Faqirullah’s *Rag Darpan* (Aurangzeb’s reign), **Sadarang–Adarang** (Muhammad Shah).',
      'Carnatic: **Purandaradasa** (“father of Carnatic music”, Vijayanagara), **Venkatamakhi** (72 melakartas); Trinity — **Tyagaraja, Dikshitar, Shyama Shastri** (18th–19th c.).'
    ],
    m: [['Pahari “B-G-K-G”', 'Basohli (bold) → Guler (refined) → Kangra (lyrical) → Garhwal (Mola Ram): “Big Guys Keep Going”.'],
      ['Jahangir’s artists “M-A-B” = Mansur, Abul Hasan, Bishandas', 'Nature, title-holder, portraits.']],
    f: ['Jahangir claimed he could tell which artist painted each face in a group painting.', 'Bani Thani is often called the “Indian Mona Lisa”.'],
    d: 'Painting schools\n Mughal (Akbar → Jahangir peak → Shah Jahan formal)\n Rajasthani (Mewar, Bundi, Kota, Kishangarh)\n Pahari (Basohli, Guler, Kangra, Garhwal)\n Deccani (Bijapur, Golconda, Ahmadnagar)',
    k: ['Describe a Kishangarh painting so someone could recognise it.'],
    r: ['Satish Chandra ch. 17', 'V.D. Mahajan (Mughal culture chapter)'],
    q: [
      Q.mt('Match the artist with the school/patron:', ['Ustad Mansur', 'Nihal Chand', 'Nainsukh', 'Mola Ram'], ['Mughal (Jahangir)', 'Kishangarh', 'Guler/Jasrota', 'Garhwal'], '', ['Artist', 'School']),
      Q.mcq('The Hamzanama was illustrated under:', ['Babur', 'Humayun', 'Akbar', 'Jahangir'], 2, ''),
      Q.mcq('Dhrupad is associated with the court of:', ['Raja Man Singh Tomar', 'Baz Bahadur', 'Hussain Shah Sharqi', 'Ibrahim Adil Shah II'], 0, ''),
      Q.mcq('Who is called the “father of Carnatic music”?', ['Tyagaraja', 'Purandaradasa', 'Venkatamakhi', 'Annamacharya'], 1, ''),
      Q.ar('Mughal painting declined under Aurangzeb.', 'He withdrew imperial patronage, and many artists moved to regional courts.', 0, '')

  T({ id: 'h6-arch', u: 'H6', t: 'Indo-Islamic, Mughal & regional architecture; gardens; Maratha forts; temples', h: 3,
    p: [
      'Indo-Islamic features: **true arch & dome**, minarets, calligraphy, arabesque & geometry, **lime mortar**, jali; Indian motifs (lotus, kalash, bell).',
      'Slave dynasty: **Quwwat-ul-Islam**, **Qutb Minar** (Aibak → Iltutmish; top storeys repaired by Firoz), **Adhai Din ka Jhonpra**, **Sultan Ghari**, **Balban’s tomb** (earliest true arch). Khalji: **Alai Darwaza**, Siri, Hauz-i-Alai, Jamaat Khana.',
      'Tughlaq: **sloping (battered) walls**, plain style — **Tughlaqabad**, **Ghiyasuddin’s tomb**, Firozabad (Kotla), Hauz Khas madrasa; **Khan-i-Jahan Telangani’s tomb** (first octagonal tomb in Delhi).',
      'Sayyid–Lodi: **octagonal tombs** (Mubarak Shah, Muhammad Shah) & square tombs (Bara Gumbad); **Sikandar Lodi’s tomb** = early **double dome**; Moth ki Masjid.',
      'Provincial: **Jaunpur** (Atala Masjid – propylon screens), **Bengal** (brick, curved roofs; **Adina Masjid**, Chhota Sona Masjid), **Gujarat** (Jama Masjid Ahmedabad, **Sidi Saiyyed jali**, **Adalaj** & **Rani-ki-Vav** stepwells), **Malwa/Mandu** (Jahaz Mahal, Hindola Mahal, **Hoshang Shah’s marble tomb**), **Deccan** (Gulbarga mosque, **Gol Gumbaz**, Ibrahim Rauza, **Charminar 1591**), Kashmir (wooden mosques).',
      '**Vijayanagara (Hampi)**: Virupaksha, **Vithala** (musical pillars, stone chariot), **Hazara Rama**, Lotus Mahal, Elephant stables, **Mahanavami Dibba**, tall **raya gopurams**, kalyana mandapas.',
      'Mughal: **Humayun’s tomb** (charbagh, double dome) → **Akbar**: **Agra Fort**, **Fatehpur Sikri** (Buland Darwaza, Panch Mahal, Diwan-i-Khas, Jama Masjid, Salim Chishti’s tomb), **Sikandra** tomb → **Jahangir/Nur Jahan**: **Itimad-ud-Daula** (white marble, **pietra dura**) → **Shah Jahan**: **Taj Mahal** (1632–53, Ustad Ahmad Lahori), **Red Fort Delhi**, **Jama Masjid Delhi**, Moti Masjid Agra → **Aurangzeb**: **Badshahi Masjid** (Lahore), **Bibi ka Maqbara**.',
      '**Mughal gardens** (charbagh = paradise): **Ram/Aram Bagh** (Agra, Babur), **Nishat Bagh** (Asaf Khan), **Shalimar** (Srinagar – Jahangir; Lahore – Shah Jahan), **Pinjore** (Fidai Khan), Verinag, Achabal.',
      '**Maratha forts**: hill forts (**Raigad, Rajgad, Torna, Pratapgad, Sinhagad, Shivneri**), sea forts (**Sindhudurg**, Vijaydurg, Kolaba, Suvarnadurg); **Janjira** (Siddis) never fell. “**Maratha Military Landscapes of India**” – UNESCO World Heritage (2025).',
      'Temples & shrines: **Ranakpur** Jain temple (1437), Dilwara, **Bishnupur** terracotta temples (Malla kings), **Govind Dev temple, Vrindavan (1590, Man Singh)**, **Kashi Vishwanath** rebuilt by **Ahilyabai Holkar (1780)**, **Harmandir Sahib**; dargahs at Ajmer, Delhi, Fatehpur Sikri.'
    ],
    m: [['Delhi Sultanate style “Grand → Sloping → Octagonal”', 'Slave/Khalji grand arches → Tughlaq sloping walls → Sayyid-Lodi octagonal tombs.'],
      ['Mughal material shift “Red → White”', 'Akbar red sandstone → Jahangir/Shah Jahan white marble + pietra dura.']],
    f: ['Gol Gumbaz’s whispering gallery repeats a whisper several times.', 'Fatehpur Sikri was abandoned within about 15 years, possibly due to water shortage.'],
    d: 'Mughal architecture evolution\n Babur — gardens\n Humayun’s tomb — charbagh + double dome\n Akbar — red sandstone, Fatehpur Sikri\n Jahangir — marble & pietra dura (Itimad-ud-Daula)\n Shah Jahan — Taj, Red Fort\n Aurangzeb — Badshahi Masjid, Bibi ka Maqbara',
    k: ['Walk me through Fatehpur Sikri: name 5 buildings and what each was for.'],
    r: ['Satish Chandra ch. 11, 17', 'V.D. Mahajan ch. 17'],
    q: [
      Q.mt('Match the monument with the builder:', ['Itimad-ud-Daula’s tomb', 'Bibi ka Maqbara', 'Charminar', 'Gol Gumbaz'], ['Nur Jahan', 'Azam Shah (Aurangzeb’s reign)', 'Muhammad Quli Qutb Shah', 'Muhammad Adil Shah'], '', ['Monument', 'Builder']),
      Q.mcq('Sloping walls are a feature of the architecture of the:', ['Khaljis', 'Tughlaqs', 'Lodis', 'Mughals'], 1, ''),
      Q.mcq('Pietra dura was first used on a large scale in:', ['Humayun’s tomb', 'Itimad-ud-Daula’s tomb', 'Taj Mahal', 'Akbar’s tomb'], 1, ''),
      Q.mcq('The Panch Mahal is located at:', ['Agra Fort', 'Fatehpur Sikri', 'Red Fort', 'Mandu'], 1, ''),
      Q.ch('Arrange in chronological order of construction:', ['Humayun’s tomb', 'Buland Darwaza', 'Itimad-ud-Daula’s tomb', 'Taj Mahal'], ''),
      Q.mt('Match the garden with its location:', ['Nishat Bagh', 'Pinjore Garden', 'Ram Bagh', 'Shalimar Bagh (Shah Jahan)'], ['Srinagar', 'Haryana', 'Agra', 'Lahore'], '', ['Garden', 'Place'])
    ] });

  T({ id: 'h7-src', u: 'H7', t: 'Sources of modern Indian history & major approaches', h: 2,
    p: [
      'Archives: **National Archives of India** (began as Imperial Record Department, Calcutta, **1891**), state & presidency archives, Portuguese (Goa), Dutch, French (Pondicherry) records, **India Office Records** (British Library, London), judicial records, private papers (**Nehru Memorial Museum & Library**).',
      'Biographies, memoirs & travel accounts (Bishop Heber, Fanny Parkes, Emily Eden); **newspapers** — first: ***Hicky’s Bengal Gazette* (1780)** by James Augustus Hicky; *Native Newspaper Reports* (weekly official translations); oral evidence; creative literature (*Anandamath*, Premchand); painting (**Company school, Kalighat, Raja Ravi Varma**), photographs, monuments, coins.',
      '**Colonial approach**: **James Mill** – *History of British India* (1817; Hindu–Muslim–British periods), Elphinstone, **V.A. Smith**.',
      '**Nationalist**: **Dadabhai Naoroji**, **R.C. Dutt** (*Economic History of India*), Tara Chand, R.C. Majumdar.',
      '**Marxist**: **R.P. Dutt** (*India Today*, 1940), **A.R. Desai** (*Social Background of Indian Nationalism*), **Bipan Chandra**, **Sumit Sarkar** (*Modern India 1885–1947*).',
      '**Subaltern**: **Ranajit Guha** (*Subaltern Studies* from 1982; *Elementary Aspects of Peasant Insurgency*), Partha Chatterjee, Shahid Amin, Gyanendra Pandey, David Arnold, Dipesh Chakrabarty.',
      '**Cambridge school**: **Anil Seal** (*Emergence of Indian Nationalism*, 1968), John Gallagher, Gordon Johnson, **Judith Brown** — nationalism as elite competition & collaboration.',
      'Also: communalist, liberal/neo-liberal and **feminist** historiography.'
    ],
    m: [['“Mill Marx Mob Mates” = Colonial, Marxist, Subaltern, Cambridge', 'Mill (colonial) · Dutt/Desai (Marxist) · Guha (subaltern – the “mob”, people) · Seal (Cambridge – elite “mates”).']],
    f: ['James Mill wrote the History of British India without ever visiting India or knowing an Indian language.'],
